<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../">
  <script>
    (() => {
      let theme = 'light';
      try {
        const savedTheme = localStorage.getItem('apml-theme');
        if (savedTheme === 'dark' || savedTheme === 'light') theme = savedTheme;
      } catch (error) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>APML Portal — Enterprise Cloud Drive</title>

  <link rel="icon" type="image/svg+xml" href="logo.svg?v=22.3">
  <link rel="stylesheet" href="core/common.css?v=23.0">

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- SWEETALERT2 CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- SIMPLELIGHTBOX -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/simplelightbox/2.14.2/simple-lightbox.min.css" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/simplelightbox/2.14.2/simple-lightbox.min.js"></script>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --primary: #c21d1d;
      --primary-dark: #991b1b;
      --primary-gradient: linear-gradient(135deg, #c21d1d 0%, #e11d48 50%, #f43f5e 100%);
      --primary-soft: rgba(194, 29, 29, 0.08);
      
      --bg-base: #F5EFEB;
      --surface-glass: rgba(255, 255, 255, 0.88);
      --surface-card: rgba(255, 255, 255, 0.95);
      
      --border-subtle: rgba(225, 212, 204, 0.85);
      --border-hover: rgba(194, 29, 29, 0.35);
      
      --text-main: #141210;
      --text-secondary: #3d3835;
      --text-muted: #736b66;
      --text-faint: #a8a29e;
      
      --radius-xl: 18px;
      --radius-pill: 9999px;
      
      --shadow-card: 0 1px 3px rgba(28, 25, 23, 0.04), 0 8px 24px -4px rgba(28, 25, 23, 0.03);
      --shadow-float: 0 20px 40px -12px rgba(194, 29, 29, 0.12), 0 4px 12px rgba(0, 0, 0, 0.02);
      
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
      overflow-y: scroll !important;
      height: 100%;
    }

    body {
      background: var(--apml-color-page, #f7f5f0) !important;
      background-image: none !important;
      background-attachment: initial;
      color: var(--text-main);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: visible !important;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    body::before { display: none !important; }

    /* Shared CSS spinner overlay is styled by core/common.js. */

    #header-container {
      position: sticky !important;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    .drive-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px 80px;
      margin-top: 110px !important;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .drive-head-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .drive-title {
      font-family: var(--font-display);
      font-size: clamp(30px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .drive-title span {
      font-family: var(--font-display);
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .drive-sub-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .drive-sub {
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 500;
    }

    .drive-stats-pills {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--border-subtle);
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .stat-pill strong {
      color: var(--primary);
    }

    .drive-action-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--surface-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 18px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-card);
    }

    .breadcrumb-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }

    .breadcrumb-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--primary);
    }

    .breadcrumb-item:hover {
      text-decoration: underline;
    }

    .drive-action-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-drive-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1.5px solid var(--border-subtle);
      color: var(--text-main);
      padding: 9px 18px;
      border-radius: var(--radius-pill);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
    }

    .btn-drive-action:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }

    .btn-drive-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 14px rgba(194, 29, 29, 0.2);
    }

    .btn-drive-primary:hover {
      background: var(--primary-dark);
      color: #ffffff;
    }

    .drive-section-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .folders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .folder-card {
      background: var(--surface-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: all 0.2s ease;
    }

    .folder-card:hover, .folder-card.drag-over {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-float);
      background: #fff5f5;
    }

    .folder-card-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .folder-card-left .material-symbols-outlined {
      color: var(--primary);
      font-size: 24px;
    }

    .folder-card-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .folder-delete-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .folder-delete-btn:hover {
      background: #fee2e2;
      color: #dc2626;
    }

    .drive-files-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }

    @media (max-width: 1100px) {
      .drive-files-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .drive-files-grid {
        grid-template-columns: 1fr;
      }
    }

    .drive-file-grid-card {
      background: var(--surface-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      cursor: grab;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .drive-file-grid-card:active {
      cursor: grabbing;
    }

    .drive-file-grid-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-hover);
      box-shadow: var(--shadow-float);
      background: #ffffff;
    }

    .grid-preview-box {
      width: 100%;
      height: 180px;
      background: #0f172a;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      display: block;
    }

    .grid-preview-box img, .grid-preview-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .grid-preview-box .drive-preview-image { background: #1e293b; }

    .preview-placeholder-doc { background: #f8fafc; }
    .preview-placeholder-excel { background: #f0fdf4; }
    .preview-placeholder-pdf { background: #fff1f2; }
    .preview-placeholder-zip { background: #fffbeb; }

    .grid-preview-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #475569;
    }

    .grid-preview-placeholder span.material-symbols-outlined {
      font-size: 42px;
    }

    .grid-preview-placeholder span.ext-badge {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      background: rgba(0,0,0,0.06);
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .card-loading-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #1e293b 0%, #334155 50%, #1e293b 100%);
      background-size: 200% 100%;
      animation: shimmerLoading 1.5s infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      gap: 10px;
      z-index: 10;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    @keyframes shimmerLoading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .card-loading-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .card-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .grid-card-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .file-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-timestamp {
      font-size: 10.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .file-details-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .file-type-pill {
      background: rgba(194, 29, 29, 0.08);
      color: var(--primary);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .file-pill-group {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .media-source-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1);
    }

    .file-size-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }

    .grid-card-footer {
      padding: 0 16px 16px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .btn-download-file {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #ffffff;
      background: var(--primary);
      border: none;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(194, 29, 29, 0.2);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-download-file:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .card-actions-admin {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-edit-file, .btn-delete-file {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 0;
    }

    .btn-edit-file {
      color: #2563eb;
      background: #eff6ff;
    }

    .btn-edit-file:hover {
      background: #2563eb;
      color: #ffffff;
    }

    .btn-delete-file {
      color: #dc2626;
      background: #fee2e2;
    }

    .btn-delete-file:hover {
      background: #dc2626;
      color: #ffffff;
    }

    /* PAGINATION */
    .pagination-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 36px;
      padding: 16px 24px;
      background: var(--surface-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    .pagination-pages-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-page {
      min-width: 40px;
      height: 40px;
      background: transparent;
      border: 1.5px solid transparent;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 0 6px;
    }

    .btn-page:hover:not(:disabled) {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .btn-page.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(194, 29, 29, 0.25);
    }

    .btn-page:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .page-ellipsis {
      padding: 0 4px;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .pagination-jump-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .jump-input {
      width: 56px;
      height: 34px;
      background: #ffffff;
      border: 1.5px solid var(--border-subtle);
      border-radius: 10px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .jump-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(194, 29, 29, 0.15);
    }

    .btn-jump-go {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1.5px solid transparent;
      padding: 0 14px;
      height: 34px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-jump-go:hover {
      background: var(--primary);
      color: #ffffff;
    }

    .state-msg {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
      font-weight: 600;
      background: var(--surface-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      grid-column: 1 / -1;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--border-subtle);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 900px) {
      .drive-container {
        margin-top: 95px !important;
      }
      .drive-action-bar {
        flex-direction: column;
        align-items: flex-start;
      }
      .drive-action-buttons {
        width: 100%;
        justify-content: space-between;
      }
    }

    @media (max-width: 600px) {
      .drive-container { margin-top:76px!important; padding-left:10px!important; padding-right:10px!important; }
      .drive-files-grid { grid-template-columns:repeat(2,minmax(0,1fr))!important; gap:9px!important; }
      .drive-file-grid-card { border-radius:12px!important; }
      .grid-preview-box { height:108px!important; }
      .grid-preview-placeholder span.material-symbols-outlined { font-size:30px!important; }
      .grid-card-body { padding:8px!important; gap:4px!important; }
      .file-name { font-size:11px!important; line-height:1.3!important; overflow-wrap:anywhere!important; }
      .file-timestamp,.file-size-label { font-size:9px!important; }
      .file-details-row,.grid-card-footer { gap:5px!important; flex-wrap:wrap!important; }
      .grid-card-footer { padding:7px!important; }
      .btn-download-file,.btn-edit-file,.btn-delete-file { font-size:10px!important; padding:6px 7px!important; }
      .folders-grid { grid-template-columns:repeat(2,minmax(0,1fr))!important; gap:8px!important; margin-bottom:16px!important; }
      .folder-card { padding:9px!important; border-radius:10px!important; gap:5px!important; }
      .folder-card-left { gap:6px!important; }
      .folder-card-left .material-symbols-outlined { font-size:18px!important; }
      .folder-card-name { font-size:10px!important; white-space:normal!important; overflow-wrap:anywhere!important; }
      .pagination-bar { padding:9px!important; gap:8px!important; margin-top:16px!important; }
      .btn-page { min-width:32px!important; height:32px!important; font-size:12px!important; }
    }
  
    /* =========================================================
       APML PREMIUM ENTERPRISE — CLOUD DRIVE PRESENTATION
       Presentation-only overrides. Drive data and behaviours
       remain in the existing markup and JavaScript below.
       ========================================================= */
    :root {
      --primary: var(--apml-color-brand, #b4232c);
      --primary-dark: var(--apml-color-brand-hover, #941c24);
      --primary-gradient: linear-gradient(135deg, #941c24 0%, #b4232c 100%);
      --primary-soft: var(--apml-color-brand-soft, #f8e9e9);
      --bg-base: var(--apml-color-page, #f7f5f0);
      --surface-card: var(--apml-color-surface, #ffffff);
      --surface-glass: rgba(255,255,255,.92);
      --border-subtle: var(--apml-color-border, #e5e1d9);
      --border-hover: rgba(180,35,44,.38);
      --text-main: var(--apml-color-text, #202124);
      --text-secondary: var(--apml-color-text-secondary, #55565a);
      --text-muted: var(--apml-color-text-muted, #777a80);
      --radius-xl: var(--apml-radius-lg, 18px);
      --shadow-card: var(--apml-shadow-soft, 0 2px 8px rgba(32,33,36,.04), 0 12px 28px rgba(32,33,36,.035));
      --shadow-float: var(--apml-shadow-raised, 0 8px 24px rgba(32,33,36,.09));
      --font-sans: var(--apml-font-sans, 'Plus Jakarta Sans', sans-serif);
      --font-display: var(--apml-font-sans, 'Plus Jakarta Sans', sans-serif);
    }

    body {
      background: var(--apml-color-page, #f7f5f0) !important;
      background-image:

    async function handleDirectCatboxUpload(files) {
      if (!files || !files.length) return;
      let successCount = 0;

      for (let i = 0; i < files.length; i++) {
        let file = files[i];
        try {
          const isVideo = (file.type || '').startsWith('video/');
          const limit = isVideo ? MAX_VIDEO_SIZE_BYTES : MAX_FILE_SIZE_BYTES;
          if (file.size > limit) {
            alert(`${file.name} is too big (${(file.size / 1048576).toFixed(1)} MB). Skipping.`);
            continue;
          }

          const formData = new FormData();
          formData.append('file', file);
          formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
          formData.append('folder', CLOUDINARY_FOLDER);

          const res = await fetch(UPLOAD_ENDPOINT, { method: 'POST', body: formData });
          const data = await res.json().catch(() => ({}));

          if (!res.ok || !data.secure_url) {
            const msg = (data.error && data.error.message) || `HTTP ${res.status}`;
            throw new Error(msg);
          }

          await driveFilesRef.push({
            fileId: data.secure_url,
            parentId: currentParentId,
            name: file.name,
            size: file.size || 0,
            timestamp: Date.now()
          });

          successCount++;
        } catch (err) {
          console.error(`Error uploading "${file.name}":`, err);
          alert(`Failed to upload ${file.name}: ${err.message}`);
        }
      }

      document.getElementById('mediaFileInput').value = '';
      if (successCount > 0) {
        renderUI();
      }
    }

    const PROTECTED_FOLDER_NAMES = ['quotation', 'quotations', 'prasad'];
    const PROTECTED_FOLDER_KEYS = ['quotation_folder', 'quotations_archive_protected'];

    function isProtectedFolderObj(folder) {
      if (!folder) return false;
      if (PROTECTED_FOLDER_KEYS.includes(folder.key)) return true;
      return PROTECTED_FOLDER_NAMES.includes(String(folder.name || '').trim().toLowerCase());
    }

    function isInsideProtectedTree(folderId) {
      let id = folderId;
      const seen = new Set();
      while (id && id !== 'root' && !seen.has(id)) {
        seen.add(id);
        const folder = liveFolders.find(f => f.key === id);
        if (!folder) return PROTECTED_FOLDER_KEYS.includes(id);
        if (isProtectedFolderObj(folder)) return true;
        id = folder.parentId;
      }
      return false;
    }

    function canDeleteItem(type, key) {
      if (isCurrentUserAdmin()) return true;
      if (type === 'file') {
        const file = liveFiles.find(f => f.key === key);
        return !(file && isInsideProtectedTree(file.parentId));
      }
      if (type === 'folder') {
        const folder = liveFolders.find(f => f.key === key);
        if (!folder) return true;
        return !(isProtectedFolderObj(folder) || isInsideProtectedTree(folder.parentId) || containsProtectedFolder(key));
      }
      return true;
    }

    function containsProtectedFolder(folderId) {
      const seen = new Set();
      const stack = [folderId];
      while (stack.length) {
        const current = stack.pop();
        if (seen.has(current)) continue;
        seen.add(current);
        liveFolders.filter(f => f.parentId === current).forEach(child => {
          if (isProtectedFolderObj(child)) { seen.add('__found__'); }
          stack.push(child.key);
        });
      }
      return seen.has('__found__');
    }

    function getFileSource(url) {

      if (host.includes('cloudinary.com')) return { label: 'Cloudinary', dotColor: '#3b82f6' };

      return { label: 'Other', dotColor: '#64748b' };
    }

    function formatBytes(bytes, decimals = 1) {
      if (!bytes || bytes === 0) return 'Asset Link';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function formatTimestamp(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      if (isNaN(d.getTime())) return '';
      const day = String(d.getDate()).padStart(2, '0');
      const month = d.toLocaleDateString('en-IN', { month: 'short' });
      const year = d.getFullYear();
      let hours = d.getHours();
      const minutes = String(d.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      return `${day}${month} ${year}, ${hours}:${minutes} ${ampm}`;
    }

    async function handleItemDownload(firebaseKey, fileUrl, fileName) {
      if (window.apmlHasAnalyticsConsent && window.apmlHasAnalyticsConsent()) totalMediaDownloadsRef.transaction((currentValue) => {
        return (currentValue || 0) + 1;
      });

      if (!fileUrl) {
        if (window.APMLMascot) window.APMLMascot.alert();
        alert("File URL is missing.");
        return;
      }

      if (window.ApmNativeDownload && window.ApmNativeDownload.start) {
        window.ApmNativeDownload.start(fileUrl, fileName || 'APML-file');
        if (window.APMLMascot) window.APMLMascot.happy('Download started successfully!');
        return;
      }
      const saveBlob = (blob) => {
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = fileName || 'apml-asset';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => window.URL.revokeObjectURL(blobUrl), 4000);
      };
      const fetchBlob = async (url) => {
        const response = await fetch(url);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.blob();
      };

      try {
        saveBlob(await fetchBlob(fileUrl));
        if (window.APMLMascot) window.APMLMascot.happy('Your file is downloaded!');
        return;
      } catch (err) {}

      const a = document.createElement('a');
      a.href = fileUrl;
      a.download = fileName || 'apml-asset';
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      if (window.APMLMascot) window.APMLMascot.happy('Your download has started!');
    }

              }

              return `
                <div class="drive-file-grid-card" id="file-card-${file.key}" draggable="true" ondragstart="handleDragStart(event, '${file.key}')" title="Drag this card and drop it onto any folder to move it">
                  ${isImage ? `
                    <a href="${fullResUrl}" class="grid-preview-box simple-lightbox-item" title="${file.name || 'APML Drive Asset'}">
                      <div class="card-loading-overlay" id="card-loader-${file.key}">
                        <div class="card-spinner"></div>
                      </div>
                      ${previewHtml}
                    </a>
                  ` : isVideo ? `
                    <div class="grid-preview-box" onclick="openVideoLightbox('${file.key}', '${file.fileId}')" title="Click to preview video">
                      <div class="card-loading-overlay" id="card-loader-${file.key}">
                        <div class="card-spinner"></div>
                      </div>
                      ${previewHtml}
                    </div>
                  ` : `
                    <div class="grid-preview-box" onclick="handleItemDownload('${file.key}', '${file.fileId}', '${file.name}')" title="Click to download">
                      <div class="card-loading-overlay" id="card-loader-${file.key}">
                        <div class="card-spinner"></div>
                      </div>
                      ${previewHtml}
                    </div>
                  `}
                  <div class="grid-card-body">
                    <div class="file-name" title="${file.name}">${file.name}</div>
                    ${formattedDate ? `<div class="file-timestamp">${formattedDate}</div>` : ''}
                    <div class="file-details-row">
                      <span class="file-pill-group">
                        <span class="file-type-pill">${extName}</span>
                        <span class="media-source-dot" style="background-color: ${source.dotColor};" title="Stored on ${source.label}"></span>
                      </span>
                      <span class="file-size-label">${formattedSize}</span>
                    </div>
                  </div>
                  <div class="grid-card-footer">
                    <button type="button" class="btn-download-file" onclick="handleItemDownload('${file.key}', '${file.fileId}', '${file.name}')" title="Download">
                      <span class="material-symbols-outlined" style="font-size: 15px;">download</span> Download
                    </button>
                    <div class="card-actions-admin">
                      ${isDeletedFolder ? `
                        <button type="button" class="btn-delete-file" onclick="permanentDelete('file', '${file.key}')" title="Delete Permanently" style="background: #fee2e2; color: #dc2626;">
                          <span class="material-symbols-outlined" style="font-size: 14px;">delete_forever</span>
                        </button>
                      ` : `
                        <button type="button" class="btn-edit-file" onclick="editFileName('${file.key}', '${file.name.replace(/'/g, "\\'")}')" title="Edit File Name">
                          <span class="material-symbols-outlined" style="font-size: 14px;">edit</span>
                        </button>
                        ${canDeleteItem('file', file.key) ? `<button type="button" class="btn-delete-file" onclick="confirmDeleteAction('file', '${file.key}')" title="Delete">
                          <span class="material-symbols-outlined" style="font-size: 14px;">delete</span>
                        </button>` : ''}
                      `}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;

        if (totalPages > 1) {
          filesHtml += `
            <div class="pagination-bar">
              <div class="pagination-pages-row">
                <button type="button" class="btn-page" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})" title="Previous Page">
                  <span class="material-symbols-outlined" style="font-size: 18px;">chevron_left</span>
                </button>
          `;

          let startPage = Math.max(1, currentPage - 1);
          let endPage = Math.min(totalPages, currentPage + 1);

          if (currentPage === 1) {
            endPage = Math.min(totalPages, 3);
          } else if (currentPage === totalPages) {
            startPage = Math.max(1, totalPages - 2);
          }

          if (startPage > 1) {
            filesHtml += `<button type="button" class="btn-page" onclick="goToPage(1)">1</button>`;
            if (startPage > 2) {
              filesHtml += `<span class="page-ellipsis">...</span>`;
            }
          }

          for (let p = startPage; p <= endPage; p++) {
            filesHtml += `<button type="button" class="btn-page ${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
          }

          if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
              filesHtml += `<span class="page-ellipsis">...</span>`;
            }
            filesHtml += `<button type="button" class="btn-page" onclick="goToPage(${totalPages})">${totalPages}</button>`;
          }

          filesHtml += `
                <button type="button" class="btn-page" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})" title="Next Page">
                  <span class="material-symbols-outlined" style="font-size: 18px;">chevron_right</span>
                </button>
              </div>
          `;

          if (totalPages > 3) {
            filesHtml += `
              <div class="pagination-jump-row">
                <span>Go to page:</span>
                <input type="number" id="jumpPageInput" class="jump-input" min="1" max="${totalPages}" placeholder="${currentPage}">
                <button type="button" class="btn-jump-go" onclick="jumpToCustomPage(${totalPages})">Go</button>
              </div>
            `;
          }

          filesHtml += `</div>`;
        }

        filesContainerWrapper.innerHTML = filesHtml;

        // Load video metadata only when a preview approaches the viewport.
        if (videoPreviewObserver) videoPreviewObserver.disconnect();
        const lazyVideos = filesContainerWrapper.querySelectorAll('video[data-src]');
        if ('IntersectionObserver' in window) {
          videoPreviewObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
              if (!entry.isIntersecting) return;
              const video = entry.target;
              video.src = video.dataset.src;
              video.removeAttribute('data-src');
              video.preload = 'metadata';
              video.load();
              observer.unobserve(video);
            });
          }, { rootMargin: '300px 0px' });
          lazyVideos.forEach(video => videoPreviewObserver.observe(video));
        } else {
          lazyVideos.forEach(video => {
            video.src = video.dataset.src;
            video.removeAttribute('data-src');
          });
        }

        // Initialize media helpers only after the new cards exist in the DOM.
        // Previously both helpers ran before insertion, leaving lazy images unrequested
        // and the lightbox without the current page's image links.
        if (typeof SimpleLightbox !== 'undefined') {
          if (!lightbox) {
            lightbox = new SimpleLightbox('.simple-lightbox-item', {
              captionsData: 'title',
              captionDelay: 200,
              animationSpeed: 250,
              fadeSpeed: 250
            });
          } else {
            lightbox.refresh();
          }
        }


        currentFiles.forEach(file => {
          const isImage = isImageFile(file.name, file.fileId);
          const isVideo = isVideoFile(file.name, file.fileId);
          if (!isImage && !isVideo) {
            hideCardLoader(file.key);
          }
        });

      } else if (currentFolders.length === 0) {
        filesContainerWrapper.innerHTML = `
          <div class="apml-empty-state" role="status">
            <img class="apml-empty-state__art" src="assets/empty-states/cloud-drive.svg" alt="An open folder with a cloud and a file ready to upload." width="320" height="220" loading="lazy" decoding="async">
            <h3 class="apml-empty-state__title">A little room to get started</h3>
            <p class="apml-empty-state__description">This folder is empty. Create a subfolder or upload a file, and it will be waiting here next time.</p>
          </div>`;
      } else {
        filesContainerWrapper.innerHTML = ``;
      }
    }

    function renderBreadcrumb() {
      const nav = document.getElementById('breadcrumbNav');
      if (currentParentId === 'root') {
        nav.innerHTML = `
          <span class="breadcrumb-item">
            <span class="material-symbols-outlined" style="font-size: 18px;">folder</span> My Drive
          </span>
        `;
        return;
      }

      if (currentParentId === 'deleted') {
        nav.innerHTML = `
          <span class="breadcrumb-item" onclick="navigateToFolder('root')">
            <span class="material-symbols-outlined" style="font-size: 18px;">folder</span> My Drive
          </span>
          <span style="color: var(--text-muted);">/</span>
          <span class="breadcrumb-item" style="color: #dc2626;">Trash Archive</span>
        `;
        return;
      }

      let path = [];
      let currId = currentParentId;
      while (currId && currId !== 'root') {
        const folder = liveFolders.find(f => f.key === currId);
        if (!folder) break;
        path.unshift(folder);
        currId = folder.parentId;
      }

      let html = `
        <span class="breadcrumb-item" onclick="navigateToFolder('root')">
          <span class="material-symbols-outlined" style="font-size: 18px;">folder</span> My Drive
        </span>
      `;

      path.forEach(f => {
        html += ` <span style="color: var(--text-muted);">/</span> <span class="breadcrumb-item" onclick="navigateToFolder('${f.key}')">${f.name}</span>`;
      });

      nav.innerHTML = html;
    }

    function getFileExtension(filename) {
      if (!filename) return 'FILE';
      const parts = filename.split('.');
      return parts.length > 1 ? parts.pop().toUpperCase() : 'FILE';
    }

    function isImageFile(filename, url) {
      const pattern = /\.(jpg|jpeg|png|webp|gif)(\?.*)?$/i;
      return pattern.test(filename) || pattern.test(url);
    }

    function isVideoFile(filename, url) {
      const pattern = /\.(mp4|webm|ogg|mov)(\?.*)?$/i;
      return pattern.test(filename) || pattern.test(url);
    }

    function isHtmlFile(filename, url) {
      const pattern = /\.(html|htm)(\?.*)?$/i;
      return pattern.test(filename) || pattern.test(url);
    }

    function isExcelFile(filename, url) {
      const pattern = /\.(xls|xlsx|csv)(\?.*)?$/i;
      return pattern.test(filename) || pattern.test(url);
    }

    function getFileIcon(filename, url) {
      if (isImageFile(filename, url)) return 'image';
      if (isVideoFile(filename, url)) return 'movie';
      if (isHtmlFile(filename, url)) return 'code';
      if (isExcelFile(filename, url)) return 'table_chart';
      if (/\.pdf$/i.test(filename) || /\.pdf$/i.test(url)) return 'picture_as_pdf';
      if (/\.(zip|rar|7z|tar)$/i.test(filename)) return 'folder_zip';
      if (/\.(doc|docx)$/i.test(filename)) return 'article';
      return 'insert_drive_file';
    }

    function getThumbnailThemeClass(filename, url) {
      if (isExcelFile(filename, url)) return 'preview-placeholder-excel';
      if (isHtmlFile(filename, url)) return 'preview-placeholder-doc';
      if (/\.pdf$/i.test(filename) || /\.pdf$/i.test(url)) return 'preview-placeholder-pdf';
      if (/\.(zip|rar|7z|tar)$/i.test(filename)) return 'preview-placeholder-zip';
      return 'preview-placeholder-doc';
    }

    function getThumbnailIconColor(filename, url) {
      if (isExcelFile(filename, url)) return 'color: #059669;';
      if (isHtmlFile(filename, url)) return 'color: #7c3aed;';
      if (/\.pdf$/i.test(filename) || /\.pdf$/i.test(url)) return 'color: #dc2626;';
      if (/\.(zip|rar|7z|tar)$/i.test(filename)) return 'color: #d97706;';
      if (/\.(doc|docx)$/i.test(filename)) return 'color: #2563eb;';
      return 'color: var(--primary);';
    }

    function hideCardLoader(key) {
      const loader = document.getElementById(`card-loader-${key}`);
      if (loader) {
        loader.classList.add('fade-out');
      }
    }
    function handleImagePreviewError(key, image) {
      hideCardLoader(key);
      if (!image || !image.parentElement) return;
      const placeholder = document.createElement('div');
      placeholder.className = 'grid-preview-placeholder';
      placeholder.innerHTML = '<span class="material-symbols-outlined">broken_image</span><span class="ext-badge">Preview unavailable</span>';
      image.replaceWith(placeholder);
    }

    function openVideoLightbox(firebaseKey, videoUrl) {
      const overlay = document.getElementById('mediaLightboxModal');
      const slot = document.getElementById('lightboxMediaSlot');
      slot.innerHTML = `<video src="${videoUrl}" controls autoplay playsinline style="max-width:100%; max-height:80vh; border-radius:12px;"></video>`;
      overlay.classList.add('active');
    }

    function closeLightbox(evt) {
      if (evt.target.id === 'mediaLightboxModal' || evt.target.closest('.btn-lightbox-close')) {
        const overlay = document.getElementById('mediaLightboxModal');
        const slot = document.getElementById('lightboxMediaSlot');
        overlay.classList.remove('active');
        slot.innerHTML = '';
      }
    }

    let resizeRenderTimer = null;
    let lastResponsivePageSize = getDynamicItemsPerPage();
    window.addEventListener('resize', () => {
      clearTimeout(resizeRenderTimer);
      resizeRenderTimer = setTimeout(() => {
        const nextPageSize = getDynamicItemsPerPage();
        if (nextPageSize === lastResponsivePageSize) return;
        lastResponsivePageSize = nextPageSize;
        currentPage = 1;
        lastRenderedFilesSignature = '';
        renderUI();
      }, 180);
    }, { passive: true });

    document.addEventListener('DOMContentLoaded', () => {
      loadFolderState();
    });
  </script>
</body>
</html>
