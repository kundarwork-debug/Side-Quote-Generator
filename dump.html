<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>APML Portal — Trash &amp; Recovery Archive</title>

  <link rel="icon" type="image/svg+xml" href="logo.svg?v=21.36">
  <link rel="stylesheet" href="common.css?v=21.36">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary: #c21d1d;
      --primary-dark: #991b1b;
      --primary-gradient: linear-gradient(135deg, #c21d1d 0%, #e11d48 50%, #f43f5e 100%);
      --primary-soft: rgba(194, 29, 29, 0.08);
      
      --bg-base: #F5EFEB;
      --surface-glass: rgba(255, 255, 255, 0.88);
      --surface-card: rgba(255, 255, 255, 0.95);
      
      --border-subtle: rgba(225, 212, 204, 0.85);
      --border-hover: rgba(194, 29, 29, 0.35);
      
      --text-main: #141210;
      --text-secondary: #3d3835;
      --text-muted: #736b66;
      --text-faint: #a8a29e;
      
      --radius-xl: 18px;
      --radius-pill: 9999px;
      
      --shadow-card: 0 1px 3px rgba(28, 25, 23, 0.04), 0 8px 24px -4px rgba(28, 25, 23, 0.03);
      --shadow-float: 0 20px 40px -12px rgba(194, 29, 29, 0.12), 0 4px 12px rgba(0, 0, 0, 0.02);
      
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
      overflow-y: scroll !important;
      height: 100%;
    }

    body {
      background: radial-gradient(circle at 85% 10%, rgba(194, 29, 29, 0.12) 0%, transparent 55%),
                  radial-gradient(circle at 10% 85%, rgba(153, 27, 27, 0.08) 0%, transparent 50%),
                  linear-gradient(135deg, #F2ECE4 0%, #EAE2D8 100%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: visible !important;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 30%, rgba(234, 226, 216, 0.45) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* FULL PAGE SMOOTH LOADING OVERLAY */
    .app-loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-base);
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .app-loading-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* GLOWING UNLIMITED STORAGE SYMBOL CONTAINER */
    .glowing-infinity-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .glowing-infinity-wrapper::before {
      content: "";
      position: absolute;
      inset: -10px;
      background: radial-gradient(circle, rgba(194, 29, 29, 0.35) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulseGlow 2s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    .glowing-infinity-icon {
      font-size: 52px;
      color: var(--primary);
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 0 12px rgba(194, 29, 29, 0.6));
      animation: floatInfinity 3s ease-in-out infinite;
    }

    @keyframes floatInfinity {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .loading-brand-text {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .loading-sub-text {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 500;
    }

    #header-container {
      position: sticky !important;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    .dump-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px 80px;
      margin-top: 110px !important;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .dump-head-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .dump-title {
      font-family: var(--font-display);
      font-size: clamp(30px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .dump-title span {
      font-family: var(--font-display);
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .dump-sub-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .dump-sub {
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 500;
    }

    .dump-stats-pills {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--border-subtle);
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .stat-pill strong {
      color: var(--primary);
    }

    /* VIEW SWITCHER TABS (GALLERY VS DRIVE TRASH) */
    .trash-view-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .btn-trash-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-card);
      border: 1.5px solid var(--border-subtle);
      padding: 10px 22px;
      border-radius: var(--radius-pill);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: all 0.2s ease;
    }

    .btn-trash-tab:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-trash-tab.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 14px rgba(194, 29, 29, 0.25);
    }

    .back-btn-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--border-subtle);
      padding: 9px 18px;
      border-radius: var(--radius-pill);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: all 0.2s ease;
    }

    .back-btn-link:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }

    /* TRASH GRID CARDS */
    .dump-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .dump-card {
      background: var(--surface-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .dump-card:hover {
      transform: translateY(-3px);
      border-color: var(--border-hover);
      box-shadow: var(--shadow-float);
      background: #ffffff;
    }

    .dump-preview-box {
      width: 100%;
      height: 140px;
      background: #0f172a;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .dump-preview-box img, .dump-preview-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .dump-preview-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.85);
    }

    .dump-preview-placeholder span.material-symbols-outlined {
      font-size: 42px;
      color: #f43f5e;
    }

    .dump-preview-placeholder span.ext-badge {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      background: rgba(255,255,255,0.15);
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .dump-card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .dump-name {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dump-details-sub {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dump-card-footer {
      padding: 0 16px 16px 16px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--border-subtle);
      padding-top: 12px;
    }

    .btn-restore {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #059669;
      color: #ffffff;
      border: none;
      padding: 7px 16px;
      border-radius: var(--radius-pill);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(5, 150, 105, 0.2);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-restore:hover {
      background: #047857;
      transform: translateY(-1px);
    }

    .btn-perm-delete {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      color: #dc2626;
      background: #fee2e2;
      transition: all 0.2s ease;
    }

    .btn-perm-delete:hover {
      background: #dc2626;
      color: #ffffff;
    }

    /* LIGHTBOX MODAL VIEWER */
    .media-lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .media-lightbox-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-content-box {
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .lightbox-content-box img, .lightbox-content-box video, .lightbox-content-box iframe {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      background: #ffffff;
      width: 100%;
      height: 80vh;
    }

    .btn-lightbox-close {
      position: absolute;
      top: -45px;
      right: 0;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-lightbox-close:hover {
      background: var(--primary);
    }

    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-weight: 600;
      background: var(--surface-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-xl);
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--border-subtle);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="app-loading-overlay" id="appLoadingOverlay">
    <div class="glowing-infinity-wrapper">
      <span class="material-symbols-outlined glowing-infinity-icon">delete_sweep</span>
    </div>
    <div class="loading-brand-text">APML Recovery Archive</div>
    <div class="loading-sub-text">Syncing trash items...</div>
  </div>

  <div id="header-container"></div>

  <div class="media-lightbox-overlay" id="mediaLightboxModal" onclick="closeLightbox(event)">
    <div class="lightbox-content-box" id="lightboxContainer">
      <button type="button" class="btn-lightbox-close" onclick="closeLightbox(event)">
        <span class="material-symbols-outlined">close</span>
      </button>
      <div id="lightboxMediaSlot" style="width: 100%; display: flex; justify-content: center;"></div>
    </div>
  </div>

  <main class="dump-container">
    
    <div class="dump-head-bar">
      <div class="dump-header">
        <h1 class="dump-title">Trash &amp; <span>Recovery Archive</span></h1>
        <div class="dump-sub-row">
          <p class="dump-sub">Preview, restore, or permanently delete items from trash.</p>
        </div>
        <div class="dump-stats-pills">
          <span class="stat-pill">Trash Items: <strong id="statTotalCount">0</strong></span>
        </div>
      </div>

      <div>
        <a href="drive.html" class="back-btn-link">
          <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
          <span>Back to Drive</span>
        </a>
      </div>
    </div>

    <div class="trash-view-tabs">
      <button type="button" class="btn-trash-tab active" id="btnTabDrive" onclick="switchTrashView('drive')">
        <span class="material-symbols-outlined" style="font-size: 18px;">folder_open</span> Cloud Drive Trash
      </button>
      <button type="button" class="btn-trash-tab" id="btnTabGallery" onclick="switchTrashView('gallery')">
        <span class="material-symbols-outlined" style="font-size: 18px;">perm_media</span> Gallery Trash
      </button>
    </div>

    <div class="dump-grid" id="dumpGrid">
      <div class="state-msg">
        <div class="spinner"></div>
        Loading archive records...
      </div>
    </div>

  </main>

  <div id="header-container"></div>

  <script src="common.js?v=21.36"></script>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    const BOT_TOKEN = "8937016793:AAG9mcEjxXh7GEY3m-c-8SuzdCaKTA5tw9M";

    const firebaseConfig = {
      apiKey: "AIzaSyDgJ6uRCABWxAHOU1bIY4VuA-nQ0zM3aF8",
      authDomain: "apml-portal.firebaseapp.com",
      databaseURL: "https://apml-portal-default-rtdb.firebaseio.com",
      projectId: "apml-portal"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    
    // Paths
    const galleryMediaRef = db.ref("telegram_dump_gallery_folders");
    const driveTrashRef = db.ref("telegram_gdrive_trash");
    const driveFilesRef = db.ref("telegram_gdrive_files");
    const driveFoldersRef = db.ref("telegram_gdrive_folders");

    let activeTrashView = 'drive'; // 'drive' or 'gallery'
    let trashItems = [];
    let galleryTrashItems = [];
    const fileUrlCache = new Map();

    function hidePageLoader() {
      const overlay = document.getElementById('appLoadingOverlay');
      if (overlay && !overlay.classList.contains('fade-out')) {
        overlay.classList.add('fade-out');
      }
    }

    setTimeout(hidePageLoader, 1500);

    // Listen to Drive Trash (`telegram_gdrive_trash`)
    driveTrashRef.on('value', (snapshot) => {
      const data = snapshot.val();
      trashItems = [];
      if (data) {
        Object.keys(data).forEach(key => {
          trashItems.push({ key, ...data[key] });
        });
      }
      if (activeTrashView === 'drive') renderTrash();
      hidePageLoader();
    });

    // Listen to Gallery Dump (`telegram_dump_gallery_folders`)
    galleryMediaRef.on('value', (snapshot) => {
      const data = snapshot.val();
      galleryTrashItems = [];
      if (data) {
        Object.keys(data).forEach(key => {
          const item = data[key];
          if (item.folder === 'deleted') {
            galleryTrashItems.push({ key, ...item });
          }
        });
      }
      if (activeTrashView === 'gallery') renderTrash();
      hidePageLoader();
    });

    function switchTrashView(view) {
      activeTrashView = view;
      const btnDrive = document.getElementById('btnTabDrive');
      const btnGallery = document.getElementById('btnTabGallery');

      if (view === 'drive') {
        btnDrive.classList.add('active');
        btnGallery.classList.remove('active');
      } else {
        btnGallery.classList.add('active');
        btnDrive.classList.remove('active');
      }
      renderTrash();
    }

    // --- TELEGRAM URL RESOLUTION & PREVIEW ---
    async function resolveFileUrl(fileId, legacyUrl) {
      if (!fileId) return legacyUrl || '';
      if (fileUrlCache.has(fileId)) return fileUrlCache.get(fileId);

      try {
        const pathRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${fileId}`);
        const pathData = await pathRes.json();
        if (pathData.ok && pathData.result.file_path) {
          const freshUrl = `https://api.telegram.org/file/bot${BOT_TOKEN}/${pathData.result.file_path}`;
          fileUrlCache.set(fileId, freshUrl);
          return freshUrl;
        }
      } catch (err) {
        console.error("Failed to resolve fileId:", fileId, err);
      }
      return legacyUrl || '';
    }

    async function openItemPreview(fileId, legacyUrl, fileName) {
      const freshUrl = await resolveFileUrl(fileId, legacyUrl);
      const overlay = document.getElementById('mediaLightboxModal');
      const slot = document.getElementById('lightboxMediaSlot');

      const isImage = /\.(jpg|jpeg|png|webp|gif)$/i.test(fileName);
      const isPdf = /\.pdf$/i.test(fileName);

      if (isImage) {
        slot.innerHTML = `<img src="${freshUrl}" alt="${fileName}" style="width:100%; height:80vh; object-fit:contain; border-radius:12px;">`;
      } else if (isPdf) {
        slot.innerHTML = `<iframe src="${freshUrl}" style="width:100%; height:80vh; border:none; border-radius:12px;"></iframe>`;
      } else {
        slot.innerHTML = `
          <div style="text-align:center; padding:40px; color:#ffffff;">
            <p style="margin-bottom:16px; font-size:16px;">Preview not available for this file type.</p>
            <a href="${freshUrl}" download="${fileName}" class="btn-restore">Download File</a>
          </div>
        `;
      }

      overlay.classList.add('active');
    }

    function closeLightbox(evt) {
      if (evt.target.id === 'mediaLightboxModal' || evt.target.closest('.btn-lightbox-close')) {
        const overlay = document.getElementById('mediaLightboxModal');
        const slot = document.getElementById('lightboxMediaSlot');
        overlay.classList.remove('active');
        slot.innerHTML = '';
      }
    }

    // --- RESTORE & PERMANENT DELETE (DRIVE) ---
    async function restoreDriveItem(trashKey) {
      const item = trashItems.find(i => i.key === trashKey);
      if (!item) return;

      try {
        if (item.isFolder) {
          const newFolderRef = await driveFoldersRef.push({
            name: item.name,
            parentId: item.folder || 'root',
            timestamp: item.timestamp || Date.now()
          });
          const restoredFolderKey = newFolderRef.key;

          const childTrashItems = trashItems.filter(i => i.folder === trashKey);
          for (const child of childTrashItems) {
            await driveFilesRef.push({
              fileId: child.fileId,
              parentId: restoredFolderKey,
              name: child.name,
              size: child.size || 0,
              timestamp: child.timestamp || Date.now()
            });
            await driveTrashRef.child(child.key).remove();
          }

          await driveTrashRef.child(trashKey).remove();
          alert(`Successfully restored folder "${item.name}"!`);
        } else {
          await driveFilesRef.push({
            fileId: item.fileId,
            parentId: item.folder || 'root',
            name: item.name,
            size: item.size || 0,
            timestamp: item.timestamp || Date.now()
          });
          await driveTrashRef.child(trashKey).remove();
          alert(`Successfully restored "${item.name}"!`);
        }
      } catch (err) {
        alert("Restoration failed: " + err.message);
      }
    }

    async function permanentDeleteDrive(trashKey, isFolder) {
      if (!confirm("Permanently delete this item?")) return;
      try {
        if (isFolder) {
          const childTrashItems = trashItems.filter(i => i.folder === trashKey);
          for (const child of childTrashItems) {
            await driveTrashRef.child(child.key).remove();
          }
        }
        await driveTrashRef.child(trashKey).remove();
      } catch (err) {
        alert("Permanent deletion failed: " + err.message);
      }
    }

    // --- RESTORE & PERMANENT DELETE (GALLERY) ---
    async function restoreGalleryItem(key) {
      try {
        await galleryMediaRef.child(key).update({ folder: 'packing-images' });
        alert("Successfully restored media item to gallery!");
      } catch (err) {
        alert("Restoration failed: " + err.message);
      }
    }

    async function permanentDeleteGallery(key) {
      if (!confirm("Permanently delete this gallery item?")) return;
      try {
        await galleryMediaRef.child(key).remove();
      } catch (err) {
        alert("Deletion failed: " + err.message);
      }
    }

    function getFileExtension(filename) {
      const parts = filename.split('.');
      return parts.length > 1 ? parts.pop().toUpperCase() : 'FILE';
    }

    function getFileIcon(filename) {
      if (/\.pdf$/i.test(filename)) return 'picture_as_pdf';
      if (/\.(xls|xlsx|csv)$/i.test(filename)) return 'table_chart';
      if (/\.(zip|rar|7z|tar)$/i.test(filename)) return 'folder_zip';
      if (/\.(doc|docx)$/i.test(filename)) return 'article';
      if (/\.(jpg|jpeg|png|webp|gif)$/i.test(filename)) return 'image';
      return 'insert_drive_file';
    }

    function formatBytes(bytes, decimals = 1) {
      if (!bytes || bytes === 0) return '0 KB';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function renderTrash() {
      const dumpGrid = document.getElementById('dumpGrid');

      if (activeTrashView === 'drive') {
        const rootTrashItems = trashItems.filter(item => {
          if (item.isFolder) return true;
          const parentInTrash = trashItems.some(p => p.key === item.folder && p.isFolder);
          return !parentInTrash;
        });

        document.getElementById('statTotalCount').textContent = rootTrashItems.length;

        if (rootTrashItems.length === 0) {
          dumpGrid.innerHTML = `<div class="state-msg">Cloud Drive trash is empty.</div>`;
          return;
        }

        dumpGrid.innerHTML = rootTrashItems.map(item => {
          const isFolder = item.isFolder === true;
          const iconName = isFolder ? 'folder' : getFileIcon(item.name);
          const extName = isFolder ? 'FOLDER' : getFileExtension(item.name);
          const formattedSize = isFolder ? `${trashItems.filter(c => c.folder === item.key).length} items` : formatBytes(item.size);
          const isImage = !isFolder && /\.(jpg|jpeg|png|webp|gif)$/i.test(item.name);

          return `
            <div class="dump-card">
              <div class="dump-preview-box" ${!isFolder ? `onclick="openItemPreview('${item.fileId}', '${item.url || ''}', '${item.name}')"` : ''} title="${isFolder ? 'Folder' : 'Click to preview'}">
                ${isImage 
                  ? `<img id="dump-preview-img-${item.key}" src="" alt="${item.name}">` 
                  : `<div class="dump-preview-placeholder">
                       <span class="material-symbols-outlined">${iconName}</span>
                       <span class="ext-badge">${extName}</span>
                     </div>`
                }
              </div>
              <div class="dump-card-body">
                <div class="dump-name" title="${item.name}">${item.name}</div>
                <div class="dump-details-sub">
                  <span>${formattedSize}</span>
                  <span style="font-size:10.5px; font-weight:800; color:var(--primary); text-transform:uppercase;">${extName}</span>
                </div>
              </div>
              <div class="dump-card-footer">
                <button type="button" class="btn-restore" onclick="restoreDriveItem('${item.key}')" title="Restore Item">
                  <span class="material-symbols-outlined" style="font-size: 16px;">settings_backup_restore</span> Restore
                </button>
                <button type="button" class="btn-perm-delete" onclick="permanentDeleteDrive('${item.key}', ${isFolder})" title="Delete Permanently">
                  <span class="material-symbols-outlined" style="font-size: 15px;">delete_forever</span>
                </button>
              </div>
            </div>
          `;
        }).join('');

        rootTrashItems.forEach(async item => {
          if (!item.isFolder && /\.(jpg|jpeg|png|webp|gif)$/i.test(item.name)) {
            const freshUrl = await resolveFileUrl(item.fileId, item.url);
            const imgEl = document.getElementById(`dump-preview-img-${item.key}`);
            if (imgEl) imgEl.src = freshUrl;
          }
        });

      } else {
        // Gallery Trash View
        document.getElementById('statTotalCount').textContent = galleryTrashItems.length;

        if (galleryTrashItems.length === 0) {
          dumpGrid.innerHTML = `<div class="state-msg">Gallery trash is empty.</div>`;
          return;
        }

        dumpGrid.innerHTML = galleryTrashItems.map(item => {
          const formattedSize = formatBytes(item.size);
          const extName = getFileExtension(item.name);

          return `
            <div class="dump-card">
              <div class="dump-preview-box" onclick="openItemPreview('${item.fileId}', '${item.url || ''}', '${item.name}')" title="Click to preview">
                <img id="gallery-preview-img-${item.key}" src="" alt="${item.name}">
              </div>
              <div class="dump-card-body">
                <div class="dump-name" title="${item.name}">${item.name}</div>
                <div class="dump-details-sub">
                  <span>${formattedSize}</span>
                  <span style="font-size:10.5px; font-weight:800; color:var(--primary); text-transform:uppercase;">${extName}</span>
                </div>
              </div>
              <div class="dump-card-footer">
                <button type="button" class="btn-restore" onclick="restoreGalleryItem('${item.key}')" title="Restore Item">
                  <span class="material-symbols-outlined" style="font-size: 16px;">settings_backup_restore</span> Restore
                </button>
                <button type="button" class="btn-perm-delete" onclick="permanentDeleteGallery('${item.key}')" title="Delete Permanently">
                  <span class="material-symbols-outlined" style="font-size: 15px;">delete_forever</span>
                </button>
              </div>
            </div>
          `;
        }).join('');

        galleryTrashItems.forEach(async item => {
          const freshUrl = await resolveFileUrl(item.fileId, item.url);
          const imgEl = document.getElementById(`gallery-preview-img-${item.key}`);
          if (imgEl) imgEl.src = freshUrl;
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(hidePageLoader, 3000);
    });
  </script>
</body>
</html>
