<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Subtle Gradient Background for App Icon / Branding -->
    <radialGradient id="hubBgGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </radialGradient>
    
    <!-- Red Glow / Shadow Filter -->
    <filter id="hubDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#b91c1c" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Base Circular Container -->
  <circle cx="256" cy="256" r="236" fill="url(#hubBgGradient)" stroke="#fecaca" stroke-width="8"/>

  <!-- Network Hub Graphic Group -->
  <g filter="url(#hubDropShadow)" fill="#b91c1c" stroke="#b91c1c" stroke-linecap="round" stroke-linejoin="round">
    <!-- Connecting Radial Lines -->
    <line x1="256" y1="256" x2="256" y2="124" stroke-width="18"/>
    <line x1="256" y1="256" x2="381" y2="215" stroke-width="18"/>
    <line x1="256" y1="256" x2="333" y2="363" stroke-width="18"/>
    <line x1="256" y1="256" x2="179" y2="363" stroke-width="18"/>
    <line x1="256" y1="256" x2="131" y2="215" stroke-width="18"/>

    <!-- Central Hub Node (Hollow Ring) -->
    <circle cx="256" cy="256" r="54" fill="#ffffff" stroke-width="22"/>

    <!-- Outer Peripheral Nodes -->
    <circle cx="256" cy="124" r="32" stroke-width="6"/>
    <circle cx="381" cy="215" r="32" stroke-width="6"/>
    <circle cx="333" cy="363" r="32" stroke-width="6"/>
    <circle cx="179" cy="363" r="32" stroke-width="6"/>
    <circle cx="131" cy="215" r="32" stroke-width="6"/>

    <!-- Inner Core Accents -->
    <circle cx="256" cy="124" r="14" fill="#ffffff" stroke="none"/>
    <circle cx="381" cy="215" r="14" fill="#ffffff" stroke="none"/>
    <circle cx="333" cy="363" r="14" fill="#ffffff" stroke="none"/>
    <circle cx="179" cy="363" r="14" fill="#ffffff" stroke="none"/>
    <circle cx="131" cy="215" r="14" fill="#ffffff" stroke="none"/>
  </g>
</svg>
