<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>APML Portal — Standards &amp; Media Gallery</title>

  <link rel="icon" type="image/svg+xml" href="logo.svg?v=21.0">
  <link rel="stylesheet" href="common.css?v=21.0">

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary: #c21d1d;
      --primary-dark: #991b1b;
      --primary-soft: rgba(194, 29, 29, 0.08);
      --bg-base: #FDF8F5;
      --surface-card: rgba(255, 255, 255, 0.95);
      --border-subtle: rgba(237, 228, 222, 0.9);
      --text-main: #1c1917;
      --text-muted: #78716c;
      --radius-xl: 20px;
      --radius-pill: 9999px;
      --shadow-card: 0 4px 20px -2px rgba(120, 113, 108, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* VIBRANT LIVE ANIMATED BACKGROUND THEME STARTING FROM PAGE 2 */
    body::before {
      content: "";
      position: absolute;
      top: 100vh;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        135deg,
        rgba(194, 29, 29, 0.15) 0%,
        rgba(225, 29, 72, 0.1) 40%,
        rgba(245, 158, 11, 0.06) 70%,
        rgba(253, 248, 245, 0.95) 100%
      );
      background-size: 300% 300%;
      animation: liveThemeShift 14s ease infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes liveThemeShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #header-container {
      position: sticky !important;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    .gallery-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px 80px;
      margin-top: 110px !important;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .gallery-head-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .gallery-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(30px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .gallery-title span {
      color: var(--primary);
    }

    .gallery-sub {
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 500;
    }

    /* UPLOAD ACTION PANEL */
    .unified-action-panel {
      background: var(--surface-card);
      border: 1.5px dashed rgba(194, 29, 29, 0.35);
      border-radius: var(--radius-xl);
      padding: 24px 28px;
      margin-bottom: 32px;
      box-shadow: var(--shadow-card);
    }

    .upload-action-content {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .panel-icon-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .panel-head h3 {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-main);
    }

    .panel-head p {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .panel-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 520px;
    }

    .folder-select {
      background: #ffffff;
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      padding: 10px 16px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      flex: 1;
      min-width: 0;
    }

    .folder-select.select-highlight-error {
      border: 1.5px solid var(--primary) !important;
      background-color: #fff5f5;
      box-shadow: 0 0 0 3px rgba(194, 29, 29, 0.15);
      animation: gentleShake 0.35s ease;
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .btn-action-primary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary);
      color: #ffffff;
      padding: 10px 22px;
      border-radius: var(--radius-pill);
      font-size: 13.5px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(194, 29, 29, 0.2);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .btn-action-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-action-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* FILTER TABS & ADD FOLDER CHIP */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 32px;
      align-items: center;
    }

    .filter-item-wrapper {
      display: inline-flex;
      align-items: center;
      background: #ffffff;
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      padding: 3px 6px 3px 14px;
      transition: all 0.2s ease;
      gap: 4px;
    }

    .filter-item-wrapper.active {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(194, 29, 29, 0.2);
    }

    .filter-btn-text {
      background: transparent;
      border: none;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 2px 5px 0;
    }

    .filter-item-wrapper.active .filter-btn-text {
      color: #ffffff;
    }

    .btn-add-folder-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1.5px dashed var(--primary);
      color: var(--primary);
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(194, 29, 29, 0.06);
    }

    .btn-add-folder-chip:hover {
      background: var(--primary-soft);
      transform: translateY(-1px);
    }

    /* MEDIA GRID */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .media-card {
      background: var(--surface-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .media-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 32px -6px rgba(194, 29, 29, 0.12);
    }

    .media-preview-wrap {
      width: 100%;
      height: 240px;
      background: #0f172a;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .media-preview-wrap img, .media-preview-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .media-info {
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .media-badges-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .media-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .media-badge.video-tag {
      background: rgba(15, 23, 42, 0.08);
      color: #0f172a;
    }

    .card-actions-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: color 0.2s ease;
    }

    .btn-download:hover {
      color: var(--primary);
    }

    /* LIGHTBOX MODAL VIEWER */
    .media-lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .media-lightbox-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-content-box {
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .lightbox-content-box img, .lightbox-content-box video {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .btn-lightbox-close {
      position: absolute;
      top: -45px;
      right: 0;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-lightbox-close:hover {
      background: var(--primary);
    }

    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border-subtle);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 900px) {
      .gallery-container {
        margin-top: 95px !important;
      }
      .upload-action-content {
        flex-direction: column;
        align-items: flex-start;
      }
      .panel-row {
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div id="header-container"></div>

  <!-- MEDIA LIGHTBOX MODAL VIEWER -->
  <div class="media-lightbox-overlay" id="mediaLightboxModal" onclick="closeLightbox(event)">
    <div class="lightbox-content-box" id="lightboxContainer">
      <button type="button" class="btn-lightbox-close" onclick="closeLightbox(event)">
        <span class="material-symbols-outlined">close</span>
      </button>
      <div id="lightboxMediaSlot" style="width: 100%; display: flex; justify-content: center;"></div>
    </div>
  </div>

  <main class="gallery-container">
    
    <div class="gallery-head-bar">
      <div class="gallery-header">
        <h1 class="gallery-title">Standards &amp; Media <span>Gallery</span></h1>
        <p class="gallery-sub">Cloud-synced visual packaging assets and operational video documentation.</p>
      </div>
    </div>

    <!-- UNLIMITED MEDIA UPLOAD PANEL -->
    <div class="unified-action-panel">
      <div class="upload-action-content">
        
        <div class="panel-head">
          <div class="panel-icon-badge">
            <span class="material-symbols-outlined" style="font-size: 24px;">cloud_upload</span>
          </div>
          <div>
            <h3>Upload Media Asset</h3>
            <p id="uploadStatusText">Select destination category and upload image/video</p>
          </div>
        </div>

        <div class="panel-row">
          <select id="uploadFolderSelect" class="folder-select" required onchange="this.classList.remove('select-highlight-error')">
            <option value="" disabled selected>-- Select Folder (Compulsory) * --</option>
          </select>
          <input type="file" id="mediaFileInput" accept="image/*,video/mp4,video/webm,video/quicktime" style="display: none;" onchange="handleTelegramUpload(this.files)">
          <button type="button" class="btn-action-primary" id="uploadTriggerBtn" onclick="triggerCompulsoryUpload()">
            <span class="material-symbols-outlined" style="font-size: 18px;">add_photo_alternate</span>
            <span>Upload</span>
          </button>
        </div>

      </div>
    </div>

    <!-- DYNAMIC FOLDER FILTER TABS -->
    <div class="filter-bar" id="filterBar"></div>

    <!-- MEDIA GRID -->
    <div class="media-grid" id="mediaGrid">
      <div class="state-msg">
        <div class="spinner"></div>
        Syncing live cloud storage feed...
      </div>
    </div>

  </main>

  <div id="footer-container"></div>

  <script src="common.js?v=21.0"></script>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    const BOT_TOKEN = "8937016793:AAG9mcEjxXh7GEY3m-c-8SuzdCaKTA5tw9M";
    const PRIMARY_CHAT_ID = "-1004302268775";
    const FALLBACK_CHAT_ID = "-4302268775";

    const firebaseConfig = {
      apiKey: "AIzaSyDgJ6uRCABWxAHOU1bIY4VuA-nQ0zM3aF8",
      authDomain: "apml-portal.firebaseapp.com",
      databaseURL: "https://apml-portal-default-rtdb.firebaseio.com",
      projectId: "apml-portal"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const mediaRef = db.ref("telegram_dump_gallery_folders");
    const totalMediaDownloadsRef = db.ref('analytics/totalMediaDownloads');

    const DEFAULT_FOLDERS = [
      { id: 'truck', label: 'Truck & Fleet', icon: 'local_shipping' },
      { id: 'packing-images', label: 'Packing Images', icon: 'inventory_2' },
      { id: 'bike-packing', label: 'Bike Packing', icon: 'two_wheeler' },
      { id: 'car-transportation', label: 'Car Transportation', icon: 'directions_car' },
      { id: 'solid-box', label: 'Solid Box', icon: 'package_2' },
      { id: 'tv-box', label: 'TV Box', icon: 'tv' },
      { id: 'electronic', label: 'Electronic', icon: 'devices' },
      { id: 'furniture', label: 'Furniture', icon: 'chair' },
      { id: 'miscellaneous', label: 'Miscellaneous', icon: 'category' },
      { id: 'others', label: 'Others', icon: 'folder_special' }
    ];

    let currentActiveFolder = '';
    let foldersList = [];
    let liveMediaItems = [];

    function loadFolderState() {
      const stored = localStorage.getItem('apml_unlimited_gallery_folders_v4');
      if (stored) {
        try {
          foldersList = JSON.parse(stored);
          // Remove legacy duplicate 'electronics' if present
          foldersList = foldersList.filter(f => f.id !== 'electronics');
          const requiredIds = ['electronic', 'furniture', 'others'];
          requiredIds.forEach(reqId => {
            if (!foldersList.some(f => f.id === reqId)) {
              const def = DEFAULT_FOLDERS.find(d => d.id === reqId);
              if (def) foldersList.push(def);
            }
          });
          localStorage.setItem('apml_unlimited_gallery_folders_v4', JSON.stringify(foldersList));
        } catch (e) {
          foldersList = [...DEFAULT_FOLDERS];
        }
      } else {
        foldersList = [...DEFAULT_FOLDERS];
      }
      renderFolderControls();
    }

    function saveFolderState() {
      localStorage.setItem('apml_unlimited_gallery_folders_v4', JSON.stringify(foldersList));
      renderFolderControls();
    }

    function renderFolderControls() {
      const filterBar = document.getElementById('filterBar');

      let tabsHtml = `
        <div class="filter-item-wrapper ${currentActiveFolder === '' ? 'active' : ''}">
          <button type="button" class="filter-btn-text" onclick="switchFolder('')">
            <span class="material-symbols-outlined" style="font-size: 17px;">grid_view</span> All Media
          </button>
        </div>
      `;

      tabsHtml += foldersList.map(folder => `
        <div class="filter-item-wrapper ${currentActiveFolder === folder.id ? 'active' : ''}">
          <button type="button" class="filter-btn-text" onclick="switchFolder('${folder.id}')">
            <span class="material-symbols-outlined" style="font-size: 17px;">${folder.icon || 'folder'}</span> ${folder.label}
          </button>
        </div>
      `).join('');

      tabsHtml += `
        <button type="button" class="btn-add-folder-chip" onclick="handleCreateFolder()">
          <span class="material-symbols-outlined" style="font-size: 18px;">create_new_folder</span> Add Folder
        </button>
      `;

      filterBar.innerHTML = tabsHtml;

      const uploadSelect = document.getElementById('uploadFolderSelect');
      if (uploadSelect) {
        const prevVal = uploadSelect.value;
        let selectOptions = `<option value="" disabled ${!prevVal ? 'selected' : ''}>-- Select Folder (Compulsory) * --</option>`;
        selectOptions += foldersList.map(f => `
          <option value="${f.id}" ${prevVal === f.id ? 'selected' : ''}>${f.label}</option>
        `).join('');
        uploadSelect.innerHTML = selectOptions;
      }
    }

    function switchFolder(folderId) {
      currentActiveFolder = folderId;
      renderFolderControls();
      renderGallery();
      const uploadSelect = document.getElementById('uploadFolderSelect');
      if (uploadSelect && folderId) {
        uploadSelect.value = folderId;
        uploadSelect.classList.remove('select-highlight-error');
      }
    }

    function handleCreateFolder() {
      const folderName = prompt("Enter new folder name (e.g. 'Fragile Items'):");
      if (!folderName || !folderName.trim()) return;

      const cleanId = folderName.trim().toLowerCase().replace(/[^a-z0-9]/g, '-');
      if (foldersList.some(f => f.id === cleanId)) {
        alert("A folder with this ID or name already exists.");
        return;
      }

      foldersList.push({
        id: cleanId,
        label: folderName.trim(),
        icon: 'folder_open'
      });

      saveFolderState();
      switchFolder(cleanId);
    }

    function triggerCompulsoryUpload() {
      const uploadSelect = document.getElementById('uploadFolderSelect');
      const statusText = document.getElementById('uploadStatusText');

      if (!uploadSelect.value) {
        uploadSelect.classList.add('select-highlight-error');
        uploadSelect.focus();
        statusText.innerHTML = `<span style="color: var(--primary); font-weight: 700;">⚠️ Please select a folder first before uploading!</span>`;
        return;
      }

      uploadSelect.classList.remove('select-highlight-error');
      document.getElementById('mediaFileInput').click();
    }

    function isVideo(filename) {
      return /\.(mp4|webm|ogg|mov|m4v)$/i.test(filename);
    }

    async function uploadToTelegram(file, chatId) {
      const formData = new FormData();
      formData.append('chat_id', chatId);
      formData.append('document', file);

      const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
        method: 'POST',
        body: formData
      });
      return await res.json();
    }

    async function handleTelegramUpload(files) {
      if (!files || !files.length) return;

      const uploadSelect = document.getElementById('uploadFolderSelect');
      const folder = uploadSelect.value;
      const statusText = document.getElementById('uploadStatusText');
      const uploadBtn = document.getElementById('uploadTriggerBtn');

      if (!folder) {
        uploadSelect.classList.add('select-highlight-error');
        uploadSelect.focus();
        statusText.innerHTML = `<span style="color: var(--primary); font-weight: 700;">⚠️ Please select a folder first!</span>`;
        document.getElementById('mediaFileInput').value = '';
        return;
      }

      uploadBtn.disabled = true;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        statusText.innerHTML = `<span style="color: var(--primary);">Uploading ${file.name} to <strong>${folder}</strong>...</span>`;

        try {
          let data = await uploadToTelegram(file, PRIMARY_CHAT_ID);
          if (!data.ok) {
            data = await uploadToTelegram(file, FALLBACK_CHAT_ID);
          }

          if (!data.ok) {
            throw new Error(data.description || 'Telegram rejected upload.');
          }

          const fileId = data.result.document.file_id;
          const pathRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${fileId}`);
          const pathData = await pathRes.json();

          let directUrl = '';
          if (pathData.ok && pathData.result.file_path) {
            directUrl = `https://api.telegram.org/file/bot${BOT_TOKEN}/${pathData.result.file_path}`;
          }

          await mediaRef.push({
            fileId: fileId,
            folder: folder,
            name: file.name,
            size: file.size,
            url: directUrl,
            isVideo: isVideo(file.name),
            timestamp: Date.now()
          });

          statusText.innerHTML = `<span style="color: #10b981;">Uploaded successfully to ${folder}!</span>`;
        } catch (err) {
          alert(`Error uploading "${file.name}":\n${err.message}`);
          statusText.innerHTML = `<span style="color: var(--primary);">Upload failed.</span>`;
        }
      }

      document.getElementById('mediaFileInput').value = '';
      uploadBtn.disabled = false;
      setTimeout(() => {
        statusText.textContent = "Select destination category and upload image/video";
      }, 2000);
    }

    mediaRef.on('value', (snapshot) => {
      const data = snapshot.val();
      liveMediaItems = [];

      if (data) {
        Object.keys(data).forEach((key) => {
          liveMediaItems.unshift({ key, ...data[key] });
        });
      }

      renderGallery();
    });

    function incrementGlobalMediaDownloadAndDownload(fileUrl, fileName) {
      totalMediaDownloadsRef.transaction((currentValue) => {
        return (currentValue || 0) + 1;
      });
      downloadAsset(fileUrl, fileName);
    }

    async function downloadAsset(fileUrl, fileName) {
      try {
        const response = await fetch(fileUrl);
        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(blobUrl);
      } catch (err) {
        window.open(fileUrl, '_blank');
      }
    }

    function renderGallery() {
      const grid = document.getElementById('mediaGrid');
      
      let filteredItems = [];
      if (currentActiveFolder === '') {
        // Exclude "others" folder items when viewing "All Media"
        filteredItems = liveMediaItems.filter(item => item.folder !== 'others');
      } else {
        filteredItems = liveMediaItems.filter(item => item.folder === currentActiveFolder);
      }

      if (!filteredItems.length) {
        grid.innerHTML = `<div class="state-msg">No media files found in this category. Upload items above.</div>`;
        return;
      }

      grid.innerHTML = filteredItems.map(item => {
        const matchedFolder = foldersList.find(f => f.id === item.folder);
        const folderLabel = matchedFolder ? matchedFolder.label : 'Standard';

        return `
          <div class="media-card">
            <div class="media-preview-wrap" onclick="openLightbox('${item.url}', ${item.isVideo})">
              ${item.isVideo 
                ? `<video src="${item.url}" class="w-full h-full object-cover" autoplay loop muted playsinline preload="metadata"></video>` 
                : `<img src="${item.url}" alt="${item.name}" loading="lazy" decoding="async" class="w-full h-full object-cover" onerror="this.src='logo.svg'">`
              }
            </div>
            <div class="media-info">
              <div class="media-badges-group">
                <span class="media-badge ${item.isVideo ? 'video-tag' : ''}">${item.isVideo ? 'SD Video' : 'Image'}</span>
                <span class="media-badge" style="background: rgba(0,0,0,0.05); color: var(--text-muted);">${folderLabel}</span>
              </div>
              <div class="card-actions-row">
                <button type="button" class="btn-download" onclick="event.stopPropagation(); incrementGlobalMediaDownloadAndDownload('${item.url}', '${item.name}')">
                  <span class="material-symbols-outlined" style="font-size: 18px;">download</span> Download
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openLightbox(url, isVideo) {
      const overlay = document.getElementById('mediaLightboxModal');
      const slot = document.getElementById('lightboxMediaSlot');

      if (isVideo) {
        slot.innerHTML = `<video src="${url}" controls autoplay playsinline style="max-width:100%; max-height:80vh; border-radius:12px;"></video>`;
      } else {
        slot.innerHTML = `<img src="${url}" alt="Expanded Media View" style="max-width:100%; max-height:80vh; object-fit:contain; border-radius:12px;">`;
      }

      overlay.classList.add('active');
    }

    function closeLightbox(evt) {
      if (evt.target.id === 'mediaLightboxModal' || evt.target.closest('.btn-lightbox-close')) {
        const overlay = document.getElementById('mediaLightboxModal');
        const slot = document.getElementById('lightboxMediaSlot');
        overlay.classList.remove('active');
        slot.innerHTML = '';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadFolderState();
    });
  </script>
</body>
</html>
