  <style>
    /* GOOGLE MATERIAL DESIGN 3 (M3) THEME TOKENS */
    :root {
      --md-sys-color-primary: #b91c1c;
      --md-sys-color-primary-container: #fef2f2;
      --md-sys-color-on-primary-container: #991b1b;
      --md-sys-color-surface: #f8fafc;
      --md-sys-color-surface-container-lowest: #ffffff;
      --md-sys-color-surface-container-low: #f1f5f9;
      --md-sys-color-surface-container: #e2e8f0;
      --md-sys-color-outline-variant: #e2e8f0;
      --md-sys-color-on-surface: #0f172a;
      --md-sys-color-on-surface-variant: #64748b;
      --md-sys-shape-corner-small: 8px;
      --md-sys-shape-corner-medium: 12px;
      --md-sys-shape-corner-large: 20px;
      --md-sys-shape-corner-full: 9999px;
      --md-elevation-1: 0px 1px 3px rgba(0, 0, 0, 0.08), 0px 1px 2px rgba(0, 0, 0, 0.04);
      --md-elevation-2: 0px 4px 12px rgba(0, 0, 0, 0.08), 0px 2px 4px rgba(0, 0, 0, 0.04);
      --md-elevation-3: 0px 12px 28px rgba(0, 0, 0, 0.12), 0px 4px 8px rgba(0, 0, 0, 0.06);
      --transition-m3: all 0.25s cubic-bezier(0.2, 0, 0, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }

    .gallery-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 100px 20px 60px 20px;
      width: 100%;
      flex: 1;
    }

    /* Header */
    .gallery-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .gallery-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-primary);
      border: 1px solid rgba(185, 28, 28, 0.2);
      border-radius: var(--md-sys-shape-corner-full);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .gallery-title {
      font-size: 32px;
      font-weight: 800;
      color: var(--md-sys-color-on-surface);
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .gallery-title span {
      color: var(--md-sys-color-primary);
    }

    .gallery-desc {
      font-size: 14px;
      color: var(--md-sys-color-on-surface-variant);
      max-width: 650px;
      margin: 0 auto 24px auto;
      line-height: 1.5;
    }

    /* Filter Chips Bar */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .filter-chip {
      padding: 8px 18px;
      border-radius: var(--md-sys-shape-corner-full);
      border: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-lowest);
      color: var(--md-sys-color-on-surface-variant);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition-m3);
    }

    .filter-chip:hover {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-primary);
      border-color: rgba(185, 28, 28, 0.3);
    }

    .filter-chip.active {
      background: var(--md-sys-color-primary);
      color: #ffffff;
      border-color: var(--md-sys-color-primary);
      box-shadow: var(--md-elevation-1);
    }

    /* M3 Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .gallery-card {
      background: var(--md-sys-color-surface-container-lowest);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-large);
      overflow: hidden;
      box-shadow: var(--md-elevation-1);
      transition: var(--transition-m3);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
    }

    .gallery-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--md-elevation-2);
      border-color: var(--md-sys-color-primary);
    }

    .media-wrapper {
      width: 100%;
      height: 220px;
      background: #0f172a;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-wrapper img,
    .media-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease, opacity 0.3s ease;
    }

    .gallery-card:hover .media-wrapper img,
    .gallery-card:hover .media-wrapper video {
      transform: scale(1.06);
    }

    /* Video Play Floating Badge */
    .video-play-indicator {
      position: absolute;
      width: 52px;
      height: 52px;
      background: rgba(185, 28, 28, 0.92);
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      transition: transform 0.25s ease, background 0.25s ease;
      z-index: 2;
    }

    .gallery-card:hover .video-play-indicator {
      transform: scale(1.15);
      background: #b91c1c;
    }

    .card-content {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .card-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--md-sys-color-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .card-desc {
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.4;
      margin-bottom: 14px;
    }

    .card-action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      padding-top: 12px;
      margin-top: auto;
    }

    .btn-preview {
      font-size: 12px;
      font-weight: 700;
      color: var(--md-sys-color-primary);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-download-icon {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-primary);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: var(--md-sys-shape-corner-full);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-m3);
    }

    .btn-download-icon:hover {
      background: var(--md-sys-color-primary);
      color: #ffffff;
      transform: scale(1.1);
    }

    /* LIGHTBOX MODAL */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2000;
    }

    .lightbox-modal.active {
      display: flex;
    }

    .lightbox-content {
      background: #ffffff;
      border-radius: var(--md-sys-shape-corner-large);
      max-width: 840px;
      width: 100%;
      overflow: hidden;
      box-shadow: var(--md-elevation-3);
      position: relative;
      animation: modalFadeIn 0.25s cubic-bezier(0.2, 0, 0, 1);
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .lightbox-media-wrap {
      width: 100%;
      max-height: 520px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .lightbox-media-wrap img,
    .lightbox-media-wrap video {
      max-width: 100%;
      max-height: 520px;
      object-fit: contain;
    }

    .lightbox-body {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .lightbox-info h3 {
      font-size: 18px;
      font-weight: 800;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 4px;
    }

    .lightbox-info p {
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .lightbox-close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-m3);
      z-index: 10;
    }

    .lightbox-close-btn:hover {
      background: var(--md-sys-color-primary);
    }

    .btn-lightbox-download {
      padding: 10px 20px;
      background: var(--md-sys-color-primary);
      color: #ffffff;
      border: none;
      border-radius: var(--md-sys-shape-corner-medium);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition-m3);
      white-space: nowrap;
    }

    .btn-lightbox-download:hover {
      background: var(--md-sys-color-on-primary-container);
    }

    @media (max-width: 768px) {
      .gallery-container { padding-top: 80px; }
      .gallery-title { font-size: 26px; }
      .lightbox-body { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

    let currentActiveItem = null;

    // IN-BROWSER VIDEO THUMBNAIL GENERATOR
    function captureVideoFrameThumbnail(videoUrl, targetImgElement) {
      const tempVideo = document.createElement("video");
      tempVideo.crossOrigin = "anonymous";
      tempVideo.muted = true;
      tempVideo.playsInline = true;
      tempVideo.preload = "auto";
      tempVideo.src = videoUrl;

      tempVideo.addEventListener("loadeddata", () => {
        tempVideo.currentTime = Math.min(1.0, (tempVideo.duration || 2) / 2);
      });

      tempVideo.addEventListener("seeked", () => {
        try {
          const canvas = document.createElement("canvas");
          canvas.width = 400;
          canvas.height = 240;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);
          targetImgElement.src = canvas.toDataURL("image/jpeg", 0.6);
          targetImgElement.style.opacity = "1";
        } catch (e) {
          targetImgElement.src = "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 240%22><rect width=%22100%%22 height=%22100%%22 fill=%22%231e293b%22/><text x=%2250%%22 y=%2255%%22 fill=%22%2394a3b8%22 font-size=%2218%22 font-family=%22sans-serif%22 font-weight=%22bold%22 text-anchor=%22middle%22>VIDEO PREVIEW</text></svg>";
          targetImgElement.style.opacity = "1";
        }
      });

      tempVideo.addEventListener("error", () => {
        tryAlternatePaths(targetImgElement, videoUrl, true);
      });
    }

    // DIRECT MEDIA DOWNLOAD + FIREBASE COUNTER HOOK
    async function forceDownloadMedia(mediaUrl, fileName) {
      const ext = mediaUrl.endsWith(".mp4") ? ".mp4" : (mediaUrl.endsWith(".jpeg") ? ".jpeg" : ".jpg");
      const fullFileName = fileName.endsWith(ext) ? fileName : `${fileName}${ext}`;
      
      // Increment Firebase Media Counter
      incrementMediaDownloadCount();

      try {
        const res = await fetch(mediaUrl);
        if (!res.ok) throw new Error("Fetch failed");
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = fullFileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
      } catch (err) {
        const a = document.createElement("a");
        a.href = mediaUrl;
        a.target = "_blank";
        a.download = fullFileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    }

    function renderGallery(items) {
      const grid = document.getElementById("galleryGrid");
      grid.innerHTML = "";

      if (items.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 50px; color: var(--md-sys-color-on-surface-variant);">
            <span class="material-symbols-outlined" style="font-size: 48px; color: #cbd5e1;">photo_library</span>
            <p style="margin-top: 8px; font-weight: 600;">No media items found in this category.</p>
          </div>
        `;
        return;
      }

      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "gallery-card";
        card.onclick = () => openLightbox(item);

        let mediaHtml = "";
        if (item.type === "video") {
          mediaHtml = `
            <img class="lazy-thumb video-thumb" id="thumb-${item.id}" alt="${item.title}" style="opacity: 0.8;" src="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 240%22><rect width=%22100%%22 height=%22100%%22 fill=%22%230f172a%22/></svg>">
            <div class="video-play-indicator">
              <span class="material-symbols-outlined" style="font-size: 32px;">play_arrow</span>
            </div>
          `;
        } else {
          mediaHtml = `
            <img src="${item.src}" alt="${item.title}" loading="lazy" decoding="async" onerror="tryAlternatePaths(this, '${item.src}', false)">
          `;
        }

        const categoryLabels = {
          "truck": "TRUCK FLEET",
          "packing-images": "PACKING IMAGES",
          "bike": "BIKE PACKING",
          "car": "CAR TRANSPORTATION",
          "solid-box": "SOLID BOX",
          "tv": "TV BOX"
        };

        const tagText = (categoryLabels[item.category] || item.category.toUpperCase()) + (item.type === 'video' ? ' • VIDEO' : '');

        card.innerHTML = `
          <div class="media-wrapper">
            ${mediaHtml}
          </div>
          <div class="card-content">
            <div>
              <div class="card-tag">${tagText}</div>
              <h3 class="card-title">${item.title}</h3>
              <p class="card-desc">${item.desc}</p>
            </div>
            <div class="card-action-bar">
              <span class="btn-preview">
                <span>${item.type === 'video' ? 'Play Video' : 'View Fullscreen'}</span>
                <span class="material-symbols-outlined" style="font-size: 16px;">${item.type === 'video' ? 'play_circle' : 'zoom_in'}</span>
              </span>
              <button class="btn-download-icon" onclick="event.stopPropagation(); forceDownloadMedia('${item.src}', '${item.title}')" title="Download to Device">
                <span class="material-symbols-outlined" style="font-size: 18px;">download</span>
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);

        if (item.type === "video") {
          setTimeout(() => {
            const imgTarget = document.getElementById(`thumb-${item.id}`);
            if (imgTarget) captureVideoFrameThumbnail(item.src, imgTarget);
          }, 50);
        }
      });
    }

    // MULTI-PATH FALLBACK
    function tryAlternatePaths(element, originalPath, isVideo) {
      if (element.dataset.failed) return;
      
      const fileName = originalPath.split('/').pop();

      const attempts = [
        originalPath,
        `./${originalPath}`,
        fileName,
        `images/${fileName}`,
        originalPath.replace('.jpg', '.jpeg'),
        originalPath.replace('.jpeg', '.jpg'),
        originalPath.replace('.jpg', '.JPG')
      ];

      const uniqueAttempts = [...new Set(attempts)];

      let currentAttempt = parseInt(element.dataset.attempt || "0");
      if (currentAttempt < uniqueAttempts.length) {
        element.dataset.attempt = currentAttempt + 1;
        element.src = uniqueAttempts[currentAttempt];
      } else {
        element.dataset.failed = "true";
      }
    }

    function filterGallery(category, btnElement) {
      document.querySelectorAll(".filter-chip").forEach(el => el.classList.remove("active"));
      if (btnElement) btnElement.classList.add("active");

      const filtered = GALLERY_ITEMS.filter(item => item.category === category);
      renderGallery(filtered);
    }

    function openLightbox(item) {
      currentActiveItem = item;
      const mediaWrap = document.getElementById("lightboxMediaWrap");
      mediaWrap.innerHTML = "";

      let activeMediaElement = null;

      if (item.type === "video") {
        const video = document.createElement("video");
        video.src = item.src;
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        video.style.maxWidth = "100%";
        video.style.maxHeight = "520px";
        video.onerror = function() { tryAlternatePaths(this, item.src, true); };
        mediaWrap.appendChild(video);
        activeMediaElement = video;
      } else {
        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.title;
        img.onerror = function() { tryAlternatePaths(this, item.src, false); };
        mediaWrap.appendChild(img);
        activeMediaElement = img;
      }

      document.getElementById("lightboxTitle").textContent = item.title;
      document.getElementById("lightboxDesc").textContent = item.desc;
      
      const downloadBtn = document.getElementById("lightboxDownloadBtn");
      downloadBtn.onclick = () => {
        const activeSrc = activeMediaElement.currentSrc || activeMediaElement.src || item.src;
        forceDownloadMedia(activeSrc, item.title);
      };

      document.getElementById("lightboxModal").classList.add("active");
    }

    function closeLightbox() {
      const modal = document.getElementById("lightboxModal");
      const mediaWrap = document.getElementById("lightboxMediaWrap");
      const video = mediaWrap.querySelector("video");
      if (video) video.pause();
      modal.classList.remove("active");
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeLightbox();
    });

    document.addEventListener("DOMContentLoaded", () => {
      const defaultCategory = "truck";
      const filtered = GALLERY_ITEMS.filter(item => item.category === defaultCategory);
      renderGallery(filtered);
    });
  </script>
