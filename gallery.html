<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>APML Portal — Media &amp; Packing Standards Gallery</title>

  <link rel="icon" type="image/svg+xml" href="logo.svg?v=21.0">
  <link rel="stylesheet" href="common.css?v=21.0">

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- SUPABASE JS CLIENT -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #c21d1d;
      --primary-dark: #991b1b;
      --primary-soft: rgba(194, 29, 29, 0.08);
      --bg-base: #FDF8F5;
      --surface-card: rgba(255, 255, 255, 0.95);
      --border-subtle: rgba(237, 228, 222, 0.9);
      --text-main: #1c1917;
      --text-muted: #78716c;
      --radius-xl: 20px;
      --radius-pill: 9999px;
      --shadow-card: 0 4px 20px -2px rgba(120, 113, 108, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #header-container {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.55s ease;
    }

    #header-container.header-hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .gallery-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      width: 100%;
    }

    .gallery-head-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .gallery-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(30px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .gallery-title span {
      color: var(--primary);
    }

    .gallery-sub {
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 500;
    }

    /* UNIFIED CONTROLS PANEL */
    .unified-action-panel {
      background: var(--surface-card);
      border: 1.5px dashed rgba(194, 29, 29, 0.35);
      border-radius: var(--radius-xl);
      padding: 24px 28px;
      margin-bottom: 32px;
      box-shadow: var(--shadow-card);
    }

    .unified-panel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      position: relative;
    }

    .unified-panel-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .unified-panel-divider {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--border-subtle);
    }

    .panel-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .panel-icon-badge {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .panel-head h3 {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-main);
    }

    .panel-head p {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .panel-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .folder-select, .input-text {
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      padding: 10px 16px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      flex: 1;
      min-width: 0;
    }

    .folder-select.select-highlight-error {
      border: 1.5px solid var(--primary) !important;
      background-color: #fff5f5;
      box-shadow: 0 0 0 3px rgba(194, 29, 29, 0.15);
      animation: gentleShake 0.35s ease;
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .input-text:focus, .folder-select:focus {
      border-color: var(--primary);
    }

    .btn-action-primary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: var(--radius-pill);
      font-size: 13.5px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(194, 29, 29, 0.2);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .btn-action-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-action-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* FILTER TABS & FOLDER MANAGEMENT */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 32px;
      align-items: center;
    }

    .filter-item-wrapper {
      display: inline-flex;
      align-items: center;
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      padding: 3px 6px 3px 14px;
      transition: all 0.2s ease;
    }

    .filter-item-wrapper.active {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(194, 29, 29, 0.2);
    }

    .filter-btn-text {
      background: transparent;
      border: none;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 4px 5px 0;
    }

    .filter-item-wrapper.active .filter-btn-text {
      color: #ffffff;
    }

    .btn-inline-rename {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .btn-inline-rename:hover {
      background: rgba(0, 0, 0, 0.08);
      color: var(--primary);
    }

    .filter-item-wrapper.active .btn-inline-rename {
      color: rgba(255, 255, 255, 0.8);
    }

    .filter-item-wrapper.active .btn-inline-rename:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    /* MEDIA GRID */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .media-card {
      background: var(--surface-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .media-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 32px -6px rgba(194, 29, 29, 0.12);
    }

    .media-preview-wrap {
      width: 100%;
      height: 240px;
      background: #0f172a;
      position: relative;
      overflow: hidden;
    }

    .media-preview-wrap img, .media-preview-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .media-info {
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .media-badges-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .media-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: color 0.2s ease;
    }

    .btn-download:hover {
      color: var(--primary);
    }

    /* STATE SPINNER */
    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border-subtle);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 900px) {
      .unified-panel-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }
      .unified-panel-divider {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div id="header-container"></div>

  <main class="gallery-container">
    
    <div class="gallery-head-bar">
      <div class="gallery-header">
        <h1 class="gallery-title">Standards &amp; Media <span>Gallery</span></h1>
        <p class="gallery-sub">Cloud-synced visual packaging assets and operational video documentation.</p>
      </div>
    </div>

    <!-- MERGED SINGLE PANEL (UPLOAD + FOLDER CREATOR) -->
    <div class="unified-action-panel">
      <div class="unified-panel-grid">
        
        <!-- LEFT: UPLOAD MEDIA ASSET -->
        <div class="unified-panel-col">
          <div class="panel-head">
            <div class="panel-icon-badge">
              <span class="material-symbols-outlined" style="font-size: 24px;">cloud_upload</span>
            </div>
            <div>
              <h3>Upload Media Asset</h3>
              <p id="uploadStatusText">Select destination category and upload image/video</p>
            </div>
          </div>

          <div class="panel-row">
            <select id="uploadFolderSelect" class="folder-select" required onchange="this.classList.remove('select-highlight-error')">
              <option value="" disabled selected>-- Select Folder (Compulsory) * --</option>
            </select>
            <input type="file" id="mediaFileInput" accept="image/*,video/mp4,video/webm,video/quicktime" style="display: none;" onchange="handleDirectUpload(this.files)">
            <button type="button" class="btn-action-primary" id="uploadTriggerBtn" onclick="triggerCompulsoryUpload()">
              <span class="material-symbols-outlined" style="font-size: 18px;">add_photo_alternate</span>
              <span>Upload</span>
            </button>
          </div>
        </div>

        <div class="unified-panel-divider"></div>

        <!-- RIGHT: ADD NEW FOLDER -->
        <div class="unified-panel-col">
          <div class="panel-head">
            <div class="panel-icon-badge">
              <span class="material-symbols-outlined" style="font-size: 24px;">create_new_folder</span>
            </div>
            <div>
              <h3>Add New Folder</h3>
              <p id="folderStatusText">Create custom storage category folders</p>
            </div>
          </div>

          <div class="panel-row">
            <input type="text" id="newFolderNameInput" class="input-text" placeholder="Folder label (e.g., Furniture, Fragile)">
            <button type="button" class="btn-action-primary" id="createFolderBtn" onclick="handleCreateFolder()">
              <span class="material-symbols-outlined" style="font-size: 18px;">add</span>
              <span>Create Folder</span>
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- DYNAMIC FILTER TABS -->
    <div class="filter-bar" id="filterBar"></div>

    <!-- MEDIA GRID -->
    <div class="media-grid" id="mediaGrid">
      <div class="state-msg">
        <div class="spinner"></div>
        Fetching storage bucket assets...
      </div>
    </div>

  </main>

  <div id="footer-container"></div>

  <script src="common.js?v=21.0"></script>

  <script>
    // 1. SUPABASE CLIENT & BUCKET CONFIGURATION
    const SUPABASE_URL = "https://jethunntsnnjlwnwsjrh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpldGh1bm50c25uamx3bndzanJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MTM1MTMsImV4cCI6MjEwMzI4OTUxM30.LscEvNwTob22YmaCqeYQn58eYWJremA5lm6LvQboJN0";
    const BUCKET_NAME = "gallery-media";

    const DEFAULT_FOLDERS = [
      { id: 'truck', label: 'Truck & Fleet', icon: 'local_shipping' },
      { id: 'packing-images', label: 'Packing Images', icon: 'inventory_2' },
      { id: 'bike-packing', label: 'Bike Packing', icon: 'two_wheeler' },
      { id: 'car-transportation', label: 'Car Transportation', icon: 'directions_car' },
      { id: 'solid-box', label: 'Solid Box', icon: 'package_2' },
      { id: 'tv-box', label: 'TV Box', icon: 'tv' }
    ];

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentActiveFolder = '';
    let foldersList = [];

    // 2. FOLDER STATE MANAGEMENT
    function loadFolderState() {
      const stored = localStorage.getItem('apml_gallery_folders');
      if (stored) {
        try {
          foldersList = JSON.parse(stored);
        } catch (e) {
          foldersList = [...DEFAULT_FOLDERS];
        }
      } else {
        foldersList = [...DEFAULT_FOLDERS];
      }
      renderFolderControls();
    }

    function saveFolderState() {
      localStorage.setItem('apml_gallery_folders', JSON.stringify(foldersList));
      renderFolderControls();
    }

    function renderFolderControls() {
      const filterBar = document.getElementById('filterBar');
      let tabsHtml = `
        <div class="filter-item-wrapper ${currentActiveFolder === '' ? 'active' : ''}">
          <button type="button" class="filter-btn-text" onclick="loadGalleryMedia('')">
            <span class="material-symbols-outlined" style="font-size: 17px;">grid_view</span> All Media
          </button>
        </div>
      `;

      tabsHtml += foldersList.map(folder => `
        <div class="filter-item-wrapper ${currentActiveFolder === folder.id ? 'active' : ''}">
          <button type="button" class="filter-btn-text" onclick="loadGalleryMedia('${folder.id}')">
            <span class="material-symbols-outlined" style="font-size: 17px;">${folder.icon || 'folder'}</span> ${folder.label}
          </button>
          <button type="button" class="btn-inline-rename" title="Rename Folder Label" onclick="handleRenameFolder('${folder.id}', event)">
            <span class="material-symbols-outlined" style="font-size: 15px;">edit</span>
          </button>
        </div>
      `).join('');

      filterBar.innerHTML = tabsHtml;

      const uploadSelect = document.getElementById('uploadFolderSelect');
      const prevVal = uploadSelect.value;

      let selectOptions = `<option value="" disabled ${!prevVal ? 'selected' : ''}>-- Select Folder (Compulsory) * --</option>`;
      selectOptions += foldersList.map(f => `
        <option value="${f.id}" ${prevVal === f.id ? 'selected' : ''}>${f.label}</option>
      `).join('');

      uploadSelect.innerHTML = selectOptions;
    }

    // 3. COMPULSORY FOLDER VALIDATION BEFORE UPLOAD
    function triggerCompulsoryUpload() {
      const uploadSelect = document.getElementById('uploadFolderSelect');
      const statusText = document.getElementById('uploadStatusText');

      if (!uploadSelect.value) {
        uploadSelect.classList.add('select-highlight-error');
        uploadSelect.focus();
        statusText.innerHTML = `<span style="color: var(--primary); font-weight: 700;">⚠️ Please select a folder first before uploading!</span>`;
        return;
      }

      uploadSelect.classList.remove('select-highlight-error');
      document.getElementById('mediaFileInput').click();
    }

    // 4. CREATE NEW FOLDER
    async function handleCreateFolder() {
      const input = document.getElementById('newFolderNameInput');
      const label = input.value.trim();
      const statusText = document.getElementById('folderStatusText');
      const btn = document.getElementById('createFolderBtn');

      if (!label) {
        input.focus();
        return;
      }

      const folderId = label.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');

      if (foldersList.some(f => f.id === folderId)) {
        statusText.innerHTML = `<span style="color: var(--primary);">Folder with this name already exists!</span>`;
        return;
      }

      btn.disabled = true;
      statusText.innerHTML = `<span style="color: var(--primary);">Creating folder placeholder...</span>`;

      try {
        const { error } = await supabaseClient
          .storage
          .from(BUCKET_NAME)
          .upload(`${folderId}/.emptyFolderPlaceholder`, new Blob(['']), {
            upsert: true
          });

        if (error) throw error;

        foldersList.push({ id: folderId, label: label, icon: 'folder' });
        saveFolderState();

        input.value = '';
        statusText.innerHTML = `<span style="color: #10b981;">Folder "${label}" created successfully!</span>`;
        
        const uploadSelect = document.getElementById('uploadFolderSelect');
        if (uploadSelect) uploadSelect.value = folderId;

        loadGalleryMedia(folderId);

        setTimeout(() => {
          statusText.textContent = "Create custom storage category folders";
        }, 2000);

      } catch (err) {
        console.error("Create folder error:", err);
        statusText.innerHTML = `<span style="color: var(--primary);">${err.message || 'Failed to create folder.'}</span>`;
      } finally {
        btn.disabled = false;
      }
    }

    // 5. RENAME FOLDER DISPLAY LABEL
    function handleRenameFolder(folderId, evt) {
      evt.stopPropagation();
      const folder = foldersList.find(f => f.id === folderId);
      if (!folder) return;

      const newLabel = prompt(`Rename display label for folder "${folder.label}":`, folder.label);
      if (newLabel && newLabel.trim() && newLabel.trim() !== folder.label) {
        folder.label = newLabel.trim();
        saveFolderState();
        if (currentActiveFolder === folderId) {
          loadGalleryMedia(folderId);
        }
      }
    }

    // 6. FETCH AND RENDER MEDIA ASSETS
    async function loadGalleryMedia(folderPath = '') {
      currentActiveFolder = folderPath;
      renderFolderControls();
      
      const uploadSelect = document.getElementById('uploadFolderSelect');
      if (folderPath && uploadSelect) {
        uploadSelect.value = folderPath;
        uploadSelect.classList.remove('select-highlight-error');
      }

      const grid = document.getElementById('mediaGrid');
      grid.innerHTML = `
        <div class="state-msg">
          <div class="spinner"></div>
          Loading assets...
        </div>
      `;

      try {
        let allMedia = [];

        if (folderPath === '') {
          const promises = foldersList.map(f => 
            supabaseClient.storage.from(BUCKET_NAME).list(f.id, {
              limit: 100,
              offset: 0,
              sortBy: { column: 'created_at', order: 'desc' }
            }).then(({ data, error }) => {
              if (error || !data) return [];
              return data
                .filter(file => file.name !== '.emptyFolderPlaceholder')
                .map(file => ({ ...file, folder: f.id }));
            })
          );

          const results = await Promise.all(promises);
          allMedia = results.flat();
        } else {
          const { data: files, error } = await supabaseClient
            .storage
            .from(BUCKET_NAME)
            .list(folderPath, {
              limit: 100,
              offset: 0,
              sortBy: { column: 'created_at', order: 'desc' }
            });

          if (error) throw error;

          allMedia = (files || [])
            .filter(f => f.name !== '.emptyFolderPlaceholder')
            .map(f => ({ ...f, folder: folderPath }));
        }

        if (!allMedia.length) {
          grid.innerHTML = `<div class="state-msg">No media files found in this category.</div>`;
          return;
        }

        grid.innerHTML = allMedia.map(file => {
          const filePath = file.folder ? `${file.folder}/${file.name}` : file.name;
          const { data: { publicUrl } } = supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(filePath);
          
          const isVideo = file.name.match(/\.(mp4|webm|ogg|mov)$/i);
          const matchedFolder = foldersList.find(f => f.id === file.folder);
          const folderBadge = matchedFolder ? matchedFolder.label : 'Standard';

          return `
            <div class="media-card">
              <div class="media-preview-wrap">
                ${isVideo 
                  ? `<video src="${publicUrl}" controls preload="metadata" playsinline></video>` 
                  : `<img src="${publicUrl}" alt="Media asset" loading="lazy" onerror="this.src='logo.svg'">`
                }
              </div>
              <div class="media-info">
                <div class="media-badges-group">
                  <span class="media-badge">${isVideo ? 'Video' : 'Image'}</span>
                  <span class="media-badge" style="background: rgba(0,0,0,0.05); color: var(--text-muted);">${folderBadge}</span>
                </div>
                <button type="button" class="btn-download" onclick="downloadAsset('${publicUrl}', '${file.name}')">
                  <span class="material-symbols-outlined" style="font-size: 18px;">download</span>
                  Download
                </button>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error("Supabase Storage Error:", err);
        grid.innerHTML = `
          <div class="state-msg" style="color: var(--primary);">
            Unable to fetch storage assets (${BUCKET_NAME}).<br>
            <small style="color: var(--text-muted);">Please verify that your Supabase Storage bucket <strong>"${BUCKET_NAME}"</strong> is public with SELECT RLS policies enabled.</small>
          </div>
        `;
      }
    }

    // 7. DIRECT FILE UPLOAD HANDLER
    async function handleDirectUpload(files) {
      if (!files || !files.length) return;

      const folderSelect = document.getElementById('uploadFolderSelect');
      const folder = folderSelect.value;
      const statusText = document.getElementById('uploadStatusText');
      const uploadBtn = document.getElementById('uploadTriggerBtn');

      if (!folder) {
        folderSelect.classList.add('select-highlight-error');
        folderSelect.focus();
        statusText.innerHTML = `<span style="color: var(--primary); font-weight: 700;">⚠️ Please select a folder first before uploading!</span>`;
        document.getElementById('mediaFileInput').value = '';
        return;
      }

      const file = files[0];
      const cleanFileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
      const filePath = `${folder}/${cleanFileName}`;

      uploadBtn.disabled = true;
      statusText.innerHTML = `<span style="color: var(--primary);">Uploading file to <strong>${folder}</strong>...</span>`;

      try {
        const { error } = await supabaseClient
          .storage
          .from(BUCKET_NAME)
          .upload(filePath, file, {
            cacheControl: '3600',
            upsert: false
          });

        if (error) throw error;

        statusText.innerHTML = `<span style="color: #10b981;">Uploaded successfully!</span>`;
        document.getElementById('mediaFileInput').value = '';
        
        setTimeout(() => {
          statusText.textContent = "Select destination category and upload image/video";
          loadGalleryMedia(currentActiveFolder || folder);
        }, 1200);

      } catch (err) {
        console.error("Upload failed:", err);
        statusText.innerHTML = `<span style="color: var(--primary);">Upload failed: ${err.message || 'Check RLS insert policy'}</span>`;
      } finally {
        uploadBtn.disabled = false;
      }
    }

    // 8. SECURE DIRECT DOWNLOAD HANDLER
    async function downloadAsset(fileUrl, fileName) {
      try {
        const response = await fetch(fileUrl);
        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(blobUrl);
      } catch (err) {
        window.open(fileUrl, '_blank');
      }
    }

    // Initialize gallery on page load
    document.addEventListener('DOMContentLoaded', () => {
      loadFolderState();
      loadGalleryMedia('');
    });
  </script>
</body>
</html>
