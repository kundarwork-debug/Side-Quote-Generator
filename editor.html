<style>
  /* =========================================================
     MATCHED WARM CREAM / MAIN PAGE COLOR SYSTEM
     ========================================================= */
  :root {
    --primary: #b91c1c;
    --primary-dark: #881337;
    --primary-soft: rgba(185, 28, 28, 0.06);
    --bg-base: #FDF8F5; /* Soft Warm Cream Canvas */
    --surface-card: #ffffff;
    --surface-border: #ede4de;
    --surface-subtle: #f7ede6;
    --text-main: #292524;
    --text-muted: #78716c;
    --radius-xl: 20px;
    --radius-pill: 9999px;
    --shadow-soft: 0 4px 20px -2px rgba(120, 113, 108, 0.05);
    --shadow-hover: 0 16px 30px -8px rgba(185, 28, 28, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
    --transition-m3: all 0.25s cubic-bezier(0.2, 0, 0, 1);

    /* Legacy bindings */
    --accent-exact: #b91c1c;
    --accent-exact-dark: #881337;
    --accent-max-blue: #1e40af;
    --accent-max-dark: #1e3a8a;
    --accent-max-yellow: #f4d93e;
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    background: var(--bg-base);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .ambient-glow {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none !important;
    z-index: 0;
    background: 
      radial-gradient(circle at 50% 18%, rgba(254, 215, 202, 0.35) 0%, transparent 60%),
      radial-gradient(circle at 85% 85%, rgba(254, 226, 226, 0.25) 0%, transparent 55%);
  }

  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    vertical-align: middle;
  }

  /* ---------- MAIN APP LAYOUT ---------- */
  .app {
    display: grid;
    grid-template-columns: 460px 1fr;
    min-height: 100vh;
    width: 100%;
    padding-top: 64px;
    position: relative;
    z-index: 1;
  }

  /* ---------- LEFT: CONTROL PANEL ---------- */
  .panel {
    background: rgba(255, 255, 255, 0.95);
    border-right: 1px solid var(--surface-border);
    padding: 24px;
    overflow-y: auto;
    max-height: calc(100vh - 64px);
    box-shadow: var(--shadow-soft);
    z-index: 10;
  }

  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .brand-row h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 21px;
    letter-spacing: -0.02em;
    font-weight: 800;
    margin: 0;
    color: var(--text-main);
  }

  .brand-row span {
    font-size: 12px;
    color: var(--primary);
    font-weight: 700;
    background: var(--primary-soft);
    padding: 4px 12px;
    border-radius: var(--radius-pill);
    border: 1px solid rgba(185, 28, 28, 0.15);
  }

  /* Segmented Buttons / Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    margin: 0 0 24px;
    background: var(--surface-subtle);
    padding: 6px;
    border-radius: var(--radius-xl);
    border: 1px solid var(--surface-border);
  }

  .tab-btn {
    flex: 1;
    padding: 10px 14px;
    border-radius: 14px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.35;
    transition: var(--transition-m3);
  }

  .tab-btn.active[data-company="exact"] {
    background: #ffffff;
    color: var(--primary);
    box-shadow: var(--shadow-soft);
  }

  .tab-btn.active[data-company="maxcare"] {
    background: #ffffff;
    color: var(--accent-max-blue);
    box-shadow: var(--shadow-soft);
  }

  /* Form Field Groups */
  .field-group {
    margin-bottom: 24px;
  }

  /* =========================================================
     HIGHLIGHTED CUSTOMER & DETAILS CARD
     ========================================================= */
  #sharedFieldGroup {
    background: linear-gradient(135deg, rgba(254, 242, 242, 0.85) 0%, #ffffff 100%);
    border: 1.5px solid rgba(185, 28, 28, 0.28);
    border-radius: var(--radius-xl);
    padding: 18px;
    margin-bottom: 24px;
    box-shadow: 0 4px 18px rgba(185, 28, 28, 0.06);
    position: relative;
  }

  #sharedFieldGroup h2 {
    color: var(--primary);
    font-size: 13px;
    margin-bottom: 16px;
  }

  #sharedFieldGroup h2::after {
    background: rgba(185, 28, 28, 0.2);
  }

  #sharedFieldGroup input {
    background: #ffffff;
    border-color: rgba(185, 28, 28, 0.22);
  }

  #sharedFieldGroup input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.12);
  }

  /* QUICK PRICING CONTAINER */
  .quick-pricing-card {
    background: linear-gradient(135deg, rgba(254, 242, 242, 0.9) 0%, #ffffff 100%);
    border: 1.5px solid rgba(185, 28, 28, 0.25);
    border-radius: var(--radius-xl);
    padding: 16px;
    margin-bottom: 18px;
    box-shadow: 0 4px 16px rgba(185, 28, 28, 0.05);
    position: relative;
  }

  .quick-pricing-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 800;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }

  .field-group h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin: 0 0 14px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .field-group h2::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--surface-border);
  }

  .field { margin-bottom: 14px; }
  
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-weight: 700;
  }

  .field input, .field textarea, .cost-row input, .term-row textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--surface-border);
    border-radius: 12px;
    font-size: 13px;
    font-family: inherit;
    color: var(--text-main);
    background: #ffffff;
    transition: var(--transition-m3);
  }

  .field input:focus, .field textarea:focus, .cost-row input:focus, .term-row textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.1);
  }

  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .cost-row, .term-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    align-items: center;
  }

  .cost-row input.label-in { flex: 1.6; min-width: 0; }
  .cost-row input.amt-in { flex: 1; text-align: right; min-width: 0; }
  .term-row textarea { flex: 1; min-height: 42px; resize: vertical; }

  /* Icon Buttons */
  .icon-btn {
    width: 36px;
    height: 36px;
    flex: none;
    border-radius: 50%;
    border: 1px solid var(--surface-border);
    background: #ffffff;
    color: #ef4444;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition-m3);
  }

  .icon-btn:hover {
    background: #fef2f2;
    border-color: #fca5a5;
    transform: scale(1.08);
  }

  .add-btn {
    margin-top: 8px;
    width: 100%;
    padding: 10px;
    border-radius: 12px;
    border: 1px dashed var(--surface-border);
    background: #ffffff;
    color: var(--primary);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition-m3);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .add-btn:hover {
    border-color: var(--primary);
    background: var(--primary-soft);
  }

  /* Totals Container */
  .totals-box {
    background: #ffffff;
    border: 1.5px solid var(--surface-border);
    border-radius: var(--radius-xl);
    padding: 16px 18px;
    font-size: 13px;
    margin-top: 16px;
    box-shadow: var(--shadow-soft);
  }

  .totals-box .line {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    color: var(--text-main);
  }

  .totals-box .line.total {
    font-weight: 800;
    font-size: 15px;
    color: var(--primary);
    border-top: 1px dashed var(--surface-border);
    margin-top: 6px;
    padding-top: 8px;
  }

  .reset-btn {
    width: 100%;
    padding: 11px;
    border-radius: 12px;
    border: 1px solid var(--surface-border);
    background: #ffffff;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
    transition: var(--transition-m3);
  }

  .reset-btn:hover {
    color: var(--text-main);
    background: var(--surface-subtle);
  }

  /* Download Toolbar & New Uiverse Button UI */
  .download-bar {
    position: sticky;
    bottom: -1px;
    margin-top: 28px;
    padding: 16px 0;
    border-top: 1px solid var(--surface-border);
    background: rgba(255, 255, 255, 0.95);
  }

  .download-btn {
    height: 48px;
    width: 100%;
    cursor: pointer;
    border: none;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow-soft);
    padding: 0;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .download-btn[data-company="exact"] { background: var(--accent-exact); }
  .download-btn[data-company="exact"]:hover { background: var(--accent-exact-dark); }
  .download-btn[data-company="maxcare"] { background: var(--accent-max-blue); }
  .download-btn[data-company="maxcare"]:hover { background: var(--accent-max-dark); }
  .download-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }

  .button-content {
    transform: translateY(-48px);
    transition: all 250ms ease-in-out;
  }

  .svg-container,
  .text-container {
    height: 48px;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .text-container .text {
    font-size: 14px;
    color: #fff;
    font-weight: 700;
    opacity: 1;
    transition: opacity ease-in-out 250ms;
  }

  .download-icon {
    height: 24px;
    width: 24px;
    fill: #fff;
    opacity: 0;
    transition: opacity ease-in-out 250ms;
  }

  .download-btn:hover .button-content {
    transform: translateY(0px);
  }

  .download-btn:hover .text {
    opacity: 0;
  }

  .download-btn:hover .download-icon {
    opacity: 1;
  }

  .download-btn:focus .download-icon {
    -webkit-animation: heartbeat 1.5s ease-in-out infinite both;
    animation: heartbeat 1.5s ease-in-out infinite both;
  }

  @-webkit-keyframes heartbeat {
    from { -webkit-transform: scale(1); transform: scale(1); -webkit-transform-origin: center center; transform-origin: center center; -webkit-animation-timing-function: ease-out; animation-timing-function: ease-out; }
    10% { -webkit-transform: scale(0.91); transform: scale(0.91); -webkit-animation-timing-function: ease-in; animation-timing-function: ease-in; }
    17% { -webkit-transform: scale(0.98); transform: scale(0.98); -webkit-animation-timing-function: ease-out; animation-timing-function: ease-out; }
    33% { -webkit-transform: scale(0.87); transform: scale(0.87); -webkit-animation-timing-function: ease-in; animation-timing-function: ease-in; }
    45% { -webkit-transform: scale(1); transform: scale(1); -webkit-animation-timing-function: ease-out; animation-timing-function: ease-out; }
  }
  @keyframes heartbeat {
    from { transform: scale(1); transform-origin: center center; animation-timing-function: ease-out; }
    10% { transform: scale(0.91); animation-timing-function: ease-in; }
    17% { transform: scale(0.98); animation-timing-function: ease-out; }
    33% { transform: scale(0.87); animation-timing-function: ease-in; }
    45% { transform: scale(1); animation-timing-function: ease-out; }
  }

  .status-msg {
    font-size: 12px;
    text-align: center;
    margin-top: 8px;
    color: var(--text-muted);
    min-height: 14px;
  }

  /* ---------- RIGHT: PREVIEW STAGE ---------- */
  .stage {
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-y: auto;
    max-height: calc(100vh - 64px);
    background: transparent;
  }

  .sheet-wrap { width: 100%; max-width: 794px; }

  .sheet-shadow {
    background: #fff;
    box-shadow: 0 16px 36px -8px rgba(120, 113, 108, 0.18), 0 2px 8px rgba(0, 0, 0, 0.04);
    border-radius: 8px;
    border: 1px solid var(--surface-border);
    overflow: hidden;
  }

  /* PDF Preview Page */
  #previewA4 {
    width: 794px;
    min-height: 1123px;
    margin: 0 auto;
    background: #ffffff !important;
    color: #111111 !important;
    position: relative;
    padding: 0;
    transform-origin: top left;
  }

  /* ===== PDF TEMPLATE STYLES ===== */
  .doc-exact {
    font-family: Calibri, Carlito, Arial, sans-serif;
    color: #111;
    padding: 0 0 40px;
  }
  .doc-exact .letterhead {
    background: #fffdf8; padding: 16px 46px 10px; text-align: center;
    border-bottom: 3px solid #1a1a1a;
  }
  .doc-exact .letterhead .cname {
    color: var(--accent-exact); font-weight: 700; font-size: 20pt; letter-spacing: .01em;
    text-transform: uppercase; margin: 0 0 4px; font-family: Calibri, Carlito, Arial, sans-serif;
  }
  .doc-exact .letterhead .cin {
    font-weight: 700; font-size: 10pt; letter-spacing: .02em;
  }
  .doc-exact .body { padding: 14px 46px 0; font-size: 10pt; }
  .doc-exact .meta-top { display: flex; justify-content: space-between; font-size: 10pt; margin-bottom: 10px; }
  .doc-exact .meta-block { font-size: 10pt; line-height: 1.55; margin-bottom: 8px; }
  .doc-exact .quotation-label {
    text-decoration: underline; font-weight: 700; font-size: 14pt; margin: 6px 0 10px;
    text-align: center;
  }
  .doc-exact .salut { font-weight: 700; font-size: 10pt; margin-bottom: 6px; }
  .doc-exact .intro { font-size: 10pt; line-height: 1.4; margin-bottom: 12px; text-align: justify; }
  .doc-exact .intro b { font-weight: 700; }
  table.exact-table { width: 100%; border-collapse: collapse; font-size: 10pt; margin-bottom: 12px; }
  table.exact-table th, table.exact-table td {
    border: 1px solid #1a1a1a; padding: 4px 12px;
  }
  table.exact-table th { background: #f1ede3; font-weight: 700; text-align: left; }
  table.exact-table td.amt { text-align: right; font-variant-numeric: tabular-nums; }
  table.exact-table tr.total-row td { font-weight: 700; }
  table.exact-table tr.grand-row td { font-weight: 700; background: #f7f3ea; }
  .doc-exact .terms-title { font-weight: 700; font-size: 11pt; margin: 4px 0 6px; letter-spacing: .01em; }
  .doc-exact ol.terms { margin: 0; padding-left: 20px; font-size: 10pt; line-height: 1.35; }
  .doc-exact ol.terms li { margin-bottom: 3px; text-align: justify; }
  .doc-exact .footer { margin-top: 12px; font-size: 10pt; line-height: 1.5; }
  .doc-exact .footer b { font-weight: 700; }

  /* MAXCARE PACKERS LETTERHEAD STYLING (COMPANY NAME TOP, ADDRESS DOWN) */
  .doc-max {
    font-family: Arial, Helvetica, sans-serif;
    color: #141414;
    padding: 0 0 40px;
  }
  .doc-max .letterhead {
    background: linear-gradient(180deg, #fff7cf 0%, #fdf0a8 100%);
    padding: 18px 36px 14px;
    border-bottom: 4px solid var(--accent-max-blue);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .doc-max .letterhead .cname {
    color: var(--accent-max-blue);
    font-weight: 800;
    font-size: 21pt;
    letter-spacing: .02em;
    text-transform: uppercase;
    margin: 0 0 6px 0;
    line-height: 1.15;
  }
  .doc-max .letterhead .sub {
    font-size: 9.5pt;
    font-weight: 600;
    color: #222222;
    line-height: 1.45;
    max-width: 95%;
    margin: 0 auto;
  }
  .doc-max .body { padding: 20px 40px 0; font-size: 10pt; }
  .doc-max .meta-top { display: flex; justify-content: space-between; font-size: 10pt; margin-bottom: 12px; font-weight: 700; }
  .doc-max .meta-block { font-size: 10pt; line-height: 1.7; margin-bottom: 8px; }
  .doc-max .quotation-label {
    font-weight: 700; font-size: 15pt; margin: 10px 0 14px; color: var(--accent-max-blue);
    text-align: center; letter-spacing: .04em;
  }
  .doc-max .intro { font-size: 10pt; line-height: 1.5; margin-bottom: 16px; text-align: justify; }
  .doc-max .intro b { font-weight: 700; }
  table.max-table { width: 100%; border-collapse: collapse; font-size: 10pt; margin-bottom: 18px; }
  table.max-table th, table.max-table td {
    border: 1px solid #16234a; padding: 6px 10px;
  }
  table.max-table th { background: var(--accent-max-blue); color: #fff; font-weight: 700; text-align: left; }
  table.max-table td.amt { text-align: right; font-variant-numeric: tabular-nums; }
  table.max-table td.sno { text-align: center; width: 34px; }
  table.max-table tr.total-row td { font-weight: 700; background: #fff7cf; }
  table.max-table tr.grand-row td { font-weight: 700; background: var(--accent-max-yellow); }
  .doc-max .terms-title { font-weight: 700; font-size: 13.5pt; margin: 6px 0 8px; color: var(--accent-max-blue); }
  .doc-max ol.terms { margin: 0; padding-left: 20px; font-size: 10pt; line-height: 1.5; }
  .doc-max ol.terms li { margin-bottom: 6px; text-align: justify; }
  .doc-max .footer { margin-top: 18px; font-size: 10pt; line-height: 1.6; }
  .doc-max .footer .sign { margin-top: 14px; font-weight: 700; }

  /* ---------- RESPONSIVE MEDIA QUERIES (MOBILE) ---------- */
  @media (max-width: 768px) {
    .app {
      grid-template-columns: 1fr !important;
      width: 100% !important;
      min-height: auto;
      padding-top: 64px !important;
    }

    .panel {
      width: 100% !important;
      max-height: none !important;
      border-right: none !important;
      border-bottom: 1px solid var(--surface-border);
      padding: 20px 16px 40px !important;
      box-sizing: border-box;
    }

    .totals-box {
      width: 100% !important;
      padding: 12px 14px !important;
      font-size: 12px !important;
    }

    #docDetailsGroup,
    #termsGroup,
    #regOfficeGroup {
      display: none !important;
    }

    .stage {
      display: none !important;
    }
  }

  /* ---------- LIGHT THEME TRUCK LOADING OVERLAY ---------- */
  .pdf-busy {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: rgba(253, 248, 245, 0.85);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pdf-busy[hidden] { display: none; }

  .loader-card-box {
    background-color: #FFFFFF;
    padding: 2rem 2.5rem;
    border-radius: 1.25rem;
    border: 1.5px solid var(--surface-border);
    box-shadow: 0 12px 30px rgba(120, 113, 108, 0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .loader {
    width: fit-content;
    height: fit-content;
    display: flex;

// AUTOSAVE TO APML CLOUD DRIVE (drive.html) -> "Quotation" folder
// =========================================================
const DRIVE_CLOUD_NAME = 'wbrmw2pm';
const DRIVE_UPLOAD_PRESET = 'apml_drive';
const DRIVE_UPLOAD_URL = `https://api.cloudinary.com/v1_1/${DRIVE_CLOUD_NAME}/auto/upload`;
const DRIVE_QUOTATION_FOLDER_NAME = 'Quotation';
const DRIVE_QUOTATION_FOLDER_KEY = 'quotation_folder';
const DRIVE_MAX_BYTES = 10 * 1024 * 1024;
const DRIVE_API_URL = 'https://apml-drive-api.kundar-work.workers.dev';

async function getOrCreateQuotationFolderId(database) {
  const foldersRef = database.ref('catbox_gdrive_folders');
  const snap = await foldersRef.once('value');
  const folders = snap.val() || {};

  for (const key of Object.keys(folders)) {
    const f = folders[key];
    if (f && f.parentId === 'root' && String(f.name || '').trim().toLowerCase() === DRIVE_QUOTATION_FOLDER_NAME.toLowerCase()) {
      return key;
    }
  }

  await foldersRef.child(DRIVE_QUOTATION_FOLDER_KEY).set({
    name: DRIVE_QUOTATION_FOLDER_NAME,
    parentId: 'root',
    timestamp: Date.now()
  });
  return DRIVE_QUOTATION_FOLDER_KEY;
}

function saveQuotationToDrive(pdfBlob, fileName) {
  setTimeout(async () => {
    try {
      if (!pdfBlob || pdfBlob.size > DRIVE_MAX_BYTES) {
        console.warn('Drive autosave skipped: PDF missing or larger than 10 MB.');
        return;
      }

      const formData = new FormData();
      formData.append('file', pdfBlob, fileName);
      formData.append('upload_preset', DRIVE_UPLOAD_PRESET);
      formData.append('folder', 'apml-drive');

      const res = await fetch(DRIVE_UPLOAD_URL, { method: 'POST', body: formData });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.secure_url) {
        throw new Error((data.error && data.error.message) || `HTTP ${res.status}`);
      }

      const database = firebase.database();
      const folderId = await getOrCreateQuotationFolderId(database);

      await database.ref('catbox_gdrive_files').push({
        fileId: data.secure_url,
        parentId: folderId,
        name: fileName,
        size: pdfBlob.size || 0,
        timestamp: Date.now()
      });

      fetch(`${DRIVE_API_URL}/trim-quotations`, { method: 'POST' })
        .catch((e) => console.warn('Quotation trim skipped:', e));
    } catch (err) {
      console.error('Drive autosave error:', err);
    }
  }, 300);
}

  const matchedIdx = d.costItems
    .map((item, idx) => ({ idx, pct: splits[normalizeLabel(item.label)] }))
    .filter(m => m.pct !== undefined && m.pct > 0);

  if (matchedIdx.length === 0 || total <= 0) return;

  let runningTotal = 0;
  matchedIdx.forEach((m, i) => {
    if (i === matchedIdx.length - 1) {
      d.costItems[m.idx].amount = Math.round(total - runningTotal);
    } else {
      const amt = Math.round(total * m.pct / 100);
      d.costItems[m.idx].amount = amt;
      runningTotal += amt;
    }
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

const PDF_SCALE = 2;
const PDF_JPEG_QUALITY = 0.9;

const nextPaint = () => new Promise((resolve) => requestAnimationFrame(() => setTimeout(resolve, 0)));

function saveBlobAsFile(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

document.getElementById('downloadBtn').addEventListener('click', async () => {
  if (!shared.custName.trim() || !shared.fromCity.trim() || !shared.toCity.trim()) {
    Swal.fire({
      icon: "error",
      title: "Oops...",
      text: "Please fill in customer details before downloading."
    });
    return;
  }

  // Validate total amount is greater than zero
  const d = state[active];
  const { grand } = computeTotals(d);
  if (grand <= 0) {
    Swal.fire({
      icon: "error",
      title: "Oops...",
      text: "Please fill amount first"
    });
    return;
  }

  const btn = document.getElementById('downloadBtn');
  const status = document.getElementById('statusMsg');
  const busy = document.getElementById('pdfBusy');
  btn.disabled = true;
  const originalText = btn.textContent;
  status.textContent = '';
  busy.hidden = false;
  await nextPaint();

  const node = document.getElementById('previewA4');
  const stage = document.querySelector('.stage');

  const originalWidth = node.style.width;
  const originalMinHeight = node.style.minHeight;
  const originalPosition = node.style.position;
  const originalLeft = node.style.left;
  const originalTransform = node.style.transform;
  const restorePreview = () => {
    stage.style.removeProperty('display');
    node.style.width = originalWidth;
    node.style.minHeight = originalMinHeight;
    node.style.position = originalPosition;
    node.style.left = originalLeft;
    node.style.transform = originalTransform;
  };

  const marks = { start: performance.now() };
  try {
    stage.style.setProperty('display', 'block', 'important');
    node.style.width = '794px';
    node.style.minHeight = '1123px';
    node.style.position = 'absolute';
    node.style.left = '-9999px';
    node.style.transform = 'none';

    const canvas = await html2canvas(node, {
      scale: PDF_SCALE,
      useCORS: true,
      backgroundColor: '#ffffff',
      width: 794,
      windowWidth: 794,
      logging: false
    });
    marks.captured = performance.now();

    restorePreview();

    let jpegBytes;
    const jpegBlob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', PDF_JPEG_QUALITY));
    if (jpegBlob) jpegBytes = new Uint8Array(await jpegBlob.arrayBuffer());
    marks.encoded = performance.now();

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();

    let imgW = pageW;
    let imgH = (canvas.height * imgW) / canvas.width;

    let xOffset = 0;
    let yOffset = 0;

    if (imgH > pageH) {
      const scale = pageH / imgH;
      imgH = pageH;
      imgW = imgW * scale;
      xOffset = (pageW - imgW) / 2;
    }

    pdf.addImage(jpegBytes || canvas.toDataURL('image/jpeg', PDF_JPEG_QUALITY), 'JPEG', xOffset, yOffset, imgW, imgH);

    const cleanClient = shared.custName ? shared.custName.replace(/[^a-zA-Z0-9 ]/g, '').trim() : 'Customer';
    const cleanCompany = d.companyName ? d.companyName.replace(/[^a-zA-Z0-9 ]/g, '').trim() : 'Company';
    const filename = `${cleanClient}_${cleanCompany}.pdf`;

    const pdfBlob = pdf.output('blob');
    marks.built = performance.now();

    saveBlobAsFile(pdfBlob, filename);

    try {
      if (window.APMNotify) {
        window.APMNotify.send({
          type: 'pdf',
          title: 'PDF generated',
          file: filename,
          details: { Customer: shared.custName, Company: d.companyName, Route: shared.fromCity + ' to ' + shared.toCity }
        });
      }
    } catch (e) {}

    saveQuotationToDrive(pdfBlob, filename);

    incrementPdfDownloadCount();
    
    if (typeof logDailyActivity === 'function') {
      logDailyActivity('pdf');
    }

    status.textContent = 'Downloaded ✓';

    // SweetAlert2 success popup when PDF is generated successfully
    Swal.fire({
      title: "PDF Generated Successfully!",
      icon: "success",
      draggable: true
    });

  } catch (err) {
    console.error(err);
    status.textContent = 'Something went wrong generating the PDF. Please try again.';
    restorePreview();
  } finally {
    busy.hidden = true;
    btn.disabled = false;
  }
});
