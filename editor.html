    <style>
        :root {
            --primary: #c21d1d;
            --primary-dark: #991b1b;
            --primary-gradient: linear-gradient(135deg, #c21d1d 0%, #e11d48 50%, #f43f5e 100%);
            --primary-soft: rgba(194, 29, 29, 0.08);
            
            --bg-base: #FDF8F5;
            --surface-card: #FFFFFF;
            
            --border-subtle: #ede4de;
            --border-hover: rgba(194, 29, 29, 0.35);
            
            --text-main: #292524;
            --text-secondary: #44403c;
            --text-muted: #78716c;
            
            --radius-xl: 20px;
            --radius-pill: 9999px;
            
            --shadow-card: 0 4px 20px -2px rgba(120, 113, 108, 0.05);
            --shadow-float: 0 16px 30px -8px rgba(185, 28, 28, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
            
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
            overflow-y: scroll !important;
            height: 100%;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-sans);
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100%;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: visible !important;
            position: relative;
            -webkit-font-smoothing: antialiased;
            padding-top: 80px;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        /* FORCE ALL CONTACT INITIAL AVATARS TO USE THE PAGE THEME COLOR */
        #masterResultsContainer div[style*="background-color"],
        #masterResultsContainer [class*="avatar"],
        #masterResultsContainer [class*="initials"],
        .lookup-results-list div[style*="background"] {
            background-color: var(--primary) !important;
            color: #ffffff !important;
        }

        /* LIGHT THEME TRUCK ANIMATION LOADING SCREEN STYLES */
        #pageLoadingOverlay {
            position: fixed;
            inset: 0;
            background: #FDF8F5;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        #pageLoadingOverlay.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-card-box {
            background-color: #FFFFFF;
            padding: 2rem 2.5rem;
            border-radius: 1.25rem;
            border: 1.5px solid var(--border-subtle);
            box-shadow: 0 12px 30px rgba(120, 113, 108, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .loader {
            width: fit-content;
            height: fit-content;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .truckWrapper {
            width: 200px;
            height: 100px;
            display: flex;
            flex-direction: column;
            position: relative;
            align-items: center;
            justify-content: flex-end;
            overflow-x: hidden;
        }

        .truckBody {
            width: 130px;
            height: fit-content;
            margin-bottom: 6px;
            animation: motion 1s linear infinite;
        }

        @keyframes motion {
            0% { transform: translateY(0px); }
            50% { transform: translateY(3px); }
            100% { transform: translateY(0px); }
        }

        .truckTires {
            width: 130px;
            height: fit-content;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0px 10px 0px 15px;
            position: absolute;
            bottom: 0;
        }
        .truckTires svg {
            width: 24px;
        }

        .road {
            width: 100%;
            height: 1.5px;
            background-color: #282828;
            position: relative;
            bottom: 0;
            align-self: flex-end;
            border-radius: 3px;
        }
        .road::before {
            content: "";
            position: absolute;
            width: 20px;
            height: 100%;
            background-color: #282828;
            right: -50%;
            border-radius: 3px;
            animation: roadAnimation 1.4s linear infinite;
            border-left: 10px solid white;
        }
        .road::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 100%;
            background-color: #282828;
            right: -65%;
            border-radius: 3px;
            animation: roadAnimation 1.4s linear infinite;
            border-left: 4px solid white;
        }

        .lampPost {
            position: absolute;
            bottom: 0;
            right: -90%;
            height: 90px;
            animation: roadAnimation 1.4s linear infinite;
        }

        @keyframes roadAnimation {
            0% { transform: translateX(0px); }
            100% { transform: translateX(-350px); }
        }

        .loading-label {
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .main-container {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 24px 24px 60px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .directory-header-wrap {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            background: #FFFFFF;
            border: 1px solid var(--border-subtle);
            color: var(--primary);
            border-radius: var(--radius-pill);
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
            box-shadow: var(--shadow-card);
        }

        .page-title {
            font-family: var(--font-display);
            font-size: clamp(28px, 4vw, 38px);
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.03em;
        }

        .page-title span {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            font-size: 12px;
            color: #059669;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
        }

        .card {
            background: #FFFFFF !important;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: 28px;
            box-shadow: var(--shadow-card);
            transition: all 0.25s ease;
        }

        .card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-float);
        }

        .card-header {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            letter-spacing: -0.01em;
        }

        .lookup-box {
            position: relative;
            margin-bottom: 14px;
        }

        .lookup-input {
            width: 100%;
            padding: 15px 20px 15px 48px;
            font-size: 14.5px;
            font-weight: 600;
            border: 1.5px solid var(--border-subtle);
            border-radius: var(--radius-pill);
            outline: none;
            background: #FFFFFF;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .lookup-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(194, 29, 29, 0.1);
        }

        .lookup-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 22px;
        }

        .quick-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .chip {
            background: #F7EDE6;
            border: 1px solid var(--border-subtle);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .chip:hover { background: var(--primary); color: #ffffff; border-color: var(--primary); transform: translateY(-1px); }

        .lookup-results-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }
    </style>

    <script>
        const db = firebase.database();
        const directoryRef = db.ref('directory');

        let directoryHelper = null;
        let loadedMasterData = [];
        let isAdminMode = false;

        const ALLOWED_ADMIN_EMAILS = ["kundar701@gmail.com", "kundar.work@gmail.com"];

        function hideLoadingOverlay() {
            const overlay = document.getElementById('pageLoadingOverlay');
            if (overlay) {
                overlay.classList.add('hide');
                setTimeout(() => { overlay.style.display = 'none'; }, 400);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            directoryHelper = new APMLDirectory('masterResultsContainer', 'masterSearchInput');

            directoryRef.on('value', (snapshot) => {
                const data = snapshot.val();
                
                if (!data || Object.keys(data).length === 0) {
                    document.getElementById('recordCount').innerText = "0";
                    hideLoadingOverlay();
                    return;
                }

                loadedMasterData = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                document.getElementById('recordCount').innerText = loadedMasterData.filter(i => !i.isDeleted).length;

                directoryHelper.setData(loadedMasterData);
                hideLoadingOverlay();
            });
        });

        function filterByChip(term) {
            const input = document.getElementById('masterSearchInput');
            if (input && directoryHelper) {
                input.value = term;
                directoryHelper.filterData(term);
            }
        }

        // Admin View Toggle with Google Login & Email Restriction
        function toggleAdminMode() {
            if (!isAdminMode) {
                const provider = new firebase.auth.GoogleAuthProvider();
                firebase.auth().signInWithPopup(provider)
                    .then((result) => {
                        const userEmail = (result.user.email || "").toLowerCase().trim();

                        if (!ALLOWED_ADMIN_EMAILS.includes(userEmail)) {
                            firebase.auth().signOut();
                            Swal.fire({
                                icon: 'error',
                                title: 'Access Denied',
                                text: `Account (${userEmail}) is not authorized as an Admin.`
                            });
                            return;
                        }

                        isAdminMode = true;
                        const btn = document.getElementById('adminToggleBtn');
                        btn.style.background = '#991b1b';
                        btn.title = "Exit Admin View";
                        btn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 18px; color: #ffffff;">logout</span>';

                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            icon: 'success',
                            title: `Welcome Admin (${userEmail})`,
                            showConfirmButton: false,
                            timer: 3000
                        });

                        if (directoryHelper) {
                            directoryHelper.toggleAdminView(true);
                        }
                    })
                    .catch((error) => {
                        Swal.fire({
                            icon: 'error',
                            title: 'Sign-In Failed',
                            text: error.message
                        });
                    });
            } else {
                firebase.auth().signOut().then(() => {
                    isAdminMode = false;
                    const btn = document.getElementById('adminToggleBtn');
                    btn.style.background = '#ffffff';
                    btn.title = "Admin Login";
                    btn.innerHTML = `
                        <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
                            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.15v3.14C3.15 21.32 7.22 24 12 24z"/>
                            <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.15C.42 8.1 0 9.77 0 11.5s.42 3.4 1.15 4.88l4.12-3.14z"/>
                            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.68 1.15 6.62l4.12 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/>
                        </svg>`;

                    if (directoryHelper) {
                        directoryHelper.toggleAdminView(false);
                    }
                });
            }
        }

        // Open SweetAlert modal to create new contact
        window.openCreateContactModal = async function() {
            const { value: formValues } = await Swal.fire({
                title: 'Create New Contact',
                html:
                    '<input id="swal-category" class="swal2-input" placeholder="Category (e.g., Hub / Branch)">' +
                    '<input id="swal-location" class="swal2-input" placeholder="Location / Branch Name">' +
                    '<input id="swal-region" class="swal2-input" placeholder="Region">' +
                    '<input id="swal-designation" class="swal2-input" placeholder="Designation / Role">' +
                    '<input id="swal-name" class="swal2-input" placeholder="Contact Person Name">' +
                    '<input id="swal-contact" class="swal2-input" placeholder="Contact Number">' +
                    '<input id="swal-address" class="swal2-input" placeholder="Full Address">',
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonColor: '#c21d1d',
                preConfirm: () => {
                    return {
                        category: document.getElementById('swal-category').value.trim(),
                        location: document.getElementById('swal-location').value.trim(),
                        region: document.getElementById('swal-region').value.trim(),
                        designation: document.getElementById('swal-designation').value.trim(),
                        name: document.getElementById('swal-name').value.trim(),
                        contact: document.getElementById('swal-contact').value.trim(),
                        address: document.getElementById('swal-address').value.trim(),
                        isDeleted: false
                    }
                }
            });

            if (formValues) {
                if (!formValues.name || !formValues.location) {
                    Swal.fire('Error', 'Name and Location are required fields!', 'error');
                    return;
                }

                directoryRef.push(formValues).then(() => {
                    Swal.fire({
                        position: 'top-end',
                        icon: 'success',
                        title: 'New contact created successfully!',
                        showConfirmButton: false,
                        timer: 1500
                    });
                }).catch(err => {
                    Swal.fire('Error', err.message, 'error');
                });
            }
        };

        window.saveRecord = function(id) {
            const updatedData = {
                category: document.getElementById(`cat_${id}`).value.trim(),
                location: document.getElementById(`loc_${id}`).value.trim(),
                region: document.getElementById(`reg_${id}`).value.trim(),
                designation: document.getElementById(`des_${id}`).value.trim(),
                name: document.getElementById(`nam_${id}`).value.trim(),
                contact: document.getElementById(`con_${id}`).value.trim(),
                address: document.getElementById(`adr_${id}`).value.trim()
            };

            const existing = loadedMasterData.find(i => String(i.id) === String(id));
            if (existing && existing.isDeleted) {
                updatedData.isDeleted = true;
            }

            const record = loadedMasterData.find(i => String(i.id) === String(id) || String(i.firebaseKey) === String(id));
            const targetKey = record ? (record.firebaseKey || record.id) : id;

            directoryRef.child(targetKey).set(updatedData).then(() => {
                Swal.fire({
                  position: "top-end",
                  icon: "success",
                  title: "Your work has been saved",
                  showConfirmButton: false,
                  timer: 1500
                });
                toggleEditCard(id);
            }).catch(err => {
                Swal.fire({
                  icon: "error",
                  title: "Oops...",
                  text: "Error updating record: " + err.message
                });
            });
        };

        // Soft Delete: sets isDeleted: true using exact database key lookup
        window.deleteRecord = function(id) {
            const record = loadedMasterData.find(i => String(i.id) === String(id) || String(i.firebaseKey) === String(id));
            const targetKey = record ? (record.firebaseKey || record.id) : id;

            Swal.fire({
              title: "Are you sure?",
              text: "This contact will be hidden from the directory page.",
              icon: "warning",
              showCancelButton: true,
              confirmButtonColor: "#c21d1d",
              cancelButtonColor: "#78716c",
              confirmButtonText: "Yes, delete it!"
            }).then((result) => {
              if (result.isConfirmed) {
                directoryRef.child(targetKey).update({ isDeleted: true }).then(() => {
                  Swal.fire({
                    title: "Deleted!",
                    text: "Your file has been deleted.",
                    icon: "success"
                  });
                }).catch(err => {
                  Swal.fire({
                    icon: "error",
                    title: "Oops...",
                    text: "Error deleting record: " + err.message
                  });
                });
              }
            });
        };

        // Restore contact
        window.restoreRecord = function(id) {
            const record = loadedMasterData.find(i => String(i.id) === String(id) || String(i.firebaseKey) === String(id));
            const targetKey = record ? (record.firebaseKey || record.id) : id;

            directoryRef.child(targetKey).update({ isDeleted: false }).then(() => {
                Swal.fire({
                  title: "Restored!",
                  text: "Contact is now active again.",
                  icon: "success",
                  timer: 1500,
                  showConfirmButton: false
                });
            }).catch(err => {
                Swal.fire({
                  icon: "error",
                  title: "Oops...",
                  text: "Error restoring record: " + err.message
                });
            });
        };

        // Permanent Delete
        window.permanentDeleteRecord = function(id) {
            const record = loadedMasterData.find(i => String(i.id) === String(id) || String(i.firebaseKey) === String(id));
            const targetKey = record ? (record.firebaseKey || record.id) : id;

            Swal.fire({
              title: "Delete Permanently?",
              text: "This will permanently remove the contact from the database. You won't be able to recover this!",
              icon: "error",
              showCancelButton: true,
              confirmButtonColor: "#dc2626",
              cancelButtonColor: "#78716c",
              confirmButtonText: "Yes, delete permanently!"
            }).then((result) => {
              if (result.isConfirmed) {
                directoryRef.child(targetKey).remove().then(() => {
                  Swal.fire({
                    title: "Permanently Deleted!",
                    text: "The contact has been permanently removed.",
                    icon: "success",
                    timer: 1500,
                    showConfirmButton: false
                  });
                }).catch(err => {
                  Swal.fire({
                    icon: "error",
                    title: "Oops...",
                    text: "Error deleting permanently: " + err.message
                  });
                });
              }
            });
        };
    </script>
</body>
