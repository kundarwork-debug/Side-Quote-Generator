<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotation Editor - APML Support Page</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2242%22 fill=%22none%22 stroke=%22%23b91c1c%22 stroke-width=%229%22/><text x=%2250%22 y=%2262%22 font-size=%2238%22 font-family=%22Arial, Helvetica, sans-serif%22 font-weight=%22900%22 fill=%22%23b91c1c%22 text-anchor=%22middle%22 letter-spacing=%22-1%22>KP</text></svg>">

<link rel="stylesheet" href="common.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  /* =========================================================
     GOOGLE MATERIAL DESIGN 3 (M3) THEME SYSTEM
     ========================================================= */
  :root {
    --md-sys-color-primary: #b91c1c;
    --md-sys-color-primary-container: #fef2f2;
    --md-sys-color-on-primary-container: #991b1b;
    --md-sys-color-surface: #f8fafc;
    --md-sys-color-surface-container-lowest: #ffffff;
    --md-sys-color-surface-container-low: #f1f5f9;
    --md-sys-color-surface-container: #e2e8f0;
    --md-sys-color-outline: #cbd5e1;
    --md-sys-color-outline-variant: #e2e8f0;
    --md-sys-color-on-surface: #0f172a;
    --md-sys-color-on-surface-variant: #64748b;
    --md-sys-shape-corner-small: 8px;
    --md-sys-shape-corner-medium: 12px;
    --md-sys-shape-corner-large: 16px;
    --md-sys-shape-corner-full: 9999px;
    --md-elevation-1: 0px 1px 3px rgba(0, 0, 0, 0.08), 0px 1px 2px rgba(0, 0, 0, 0.04);
    --md-elevation-2: 0px 4px 12px rgba(0, 0, 0, 0.08), 0px 2px 4px rgba(0, 0, 0, 0.04);
    --md-elevation-3: 0px 12px 28px rgba(0, 0, 0, 0.12), 0px 4px 8px rgba(0, 0, 0, 0.06);
    --transition-m3: all 0.25s cubic-bezier(0.2, 0, 0, 1);

    /* Legacy compatibility bindings */
    --bg-main: var(--md-sys-color-surface);
    --panel-bg: var(--md-sys-color-surface-container-lowest);
    --card-bg: var(--md-sys-color-surface-container-lowest);
    --border-light: var(--md-sys-color-outline-variant);
    --border-hover: var(--md-sys-color-outline);
    --text-main: var(--md-sys-color-on-surface);
    --text-muted: var(--md-sys-color-on-surface-variant);
    --accent-exact: #b91c1c;
    --accent-exact-dark: #991b1b;
    --accent-max-blue: #1e40af;
    --accent-max-dark: #1e3a8a;
    --accent-max-yellow: #f4d93e;
  }

  /* Dark Theme M3 Overrides */
  body.dark-theme {
    --md-sys-color-surface: #0b0f19;
    --md-sys-color-surface-container-lowest: #151e2e;
    --md-sys-color-surface-container-low: #1e293b;
    --md-sys-color-surface-container: #334155;
    --md-sys-color-outline: #475569;
    --md-sys-color-outline-variant: rgba(255, 255, 255, 0.12);
    --md-sys-color-on-surface: #f8fafc;
    --md-sys-color-on-surface-variant: #94a3b8;
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    background: var(--md-sys-color-surface);
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--md-sys-color-on-surface);
    -webkit-font-smoothing: antialiased;
  }

  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    vertical-align: middle;
  }

  /* ---------- MAIN APP LAYOUT ---------- */
  .app {
    display: grid;
    grid-template-columns: 460px 1fr;
    min-height: 100vh;
    width: 100%;
    padding-top: 64px;
  }

  /* ---------- LEFT: CONTROL PANEL ---------- */
  .panel {
    background: var(--md-sys-color-surface-container-lowest);
    border-right: 1px solid var(--md-sys-color-outline-variant);
    padding: 24px;
    overflow-y: auto;
    max-height: calc(100vh - 64px);
    box-shadow: var(--md-elevation-1);
    z-index: 10;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--md-sys-color-on-surface-variant);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 6px 12px;
    margin-bottom: 16px;
    text-decoration: none;
    border-radius: var(--md-sys-shape-corner-full);
    transition: var(--transition-m3);
  }

  .back-btn:hover {
    color: var(--md-sys-color-primary);
    background: var(--md-sys-color-primary-container);
  }

  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .brand-row h1 {
    font-size: 20px;
    letter-spacing: -0.02em;
    font-weight: 800;
    margin: 0;
    color: var(--md-sys-color-on-surface);
  }

  .brand-row span {
    font-size: 12px;
    color: var(--md-sys-color-primary);
    font-weight: 700;
    background: var(--md-sys-color-primary-container);
    padding: 4px 12px;
    border-radius: var(--md-sys-shape-corner-full);
    border: 1px solid rgba(185, 28, 28, 0.2);
  }

  /* M3 Segmented Buttons / Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    margin: 0 0 24px;
    background: var(--md-sys-color-surface-container-low);
    padding: 6px;
    border-radius: var(--md-sys-shape-corner-medium);
    border: 1px solid var(--md-sys-color-outline-variant);
  }

  .tab-btn {
    flex: 1;
    padding: 10px 14px;
    border-radius: var(--md-sys-shape-corner-small);
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    color: var(--md-sys-color-on-surface-variant);
    text-align: center;
    line-height: 1.35;
    transition: var(--transition-m3);
  }

  .tab-btn.active[data-company="exact"] {
    background: var(--md-sys-color-surface-container-lowest);
    color: var(--md-sys-color-primary);
    box-shadow: var(--md-elevation-1);
  }

  .tab-btn.active[data-company="maxcare"] {
    background: var(--md-sys-color-surface-container-lowest);
    color: var(--accent-max-blue);
    box-shadow: var(--md-elevation-1);
  }

  /* M3 Form Field Groups */
  .field-group {
    margin-bottom: 24px;
  }

  #sharedFieldGroup {
    background: var(--md-sys-color-surface-container-low);
    border: 1px solid var(--md-sys-color-outline-variant);
    border-radius: var(--md-sys-shape-corner-large);
    padding: 18px;
    margin-bottom: 24px;
  }

  .field-group h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--md-sys-color-on-surface-variant);
    margin: 0 0 14px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .field-group h2::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--md-sys-color-outline-variant);
  }

  .field { margin-bottom: 14px; }
  
  .field label {
    display: block;
    font-size: 12px;
    color: var(--md-sys-color-on-surface-variant);
    margin-bottom: 6px;
    font-weight: 700;
  }

  .field input, .field textarea, .cost-row input, .term-row textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--md-sys-color-outline-variant);
    border-radius: var(--md-sys-shape-corner-medium);
    font-size: 13px;
    font-family: inherit;
    color: var(--md-sys-color-on-surface);
    background: var(--md-sys-color-surface-container-lowest);
    transition: var(--transition-m3);
  }

  .field input:focus, .field textarea:focus, .cost-row input:focus, .term-row textarea:focus {
    outline: none;
    border-color: var(--md-sys-color-primary);
    box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.12);
  }

  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .cost-row, .term-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    align-items: center;
  }

  .cost-row input.label-in { flex: 1.6; min-width: 0; }
  .cost-row input.amt-in { flex: 1; text-align: right; min-width: 0; }
  .term-row textarea { flex: 1; min-height: 42px; resize: vertical; }

  /* M3 Icon Buttons */
  .icon-btn {
    width: 36px;
    height: 36px;
    flex: none;
    border-radius: var(--md-sys-shape-corner-full);
    border: 1px solid var(--md-sys-color-outline-variant);
    background: var(--md-sys-color-surface-container-lowest);
    color: #ef4444;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition-m3);
  }

  .icon-btn:hover {
    background: #fef2f2;
    border-color: #fca5a5;
    transform: scale(1.08);
  }

  .add-btn {
    margin-top: 8px;
    width: 100%;
    padding: 10px;
    border-radius: var(--md-sys-shape-corner-medium);
    border: 1px dashed var(--md-sys-color-outline);
    background: var(--md-sys-color-surface-container-low);
    color: var(--md-sys-color-primary);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition-m3);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .add-btn:hover {
    border-color: var(--md-sys-color-primary);
    background: var(--md-sys-color-primary-container);
  }

  /* M3 Totals Container */
  .totals-box {
    background: var(--md-sys-color-primary-container);
    border: 1px solid rgba(185, 28, 28, 0.2);
    border-radius: var(--md-sys-shape-corner-medium);
    padding: 14px 16px;
    font-size: 13px;
    margin-top: 16px;
  }

  .totals-box .line {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    color: var(--md-sys-color-on-surface);
  }

  .totals-box .line.total {
    font-weight: 800;
    font-size: 15px;
    color: var(--md-sys-color-primary);
    border-top: 1px dashed rgba(185, 28, 28, 0.3);
    margin-top: 6px;
    padding-top: 8px;
  }

  .reset-btn {
    width: 100%;
    padding: 11px;
    border-radius: var(--md-sys-shape-corner-medium);
    border: 1px solid var(--md-sys-color-outline-variant);
    background: var(--md-sys-color-surface-container-lowest);
    color: var(--md-sys-color-on-surface-variant);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
    transition: var(--transition-m3);
  }

  .reset-btn:hover {
    color: var(--md-sys-color-on-surface);
    border-color: var(--md-sys-color-outline);
    background: var(--md-sys-color-surface-container-low);
  }

  /* M3 Floating Download Toolbar */
  .download-bar {
    position: sticky;
    bottom: -1px;
    margin-top: 28px;
    padding: 16px 0;
    border-top: 1px solid var(--md-sys-color-outline-variant);
    background: var(--md-sys-color-surface-container-lowest);
  }

  .download-btn {
    width: 100%;
    padding: 14px 20px;
    border: none;
    border-radius: var(--md-sys-shape-corner-medium);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: var(--transition-m3);
    box-shadow: var(--md-elevation-1);
  }

  .download-btn[data-company="exact"] { background: var(--accent-exact); }
  .download-btn[data-company="exact"]:hover { background: var(--accent-exact-dark); transform: translateY(-2px); box-shadow: var(--md-elevation-2); }
  .download-btn[data-company="maxcare"] { background: var(--accent-max-blue); }
  .download-btn[data-company="maxcare"]:hover { background: var(--accent-max-dark); transform: translateY(-2px); box-shadow: var(--md-elevation-2); }
  .download-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }

  .status-msg {
    font-size: 12px;
    text-align: center;
    margin-top: 8px;
    color: var(--md-sys-color-on-surface-variant);
    min-height: 14px;
  }

  /* ---------- RIGHT: PREVIEW STAGE ---------- */
  .stage {
    padding: 40px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-y: auto;
    max-height: calc(100vh - 64px);
    background: var(--md-sys-color-surface-container-low);
  }

  .sheet-wrap { width: 100%; max-width: 794px; }

  .sheet-shadow {
    background: #fff;
    box-shadow: var(--md-elevation-3);
    border-radius: 4px;
    overflow: hidden;
  }

  /* PDF Preview Page - Kept Exact White Paper Style Always */
  #previewA4 {
    width: 794px;
    min-height: 1123px;
    margin: 0 auto;
    background: #ffffff !important;
    color: #111111 !important;
    position: relative;
    padding: 0;
    transform-origin: top left;
  }

  /* ===== PDF TEMPLATE STYLES (UNTOUCHED) ===== */
  .doc-exact {
    font-family: Calibri, Carlito, Arial, sans-serif;
    color: #111;
    padding: 0 0 40px;
  }
  .doc-exact .letterhead {
    background: #fffdf8; padding: 16px 46px 10px; text-align: center;
    border-bottom: 3px solid #1a1a1a;
  }
  .doc-exact .letterhead .cname {
    color: var(--accent-exact); font-weight: 700; font-size: 20pt; letter-spacing: .01em;
    text-transform: uppercase; margin: 0 0 4px; font-family: Calibri, Carlito, Arial, sans-serif;
  }
  .doc-exact .letterhead .cin {
    font-weight: 700; font-size: 10pt; letter-spacing: .02em;
  }
  .doc-exact .body { padding: 14px 46px 0; font-size: 10pt; }
  .doc-exact .meta-top { display: flex; justify-content: space-between; font-size: 10pt; margin-bottom: 10px; }
  .doc-exact .meta-block { font-size: 10pt; line-height: 1.55; margin-bottom: 8px; }
  .doc-exact .quotation-label {
    text-decoration: underline; font-weight: 700; font-size: 14pt; margin: 6px 0 10px;
  }
  .doc-exact .salut { font-weight: 700; font-size: 10pt; margin-bottom: 6px; }
  .doc-exact .intro { font-size: 10pt; line-height: 1.4; margin-bottom: 12px; text-align: justify; }
  .doc-exact .intro b { font-weight: 700; }
  table.exact-table { width: 100%; border-collapse: collapse; font-size: 10pt; margin-bottom: 12px; }
  table.exact-table th, table.exact-table td {
    border: 1px solid #1a1a1a; padding: 4px 12px;
  }
  table.exact-table th { background: #f1ede3; font-weight: 700; text-align: left; }
  table.exact-table td.amt { text-align: right; font-variant-numeric: tabular-nums; }
  table.exact-table tr.total-row td { font-weight: 700; }
  table.exact-table tr.grand-row td { font-weight: 700; background: #f7f3ea; }
  .doc-exact .terms-title { font-weight: 700; font-size: 11pt; margin: 4px 0 6px; letter-spacing: .01em; }
  .doc-exact ol.terms { margin: 0; padding-left: 20px; font-size: 10pt; line-height: 1.35; }
  .doc-exact ol.terms li { margin-bottom: 3px; text-align: justify; }
  .doc-exact .footer { margin-top: 12px; font-size: 10pt; line-height: 1.5; }
  .doc-exact .footer b { font-weight: 700; }

  .doc-max {
    font-family: Arial, Helvetica, sans-serif;
    color: #141414;
    padding: 0 0 40px;
  }
  .doc-max .letterhead {
    background: linear-gradient(180deg, #fff7cf 0%, #fdf0a8 100%);
    padding: 16px 40px; border-bottom: 4px solid var(--accent-max-blue);
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .doc-max .letterhead .cname {
    color: var(--accent-max-blue); font-weight: 700; font-size: 18pt; letter-spacing: .01em;
    text-transform: uppercase; margin: 0 0 4px;
  }
  .doc-max .letterhead .sub { font-size: 9pt; font-weight: 700; color: #222; }
  .doc-max .body { padding: 20px 40px 0; font-size: 10pt; }
  .doc-max .meta-top { display: flex; justify-content: space-between; font-size: 10pt; margin-bottom: 12px; font-weight: 700; }
  .doc-max .meta-block { font-size: 10pt; line-height: 1.7; margin-bottom: 8px; }
  .doc-max .quotation-label {
    font-weight: 700; font-size: 15pt; margin: 10px 0 14px; color: var(--accent-max-blue);
    text-align: center; letter-spacing: .04em;
  }
  .doc-max .intro { font-size: 10pt; line-height: 1.5; margin-bottom: 16px; text-align: justify; }
  .doc-max .intro b { font-weight: 700; }
  table.max-table { width: 100%; border-collapse: collapse; font-size: 10pt; margin-bottom: 18px; }
  table.max-table th, table.max-table td {
    border: 1px solid #16234a; padding: 6px 10px;
  }
  table.max-table th { background: var(--accent-max-blue); color: #fff; font-weight: 700; text-align: left; }
  table.max-table td.amt { text-align: right; font-variant-numeric: tabular-nums; }
  table.max-table td.sno { text-align: center; width: 34px; }
  table.max-table tr.total-row td { font-weight: 700; background: #fff7cf; }
  table.max-table tr.grand-row td { font-weight: 700; background: var(--accent-max-yellow); }
  .doc-max .terms-title { font-weight: 700; font-size: 13.5pt; margin: 6px 0 8px; color: var(--accent-max-blue); }
  .doc-max ol.terms { margin: 0; padding-left: 20px; font-size: 10pt; line-height: 1.5; }
  .doc-max ol.terms li { margin-bottom: 6px; text-align: justify; }
  .doc-max .footer { margin-top: 18px; font-size: 10pt; line-height: 1.6; }
  .doc-max .footer .sign { margin-top: 14px; font-weight: 700; }

  /* ---------- RESPONSIVE MEDIA QUERIES (MOBILE) ---------- */
  @media (max-width: 768px) {
    .app {
      grid-template-columns: 1fr !important;
      width: 100% !important;
      min-height: auto;
      padding-top: 56px !important;
    }

    .panel {
      width: 100% !important;
      max-height: none !important;
      border-right: none !important;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      padding: 20px 16px 40px !important;
      box-sizing: border-box;
    }

    .totals-box {
      width: 100% !important;
      padding: 10px 12px !important;
      font-size: 12px !important;
      box-sizing: border-box !important;
    }

    .totals-box .line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      word-break: break-word;
    }

    .totals-box .line span {
      font-size: 12px !important;
    }

    #docDetailsGroup,
    #termsGroup,
    #regOfficeGroup {
      display: none !important;
    }

    .stage {
      display: none !important;
    }
  }
</style>
</head>
<body>

<div id="header-container"></div>

<div class="app" id="appView">
  <div class="panel">
    <a href="index.html" class="back-btn">
      <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
      <span>Back to Main Page</span>
    </a>

    <div class="brand-row">
      <h1>Quotation Editor</h1>
      <span id="dateStamp"></span>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-company="exact" id="tabExact">Exact Container<br>Logistics</button>
      <button class="tab-btn" data-company="maxcare" id="tabMaxcare">Maxcare Packers<br>&amp; Movers</button>
    </div>

    <div class="field-group" id="sharedFieldGroup">
      <h2><span class="material-symbols-outlined" style="font-size: 16px;">person</span> Customer &amp; details <span style="text-transform:none; font-weight:400; opacity:0.8;">— shared</span></h2>
      <div class="field"><label>Date</label><input id="f_date"></div>
      <div class="field"><label>Customer name *</label><input id="f_custName"></div>
      <div class="row2">
        <div class="field"><label>Customer company</label><input id="f_custCompany"></div>
        <div class="field"><label>Customer GST</label><input id="f_custGst"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Moving from *</label><input id="f_fromCity"></div>
        <div class="field"><label>Moving to *</label><input id="f_toCity"></div>
      </div>
    </div>

    <div class="field-group" id="docDetailsGroup">
      <h2><span class="material-symbols-outlined" style="font-size: 16px;">description</span> Document details</h2>
      <div class="field"><label id="lblDocNoLabel">Estimate No.</label><input id="f_docNo"></div>
      <div class="field"><label id="lblGstLabel">GST No. (ours)</label><input id="f_gstNo"></div>
    </div>

    <div class="field-group" id="costItemsGroup">
      <h2><span class="material-symbols-outlined" style="font-size: 16px;">payments</span> Cost items</h2>
      <div class="field" style="margin-bottom:14px;">
        <label>Total amount (auto-fills below using standard %)</label>
        <div style="display:flex; gap:8px;">
          <input id="f_totalAmount" placeholder="e.g. 47500" style="flex:1;">
          <button id="applyTotalBtn" style="flex:none; padding:0 18px; border-radius:var(--md-sys-shape-corner-medium); border:1px solid var(--md-sys-color-outline-variant); background:var(--md-sys-color-surface-container-low); color:var(--md-sys-color-on-surface); font-size:13px; font-weight:700; cursor:pointer; transition: var(--transition-m3);">Apply</button>
        </div>
      </div>

function getFormattedCurrentDate() {
  const d = new Date();
  const day = d.getDate();
  let suffix = "th";
  if (day % 10 === 1 && day !== 11) suffix = "st";
  else if (day % 10 === 2 && day !== 12) suffix = "nd";
  else if (day % 10 === 3 && day !== 13) suffix = "rd";
  
  const paddedDay = String(day).padStart(2, '0');
  const month = d.toLocaleDateString('en-IN', { month: 'short' });
  const year = d.getFullYear();
  return `${paddedDay}${suffix} ${month} ${year}`;
}

function normalizeLabel(s){ return String(s).trim().toLowerCase(); }

function fmt(n){
  n = Number(n) || 0;
  return n.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function computeTotals(data){
  const subtotal = data.costItems.reduce((s,i)=> s + (Number(i.amount)||0), 0);
  const gstAmount = subtotal * (Number(data.gstPercent)||0) / 100;
  const grand = subtotal + gstAmount;
  return { subtotal, gstAmount, grand };
}

function applyTotalAmount(){
  const total = parseFloat(document.getElementById('f_totalAmount').value) || 0;
  const d = state[active];
  const splits = PERCENT_SPLITS[active] || {};

  const matchedIdx = d.costItems
    .map((item, idx) => ({ idx, pct: splits[normalizeLabel(item.label)] }))
    .filter(m => m.pct !== undefined);

  if (matchedIdx.length === 0 || total <= 0) return;

  let runningTotal = 0;
  matchedIdx.forEach((m, i) => {
    if (i === matchedIdx.length - 1) {
      d.costItems[m.idx].amount = Math.round(total - runningTotal);
    } else {
      const amt = Math.round(total * m.pct / 100);
      d.costItems[m.idx].amount = amt;
      runningTotal += amt;
    }
  });
}

document.getElementById('downloadBtn').addEventListener('click', async () => {
  if (!shared.custName.trim() || !shared.fromCity.trim() || !shared.toCity.trim()) {
    alert("APML ke balak details tho bharo paheley");
    return;
  }

  const btn = document.getElementById('downloadBtn');
  const status = document.getElementById('statusMsg');
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = 'Preparing PDF…';
  status.textContent = '';

  const node = document.getElementById('previewA4');
  const stage = document.querySelector('.stage');

  const originalStageDisplay = stage.style.display;
  const originalWidth = node.style.width;
  const originalMinHeight = node.style.minHeight;
  const originalPosition = node.style.position;
  const originalLeft = node.style.left;
  const originalTransform = node.style.transform;

  try {
    stage.style.display = 'block';
    node.style.width = '794px';
    node.style.minHeight = '1123px';
    node.style.position = 'absolute';
    node.style.left = '-9999px';
    node.style.transform = 'none';

    const canvas = await html2canvas(node, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#ffffff',
      width: 794,
      windowWidth: 794
    });

    stage.style.display = originalStageDisplay;
    node.style.width = originalWidth;
    node.style.minHeight = originalMinHeight;
    node.style.position = originalPosition;
    node.style.left = originalLeft;
    node.style.transform = originalTransform;

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();

    let imgW = pageW;
    let imgH = (canvas.height * imgW) / canvas.width;

    let xOffset = 0;
    let yOffset = 0;

    if (imgH > pageH) {
      const scale = pageH / imgH;
      imgH = pageH;
      imgW = imgW * scale;
      xOffset = (pageW - imgW) / 2;
    }

    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    pdf.addImage(imgData, 'JPEG', xOffset, yOffset, imgW, imgH);

    const d = state[active];
    const safeName = (s) => String(s).replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g,'');
    const filename = `${safeName(d.companyName)}_Quotation_${safeName(shared.custName || 'Customer')}.pdf`;
    pdf.save(filename);

    status.textContent = 'Downloaded ✓';
  } catch (err) {
    console.error(err);
    status.textContent = 'Something went wrong generating the PDF. Please try again.';
    
    stage.style.display = originalStageDisplay;
    node.style.width = originalWidth;
    node.style.minHeight = originalMinHeight;
    node.style.position = originalPosition;
    node.style.left = originalLeft;
    node.style.transform = originalTransform;
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
});

document.getElementById('dateStamp').textContent = new Date().toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
