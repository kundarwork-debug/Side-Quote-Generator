<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APML Master Enterprise Directory</title>
    
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=21.35">
    <link rel="stylesheet" href="common.css?v=21.35">

    <!-- SheetJS Library for Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        :root {
            --primary: #c21d1d;
            --primary-dark: #991b1b;
            --primary-gradient: linear-gradient(135deg, #c21d1d 0%, #e11d48 50%, #f43f5e 100%);
            --primary-soft: rgba(194, 29, 29, 0.08);
            
            --bg-base: #FDF8F5;
            --surface-card: #FFFFFF;
            
            --border-subtle: #ede4de;
            --border-hover: rgba(194, 29, 29, 0.35);
            
            --text-main: #292524;
            --text-secondary: #44403c;
            --text-muted: #78716c;
            
            --radius-xl: 20px;
            --radius-pill: 9999px;
            
            --shadow-card: 0 4px 20px -2px rgba(120, 113, 108, 0.05);
            --shadow-float: 0 16px 30px -8px rgba(185, 28, 28, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
            
            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
            overflow-y: scroll !important;
            height: 100%;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-sans);
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100%;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: visible !important;
            position: relative;
            -webkit-font-smoothing: antialiased;
            padding-top: 80px;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        #pageLoadingOverlay {
            position: fixed;
            inset: 0;
            background: var(--bg-base);
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        #pageLoadingOverlay.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-spinner-box {
            position: relative;
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-ring {
            position: absolute;
            inset: 0;
            border: 3.5px solid rgba(194, 29, 29, 0.15);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spinLoader 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        }

        .loader-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        @keyframes spinLoader {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .main-container {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 24px 24px 60px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        .directory-header-wrap {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            background: #FFFFFF;
            border: 1px solid var(--border-subtle);
            color: var(--primary);
            border-radius: var(--radius-pill);
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
            box-shadow: var(--shadow-card);
        }

        .page-title {
            font-family: var(--font-display);
            font-size: clamp(28px, 4vw, 38px);
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.03em;
        }

        .page-title span {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            font-size: 12px;
            color: #059669;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
        }

        .card {
            background: #FFFFFF !important;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: 28px;
            box-shadow: var(--shadow-card);
            transition: all 0.25s ease;
        }

        .card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-float);
        }

        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .card-header {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0;
            letter-spacing: -0.01em;
        }

        .btn-excel-export {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            background: #059669;
            color: #ffffff;
            border: none;
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
            transition: all 0.2s ease;
        }
        .btn-excel-export:hover { background: #047857; transform: translateY(-1px); }

        .lookup-box {
            position: relative;
            margin-bottom: 14px;
        }

        .lookup-input {
            width: 100%;
            padding: 15px 20px 15px 48px;
            font-size: 14.5px;
            font-weight: 600;
            border: 1.5px solid var(--border-subtle);
            border-radius: var(--radius-pill);
            outline: none;
            background: #FFFFFF;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .lookup-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(194, 29, 29, 0.1);
        }

        .lookup-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 22px;
        }

        .quick-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .chip {
            background: #F7EDE6;
            border: 1px solid var(--border-subtle);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .chip:hover { background: var(--primary); color: #ffffff; border-color: var(--primary); transform: translateY(-1px); }

        .lookup-results-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }

        .btn-call-mini {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary-soft);
            color: var(--primary);
            border: 1px solid rgba(194, 29, 29, 0.2);
            text-decoration: none;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .btn-call-mini:hover { background: var(--primary); color: #ffffff; transform: scale(1.08); }

        .btn-wa-mini {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.1);
            color: #059669;
            border: 1px solid rgba(16, 185, 129, 0.25);
            text-decoration: none;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .btn-wa-mini:hover { background: #059669; color: #ffffff; transform: scale(1.08); }
    </style>
</head>
<body>

    <div id="pageLoadingOverlay">
        <div class="loader-spinner-box">
            <div class="loader-ring"></div>
            <img src="logo.svg?v=21.35" alt="Loading..." class="loader-logo" onerror="this.style.display='none'">
        </div>
        <div class="loader-text" style="font-weight: 700; font-size: 14px;">
            Loading Firebase Master Directory...
        </div>
    </div>

    <div id="header-container"></div>

    <main class="main-container">
        
        <div class="directory-header-wrap">
            <div class="header-badge">
                <span class="material-symbols-outlined" style="font-size: 15px;">hub</span>
                <span>APML Unified Enterprise Master Directory</span>
            </div>
            <h1 class="page-title">Master Search <span>Hubs &amp; Field Officers</span></h1>
            
            <span class="status-badge">
                <span class="material-symbols-outlined" style="font-size: 16px;">cloud_sync</span>
                Firebase Real-Time Synchronized (<span id="recordCount">0</span> Records)
            </span>
        </div>

        <section class="card" style="border: 2px solid var(--border-hover);">
            <div class="card-header-flex">
                <div class="card-header">
                    <span class="material-symbols-outlined">travel_explore</span>
                    Search Across All Hubs, Branches &amp; Field Officers
                </div>

                <button type="button" class="btn-excel-export" onclick="exportToExcel()">
                    <span class="material-symbols-outlined" style="font-size: 18px;">file_download</span>
                    <span>Download Excel Sheet</span>
                </button>
            </div>
            
            <div class="lookup-box">
                <span class="material-symbols-outlined lookup-icon">search</span>
                <input type="text" id="masterSearchInput" class="lookup-input" placeholder="Type city, branch code, officer name, or phone number...">
            </div>

            <div class="quick-chips">
                <span class="chip" onclick="filterByChip('MUM')">MUM</span>
                <span class="chip" onclick="filterByChip('PUN')">PUN</span>
                <span class="chip" onclick="filterByChip('GRGN')">GRGN</span>
                <span class="chip" onclick="filterByChip('AHMD')">AHMD</span>
                <span class="chip" onclick="filterByChip('DELHI')">DELHI</span>
                <span class="chip" onclick="filterByChip('BANGALORE')">BANGALORE</span>
            </div>

            <div id="masterResultsContainer" class="lookup-results-list"></div>
        </section>

    </main>

    <div id="footer-container"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- Core Scripts -->
    <script src="common.js?v=21.35"></script>
    <script src="directory.js?v=1"></script>

    <script>
        const db = firebase.database();
        const masterRef = db.ref('master_directory');

        let directoryHelper = null;
        let loadedMasterData = [];

        function hideLoadingOverlay() {
            const overlay = document.getElementById('pageLoadingOverlay');
            if (overlay) {
                overlay.classList.add('hide');
                setTimeout(() => { overlay.style.display = 'none'; }, 400);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            directoryHelper = new APMLDirectory('masterResultsContainer', 'masterSearchInput');

            // Listen to Firebase and auto-seed if empty
            masterRef.on('value', (snapshot) => {
                const data = snapshot.val();
                
                if (!data || Object.keys(data).length === 0) {
                    // Fetch Book1.xlsx and seed Firebase automatically
                    fetch('Book1.xlsx')
                        .then(res => res.arrayBuffer())
                        .then(buffer => {
                            const workbook = XLSX.read(buffer, { type: 'array' });
                            const firstSheetName = workbook.SheetNames[0];
                            const worksheet = workbook.Sheets[firstSheetName];
                            const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                            
                            // Skip header row (row index 0)
                            const rows = rawRows.slice(1);
                            const records = [];

                            rows.forEach((row, idx) => {
                                const category = String(row[0] || '').trim();
                                const location = String(row[1] || '').trim();
                                const designation = String(row[2] || '').trim();
                                const name = String(row[3] || '').trim();
                                const contact = row[4] !== undefined ? String(row[4]).trim() : '';
                                const notes = row[5] !== undefined ? String(row[5]).trim() : '';
                                const address = row[6] !== undefined ? String(row[6]).trim() : '';

                                if (!category && !name) return; // skip empty rows

                                let apm = "N/A";
                                let status = "Active";
                                if (category.includes('Field Officer') && notes.includes('APM Code:')) {
                                    const parts = notes.split('|');
                                    parts.forEach(p => {
                                        if (p.includes('APM Code:')) apm = p.replace('APM Code:', '').trim();
                                        if (p.includes('Status:')) status = p.replace('Status:', '').trim();
                                    });
                                }

                                records.push({
                                    category: category,
                                    location: location,
                                    designation: designation,
                                    name: name,
                                    contact: contact,
                                    notes: notes,
                                    apm: apm,
                                    status: status,
                                    address: address
                                });
                            });

                            const updates = {};
                            records.forEach((rec, i) => {
                                updates[i] = rec;
                            });

                            masterRef.set(updates).then(() => {
                                console.log("Firebase auto-seeded with " + records.length + " records from Book1.xlsx");
                            });
                        }).catch(err => {
                            console.error("Error auto-seeding from Book1.xlsx:", err);
                            hideLoadingOverlay();
                        });
                    return;
                }

                loadedMasterData = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                document.getElementById('recordCount').innerText = loadedMasterData.length;

                directoryHelper.setData(loadedMasterData);
                hideLoadingOverlay();
            });
        });

        function filterByChip(term) {
            const input = document.getElementById('masterSearchInput');
            if (input && directoryHelper) {
                input.value = term;
                directoryHelper.filterData(term);
            }
        }

        function exportToExcel() {
            if (!loadedMasterData || loadedMasterData.length === 0) {
                alert("No data available to export.");
                return;
            }

            const exportRows = loadedMasterData.map(item => ({
                "Category": item.category,
                "Location / Branch Code": item.location,
                "Designation / Role": item.designation,
                "Contact Person Name": item.name,
                "Contact Number": item.contact,
                "Notes / APM": item.notes || item.apm,
                "Address": item.address
            }));

            const worksheet = XLSX.utils.json_to_sheet(exportRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "APML Master Directory");

            const dateStr = new Date().toISOString().split('T')[0];
            XLSX.writeFile(workbook, `APML_Master_Directory_${dateStr}.xlsx`);
        }
    </script>
</body>
</html>
