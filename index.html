<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APML Employee Support Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2242%22 fill=%22none%22 stroke=%22%23b91c1c%22 stroke-width=%229%22/><text x=%2250%22 y=%2262%22 font-size=%2238%22 font-family=%22Arial, Helvetica, sans-serif%22 font-weight=%22900%22 fill=%22%23b91c1c%22 text-anchor=%22middle%22 letter-spacing=%22-1%22>KP</text></svg>">
<style>
  :root {
    --bg-main: #fcf8f8;
    --primary: #991b1b;
    --primary-dark: #7f1d1d;
    --primary-light: #fef2f2;
    --border-color: rgba(252, 165, 165, 0.4);
    --radius-sm: 8px;
    --radius-lg: 16px;
    --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }
  
  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    background: var(--bg-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #0f172a;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- TOP HEADER ---------- */
  .site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 64px;
    padding: 0 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    z-index: 100;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .github-profile-pic {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #fca5a5;
    background: #f1f5f9;
    box-shadow: 0 2px 6px rgba(153, 27, 27, 0.12);
  }

  .header-brand-name {
    font-size: 20px;
    color: var(--primary);
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: rgba(34, 197, 94, 0.1);
    border: 1px solid rgba(34, 197, 94, 0.25);
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    color: #15803d;
    margin-left: 8px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    background-color: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
  }

  /* ---------- HAMBURGER MENU TOP RIGHT ---------- */
  .menu-container {
    position: relative;
  }

  .hamburger-btn {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: var(--transition);
    box-shadow: 0 2px 8px rgba(153, 27, 27, 0.08);
  }

  .hamburger-btn:hover {
    background: var(--primary-light);
    border-color: var(--primary);
  }

  .hamburger-icon {
    width: 20px;
    height: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .hamburger-icon span {
    display: block;
    width: 100%;
    height: 2.5px;
    background-color: var(--primary);
    border-radius: 2px;
    transition: var(--transition);
  }

  /* DROPDOWN MENU */
  .dropdown-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    width: 260px;
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: var(--transition);
    z-index: 1000;
  }

  .dropdown-menu.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .menu-item-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 700;
    color: #0f172a;
    text-decoration: none;
    border-radius: var(--radius-sm);
    background: #fcf8f8;
    border: 1px solid transparent;
    transition: var(--transition);
  }

  .menu-item-btn:hover {
    background: var(--primary-light);
    color: var(--primary);
    border-color: rgba(252, 165, 165, 0.5);
    transform: translateX(3px);
  }

  .menu-item-btn .icon {
    font-size: 16px;
  }

  /* ---------- LANDING HERO SECTION ---------- */
  .hero-section {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 85vh;
    padding: 120px 24px 60px 24px;
    background: 
      radial-gradient(circle at 50% 30%, rgba(252, 165, 165, 0.25), transparent 60%),
      radial-gradient(circle at 80% 80%, rgba(254, 242, 242, 0.8), transparent 50%),
      linear-gradient(rgba(254, 242, 242, 0.85), rgba(254, 242, 242, 0.95)), 
      url('image_6c9245.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    position: relative;
    text-align: center;
  }

  .hero-section::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(153, 27, 27, 0.06) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    max-width: 620px;
    width: 100%;
    animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    z-index: 1;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .pill-tag {
    display: inline-block;
    padding: 6px 16px;
    background: rgba(255, 255, 255, 0.8);
    color: var(--primary);
    border: 1px solid rgba(252, 165, 165, 0.6);
    border-radius: 30px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 24px;
    box-shadow: 0 2px 8px rgba(153, 27, 27, 0.05);
    backdrop-filter: blur(4px);
  }

  .welcome-title {
    font-size: 50px;
    font-weight: 800;
    color: #0f172a;
    margin: 0 0 18px;
    letter-spacing: -0.03em;
    line-height: 1.15;
  }

  .welcome-title span {
    color: var(--primary);
  }

  .welcome-subtitle {
    font-size: 18px;
    color: #475569;
    margin: 0 auto 36px;
    line-height: 1.6;
    font-weight: 400;
    max-width: 520px;
  }

  .hero-actions {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .landing-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 18px 36px;
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
    background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%);
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-decoration: none;
    letter-spacing: -0.01em;
    transition: var(--transition);
    box-shadow: 0 8px 20px rgba(153, 27, 27, 0.3);
    overflow: hidden;
  }
