<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){var theme='light';try{var saved=localStorage.getItem('apml-theme');if(saved==='dark'||saved==='light')theme=saved;}catch(error){}document.documentElement.setAttribute('data-theme',theme);})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>APML Portal — Bug Report &amp; Feedback</title>
  <meta name="description" content="Report a bug or share feedback directly with the APML Portal administrator.">

  <link rel="icon" type="image/svg+xml" href="logo.svg?v=21.45">
  
  <!-- YOUR COMMON CSS -->
  <link rel="stylesheet" href="common.css?v=21.45">

  <!-- GOOGLE FONTS & MATERIAL ICONS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    :root {
      --primary: #b91c1c;
      --primary-dark: #881337;
      --primary-gradient: linear-gradient(135deg, #b91c1c 0%, #e11d48 50%, #f43f5e 100%);
      --primary-soft: rgba(185, 28, 28, 0.06);
      
      --bg-base: #FDF8F5;
      --surface-card: #FFFFFF;
      --surface-border: #ede4de;
      --surface-subtle: #f7ede6;
      
      --text-main: #292524;
      --text-secondary: #44403c;
      --text-muted: #78716c;
      --text-faint: #a8a29e;
      
      --radius-xl: 20px;
      --radius-pill: 9999px;
      
      --shadow-subtle: 0 4px 20px -2px rgba(120, 113, 108, 0.05);
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
      overflow-y: scroll !important;
      height: 100%;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    .ambient-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none !important;
      z-index: 0;
      background: 
        radial-gradient(circle at 50% 18%, rgba(254, 215, 202, 0.35) 0%, transparent 60%),
        radial-gradient(circle at 85% 85%, rgba(254, 226, 226, 0.25) 0%, transparent 55%);
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }

    main {
      flex: 1;
      width: 100%;
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 120px auto 80px;
      padding: 0 24px;
    }

    .bug-card {
      background: #FFFFFF;
      border: 1.5px solid var(--surface-border);
      border-radius: var(--radius-xl);
      padding: clamp(28px, 5vw, 42px);
      box-shadow: var(--shadow-subtle);
      width: 100%;
    }

    .bug-header {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--surface-border);
    }

    .bug-title {
      font-family: var(--font-display);
      font-size: clamp(26px, 4vw, 32px);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .bug-title span {
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .bug-sub {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
      line-height: 1.5;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .form-label {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .form-input, .form-textarea {
      width: 100%;
      background: var(--surface-subtle);
      border: 1.5px solid var(--surface-border);
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--primary);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.1);
    }

    .form-textarea {
      resize: vertical;
      min-height: 140px;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      padding: 15px;
      border-radius: var(--radius-pill);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(185, 28, 28, 0.25);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .form-actions-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--surface-border);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .btn-back:hover {
      color: var(--primary);
    }

    .success-alert {
      display: none;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 20px;
      align-items: center;
      gap: 10px;
    }

    /* Theme-aware surfaces and accessible form controls */
    html[data-theme="dark"] {
      --bg-base:#111827; --surface-card:#1e293b; --surface-border:#334155;
      --surface-subtle:#263449; --text-main:#f1f5f9; --text-secondary:#cbd5e1;
      --text-muted:#a8b4c5; --text-faint:#94a3b8;
    }
    html[data-theme="dark"] body { background:var(--bg-base); color:var(--text-main); }
    html[data-theme="dark"] .ambient-bg { opacity:.28; }
    html[data-theme="dark"] .bug-card { background:var(--surface-card); }
    html[data-theme="dark"] .form-input,html[data-theme="dark"] .form-textarea { background:var(--surface-subtle); color:var(--text-main); }
    html[data-theme="dark"] .form-input:focus,html[data-theme="dark"] .form-textarea:focus { background:#1e293b; }
    html[data-theme="dark"] .success-alert { background:#123126; border-color:#245c45; color:#a7f3d0; }
    .form-input,.form-textarea { min-height:48px; font-size:16px; }
    .btn-submit,.btn-back { min-height:48px; }
    .form-input:focus-visible,.form-textarea:focus-visible,.btn-submit:focus-visible,.btn-back:focus-visible { outline:3px solid rgba(185,28,28,.35); outline-offset:2px; }
    @media(max-width:520px){ main { padding-left:16px; padding-right:16px; margin-top:96px; margin-bottom:52px; } .bug-card { padding:24px 18px; } .form-actions-row { gap:12px; flex-wrap:wrap; } }
  </style>

</head>
<body>

  <!-- Ambient Background -->
  <div class="ambient-bg"></div>

  <!-- COMMON HEADER -->
  <div id="header-container"></div>

  <main>
    <div class="bug-card">
      <div class="bug-header">
        <h1 class="bug-title">Report a <span>Bug</span></h1>
        <p class="bug-sub">Found an issue? Describe it below and send it directly to the administrator via Telegram.</p>
      </div>

      <div class="success-alert" id="successAlert">
        <span class="material-symbols-outlined" style="font-size: 20px; color: #16a34a;">check_circle</span>
        <span>Your report has been submitted for Telegram notification. Thank you!</span>
      </div>


      <form id="bugReportForm" onsubmit="submitBugReportToTelegram(event)">
        
        <div class="form-group">
          <label class="form-label" for="reporterName">Your Name / HOD / Officer</label>
          <input type="text" id="reporterName" class="form-input" placeholder="Enter your name or designation" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="bugMessage">Bug Description &amp; Details</label>
          <textarea id="bugMessage" class="form-textarea" placeholder="Describe what went wrong, steps to reproduce, or module name..." required></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBugBtn">
          <span class="material-symbols-outlined" style="font-size: 20px;">send</span>
          <span>Send Report</span>
        </button>
      </form>

      <div class="form-actions-row">
        <a href="index.html" class="btn-back">
          <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
          <span>Return to Workspace</span>
        </a>
      </div>
    </div>
  </main>

  <!-- COMMON FOOTER -->
  <div id="footer-container"></div>

  <!-- COMMON JS -->
  <script src="common.js?v=22.7"></script>

  <!-- Telegram notification service -->
  <script src="notify.js?v=21.46"></script>
  <script>
    async function submitBugReportToTelegram(event) {
      event.preventDefault();
      const name = document.getElementById("reporterName").value.trim();
      const message = document.getElementById("bugMessage").value.trim();
      const submitBtn = document.getElementById("submitBugBtn");
      const successAlert = document.getElementById("successAlert");
      if (!name || !message) return;

      if (!window.APMNotify || typeof window.APMNotify.send !== "function") {
        if (window.Swal) Swal.fire({ icon: "error", title: "Notification unavailable", text: "Please try again in a moment." });
        else alert("Notification service is unavailable. Please try again in a moment.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = "<span>Sending report...</span>";
      try {
        window.APMNotify.send({
          type: "bug",
          title: "New APML Portal bug report",
          file: name,
          folder: message.slice(0, 700)
        });
        successAlert.style.display = "flex";
        document.getElementById("bugReportForm").reset();
        window.scrollTo({ top: 0, behavior: "smooth" });
        setTimeout(() => { successAlert.style.display = "none"; }, 6000);
      } catch (err) {
        if (window.Swal) Swal.fire({ icon: "error", title: "Could not send report", text: err.message });
        else alert("Could not send report: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 20px;">send</span><span>Send Report</span>';
      }
    }
  </script>
</body>
</html>
