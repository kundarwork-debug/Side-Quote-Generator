<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hub &amp; Branch Directory - APML Portal</title>

  <!-- Network/Hub SVG Favicon from root folder -->
  <link rel="icon" type="image/svg+xml" href="logo.svg">

  <!-- STANDARD COMMON CSS -->
  <link rel="stylesheet" href="common.css?v=2.2">

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    :root {
      --primary: #b91c1c;
      --primary-dark: #881337;
      --primary-soft: rgba(185, 28, 28, 0.08);
      --primary-glow: rgba(185, 28, 28, 0.22);
      --bg-base: #f8fafc;
      --surface: #ffffff;
      --surface-glass: rgba(255, 255, 255, 0.94);
      --surface-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --radius-pill: 9999px;
      --shadow-sm: 0 2px 8px -2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 12px 30px -8px rgba(15, 23, 42, 0.08);
      --transition-m3: all 0.25s cubic-bezier(0.2, 0, 0, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle ambient background glow */
    .ambient-mesh {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      background: 
        radial-gradient(circle at 10% 15%, rgba(185, 28, 28, 0.05) 0%, transparent 45%),
        radial-gradient(circle at 90% 85%, rgba(225, 29, 72, 0.04) 0%, transparent 40%);
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      flex: 1;
      padding-top: 84px;
      padding-bottom: 50px;
    }

    .directory-shell {
      max-width: 1140px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Header Section */
    .directory-header {
      text-align: center;
      margin-bottom: 8px;
    }

    .directory-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: var(--primary-soft);
      border: 1px solid rgba(185, 28, 28, 0.2);
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .directory-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(26px, 5vw, 36px);
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .directory-title span {
      color: var(--primary);
    }

    .directory-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 580px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* Search & Filter Bar */
    .search-filter-card {
      background: var(--surface-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-xl);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-input-wrap {
      flex: 1;
      min-width: 240px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-pill);
      padding: 10px 16px;
      transition: var(--transition-m3);
    }

    .search-input-wrap:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.12);
    }

    .search-input-wrap input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 14px;
      color: var(--text-main);
      background: transparent;
    }

    .zone-filters {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .zone-filters::-webkit-scrollbar {
      display: none;
    }

    .zone-chip {
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--surface-border);
      background: #ffffff;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition-m3);
    }

    .zone-chip:hover {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: rgba(185, 28, 28, 0.3);
    }

    .zone-chip.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* Branch Directory Grid */
    .branch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .branch-card {
      background: var(--surface-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-xl);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      transition: var(--transition-m3);
    }

    .branch-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: rgba(185, 28, 28, 0.3);
    }

    .branch-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .branch-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.25;
    }

    .zone-badge {
      font-size: 11px;
      font-weight: 800;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .branch-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .branch-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.45;
    }

    .branch-row .material-symbols-outlined {
      font-size: 18px;
      color: var(--primary);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .branch-row strong {
      color: var(--text-main);
    }

    .branch-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--surface-border);
      margin-top: auto;
    }

    .btn-contact {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      background: var(--primary-soft);
      border: 1px solid rgba(185, 28, 28, 0.2);
      border-radius: var(--radius-pill);
      color: var(--primary);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 700;
      transition: var(--transition-m3);
    }

    .btn-contact:hover {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .btn-map {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      background: #ffffff;
      border: 1px solid var(--surface-border);
      border-radius: 50%;
      color: var(--text-main);
      text-decoration: none;
      transition: var(--transition-m3);
      flex-shrink: 0;
    }

    .btn-map:hover {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: var(--primary);
      transform: scale(1.05);
    }

    @media (max-width: 640px) {
      .directory-shell {
        padding: 14px;
      }
      .search-filter-card {
        flex-direction: column;
        align-items: stretch;
      }
      .branch-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Lighting -->
  <div class="ambient-mesh"></div>

  <!-- Dynamic Common Header -->
  <div id="header-container"></div>

  <main>
    <div class="directory-shell">

      <!-- Header -->
      <div class="directory-header">
        <div class="directory-badge">
          <span class="material-symbols-outlined" style="font-size: 15px;">location_city</span>
          <span>Pan-India Logistics Network</span>
        </div>
        <h1 class="directory-title">Hub &amp; <span>Branch Directory</span></h1>
        <p class="directory-subtitle">Direct contacts, warehouse hubs, operations managers, and navigation links across all major destinations.</p>
      </div>

      <!-- Search & Zone Filters -->
      <div class="search-filter-card">
        <div class="search-input-wrap">
          <span class="material-symbols-outlined" style="color: var(--text-muted); font-size: 20px;">search</span>
          <input type="text" id="branchSearch" placeholder="Search city, hub, manager name, or phone number..." autocomplete="off">
        </div>

        <div class="zone-filters">
          <button class="zone-chip active" data-zone="all">All Hubs</button>
          <button class="zone-chip" data-zone="North">North</button>
          <button class="zone-chip" data-zone="West">West</button>
          <button class="zone-chip" data-zone="South">South</button>
          <button class="zone-chip" data-zone="East">East</button>
        </div>
      </div>

      <!-- Branch Grid -->
      <div class="branch-grid" id="branchContainer"></div>

    </div>
  </main>

  <!-- Dynamic Common Footer -->
  <div id="footer-container"></div>

  <!-- Standard Common Script -->
  <script src="common.js?v=2.2"></script>

  <script>
    const HUBS_DATA = [
      {
        city: "Delhi / NCR (Head Hub)",
        zone: "North",
        address: "7737/XV Ram Nagar, Qutub Road, Paharganj, New Delhi - 110063",
        manager: "Rajesh Sharma (Hub Incharge)",
        phone: "+91 9667724226",
        mapQuery: "Paharganj New Delhi"
      },
      {
        city: "Mumbai (Bhiwandi Hub)",
        zone: "West",
        address: "Bldg No. B-3, Gala No. 5/6, Harihar Complex, Mankoli Naka, Bhiwandi, Thane - 421302",
        manager: "Sunil Patil (Operations HOD)",
        phone: "+91 9324814101",
        mapQuery: "Harihar Complex Bhiwandi Thane"
      },
      {
        city: "Bengaluru (Nelamangala Hub)",
        zone: "South",
        address: "Survey No. 44/2, NH-4, Near Sondekoppa Cross, Nelamangala, Bengaluru - 562123",
        manager: "Venkatesh Rao (Branch Manager)",
        phone: "+91 9341221104",
        mapQuery: "Nelamangala Bangalore"
      },
      {
        city: "Hyderabad (Medchal Hub)",
        zone: "South",
        address: "Plot No. 12, Industrial Area, Medchal, Hyderabad, Telangana - 501401",
        manager: "K. Ramesh (Regional Head)",
        phone: "+91 9391033221",
        mapQuery: "Medchal Hyderabad"
      },
      {
        city: "Kolkata (Dankuni Hub)",
        zone: "East",
        address: "Delhi Road, Near Toll Plaza, Dankuni, Hooghly, West Bengal - 712311",
        manager: "Subhashis Roy (Hub Supervisor)",
        phone: "+91 9331045512",
        mapQuery: "Dankuni Toll Plaza Kolkata"
      },
      {
        city: "Pune (Chakan Hub)",
        zone: "West",
        address: "Gat No. 234, Pune-Nashik Highway, Mahalunge, Chakan, Pune - 410501",
        manager: "Amol Deshmukh (Logistics Incharge)",
        phone: "+91 9371052219",
        mapQuery: "Chakan Pune"
      },
      {
        city: "Chennai (Poonamallee Hub)",
        zone: "South",
        address: "No. 18, Trunk Road, Poonamallee, Chennai, Tamil Nadu - 600056",
        manager: "M. Murugan (Operations Lead)",
        phone: "+91 9381023344",
        mapQuery: "Poonamallee Chennai"
      },
      {
        city: "Ahmedabad (Aslali Hub)",
        zone: "West",
        address: "National Highway 8, Near Aslali Bypass, Ahmedabad, Gujarat - 382427",
        manager: "Jignesh Patel (Branch HOD)",
        phone: "+91 9376124450",
        mapQuery: "Aslali Ahmedabad"
      },
      {
        city: "Jaipur (VKI Area Hub)",
        zone: "North",
        address: "Road No. 14, Vishwakarma Industrial Area, Jaipur, Rajasthan - 302013",
        manager: "Vikram Rathore (Hub Manager)",
        phone: "+91 9314051188",
        mapQuery: "Vishwakarma Industrial Area Jaipur"
      }
    ];

    let activeZone = "all";
    let searchQuery = "";

    function renderHubs() {
      const container = document.getElementById("branchContainer");
      container.innerHTML = "";

      const filtered = HUBS_DATA.filter((hub) => {
        const matchesZone = activeZone === "all" || hub.zone.toLowerCase() === activeZone.toLowerCase();
        const q = searchQuery.toLowerCase().trim();
        const matchesSearch = !q || 
          hub.city.toLowerCase().includes(q) ||
          hub.address.toLowerCase().includes(q) ||
          hub.manager.toLowerCase().includes(q) ||
          hub.phone.replace(/[^0-9]/g, '').includes(q.replace(/[^0-9]/g, ''));
        return matchesZone && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 48px 20px; color: var(--text-muted);">
            <span class="material-symbols-outlined" style="font-size: 48px; color: #cbd5e1; margin-bottom: 8px;">search_off</span>
            <p style="font-weight: 700; font-size: 15px; color: var(--text-main);">No Hubs Found</p>
            <p style="font-size: 13px;">Try searching for another city, zone, or manager name.</p>
          </div>
        `;
        return;
      }

      filtered.forEach((hub) => {
        const card = document.createElement("div");
        card.className = "branch-card";
        card.innerHTML = `
          <div>
            <div class="branch-header">
              <h2 class="branch-name">${hub.city}</h2>
              <span class="zone-badge">${hub.zone}</span>
            </div>

            <div class="branch-body" style="margin-top: 14px;">
              <div class="branch-row">
                <span class="material-symbols-outlined">person</span>
                <span><strong>${hub.manager}</strong></span>
              </div>
              <div class="branch-row">
                <span class="material-symbols-outlined">call</span>
                <span>${hub.phone}</span>
              </div>
              <div class="branch-row">
                <span class="material-symbols-outlined">location_on</span>
                <span>${hub.address}</span>
              </div>
            </div>
          </div>

          <div class="branch-actions">
            <a href="tel:${hub.phone.replace(/[^0-9+]/g, '')}" class="btn-contact">
              <span class="material-symbols-outlined" style="font-size: 16px;">phone_forwarded</span>
              <span>Call Hub</span>
            </a>
            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(hub.mapQuery + ' APML')}" target="_blank" rel="noopener noreferrer" class="btn-map" title="Open in Google Maps">
              <span class="material-symbols-outlined" style="font-size: 18px;">near_me</span>
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Zone Filter Chips Engine
    document.querySelectorAll(".zone-chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".zone-chip").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeZone = btn.dataset.zone;
        renderHubs();
      });
    });

    // Search Engine
    document.getElementById("branchSearch").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderHubs();
    });

    document.addEventListener("DOMContentLoaded", renderHubs);
  </script>
</body>
</html>
