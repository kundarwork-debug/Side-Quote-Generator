<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>APML Portal — Enterprise Cloud Drive</title>

  <link rel="icon" type="image/svg+xml" href="logo.svg?v=22.3">
  <link rel="stylesheet" href="common.css?v=22.3">

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- SWEETALERT2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- SIMPLELIGHTBOX CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/simplelightbox/2.14.2/simple-lightbox.min.css" />

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --primary: #c21d1d;
      --primary-dark: #991b1b;
      --primary-gradient: linear-gradient(135deg, #c21d1d 0%, #e11d48 50%, #f43f5e 100%);
      --primary-soft: rgba(194, 29, 29, 0.08);
      
      --bg-base: #F5EFEB;
      --surface-glass: rgba(255, 255, 255, 0.88);
      --surface-card: rgba(255, 255, 255, 0.95);
      
      --border-subtle: rgba(225, 212, 204, 0.85);
      --border-hover: rgba(194, 29, 29, 0.35);
      
      --text-main: #141210;
      --text-secondary: #3d3835;
      --text-muted: #736b66;
      --text-faint: #a8a29e;
      
      --radius-xl: 18px;
      --radius-pill: 9999px;
      
      --shadow-card: 0 1px 3px rgba(28, 25, 23, 0.04), 0 8px 24px -4px rgba(28, 25, 23, 0.03);
      --shadow-float: 0 20px 40px -12px rgba(194, 29, 29, 0.12), 0 4px 12px rgba(0, 0, 0, 0.02);
      
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
      overflow-y: scroll !important;
      height: 100%;
    }

    body {
      background: radial-gradient(circle at 85% 10%, rgba(194, 29, 29, 0.12) 0%, transparent 55%),
                  radial-gradient(circle at 10% 85%, rgba(153, 27, 27, 0.08) 0%, transparent 50%),
                  linear-gradient(135deg, #F2ECE4 0%, #EAE2D8 100%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: visible !important;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 30%, rgba(234, 226, 216, 0.45) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* LIGHT THEME TRUCK LOADING SCREEN STYLES (MATCHING DIRECTORY.HTML) */
    #pageLoadingOverlay {
      position: fixed;
      inset: 0;
      background: #FDF8F5;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    #pageLoadingOverlay.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card-box {
      background-color: #FFFFFF;
      padding: 2rem 2.5rem;
      border-radius: 1.25rem;
      border: 1.5px solid var(--border-subtle);
      box-shadow: 0 12px 30px rgba(120, 113, 108, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .loader {
      width: fit-content;
      height: fit-content;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .truckWrapper {
      width: 200px;
      height: 100px;
      display: flex;
      flex-direction: column;
      position: relative;
      align-items: center;
      justify-content: flex-end;
      overflow-x: hidden;
    }

    .truckBody {
      width: 130px;
      height: fit-content;
      margin-bottom: 6px;
      animation: motion 1s linear infinite;
    }

    @keyframes motion {
      0% { transform: translateY(0px); }
      50% { transform: translateY(3px); }
      100% { transform: translateY(0px); }
    }

    .truckTires {
      width: 130px;
      height: fit-content;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0px 10px 0px 15px;
      position: absolute;
      bottom: 0;
    }
    .truckTires svg {
      width: 24px;
    }

    .road {
      width: 100%;
      height: 1.5px;
      background-color: #282828;
      position: relative;
      bottom: 0;
      align-self: flex-end;
      border-radius: 3px;
    }
    .road::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 100%;
      background-color: #282828;
      right: -50%;
      border-radius: 3px;
      animation: roadAnimation 1.4s linear infinite;
      border-left: 10px solid white;
    }
    .road::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 100%;
      background-color: #282828;
      right: -65%;
      border-radius: 3px;
      animation: roadAnimation 1.4s linear infinite;
      border-left: 4px solid white;
    }

    .lampPost {
      position: absolute;
      bottom: 0;
      right: -90%;
      height: 90px;
      animation: roadAnimation 1.4s linear infinite;
    }

    @keyframes roadAnimation {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-350px); }
    }

    .loading-label {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    #header-container {
      position: sticky !important;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    .drive-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px 80px;
      margin-top: 110px !important;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .drive-head-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .drive-title {
      font-family: var(--font-display);
      font-size: clamp(30px, 4vw, 42px);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .drive-title span {
      font-family: var(--font-display);
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .drive-sub-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .drive-sub {
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 500;
    }

    .drive-stats-pills {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--border-subtle);
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .stat-pill strong {
      color: var(--primary);
    }

    .drive-action-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--surface-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 18px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-card);
    }

    .breadcrumb-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }

    .breadcrumb-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--primary);
    }

    .breadcrumb-item:hover {
      text-decoration: underline;
    }

    .drive-action-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-drive-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1.5px solid var(--border-subtle);
      color: var(--text-main);
      padding: 9px 18px;
      border-radius: var(--radius-pill);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
    }

    .btn-drive-action:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }

    .btn-drive-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 4px 14px rgba(194, 29, 29, 0.2);
    }

    .btn-drive-primary:hover {
      background: var(--primary-dark);
      color: #ffffff;
    }

    .drive-section-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .folders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .folder-card {
      background: var(--surface-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: all 0.2s ease;
    }

    .folder-card:hover, .folder-card.drag-over {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-float);
      background: #fff5f5;
    }

    .folder-card-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .folder-card-left .material-symbols-outlined {
      color: var(--primary);
      font-size: 24px;
    }

    .folder-card-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .folder-delete-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .folder-delete-btn:hover {
      background: #fee2e2;
      color: #dc2626;
    }

    .drive-files-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }

    @media (max-width: 1100px) {
      .drive-files-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .drive-files-grid {
        grid-template-columns: 1fr;
      }
    }

    .drive-file-grid-card {
      background: var(--surface-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      cursor: grab;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .drive-file-grid-card:active {
      cursor: grabbing;
    }

    .drive-file-grid-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-hover);
      box-shadow: var(--shadow-float);
      background: #ffffff;
    }

    .grid-preview-box {
      width: 100%;
      height: 180px;
      background: #0f172a;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      display: block;
    }

    .grid-preview-box img, .grid-preview-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preview-placeholder-doc { background: #f8fafc; }
    .preview-placeholder-excel { background: #f0fdf4; }
    .preview-placeholder-pdf { background: #fff1f2; }
    .preview-placeholder-zip { background: #fffbeb; }

    .grid-preview-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #475569;
    }

    .grid-preview-placeholder span.material-symbols-outlined {
      font-size: 42px;
    }

    .grid-preview-placeholder span.ext-badge {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      background: rgba(0,0,0,0.06);
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .card-loading-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #1e293b 0%, #334155 50%, #1e293b 100%);
      background-size: 200% 100%;
      animation: shimmerLoading 1.5s infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      gap: 10px;
      z-index: 10;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    @keyframes shimmerLoading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .card-loading-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .card-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .grid-card-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .file-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-timestamp {
      font-size: 10.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .file-details-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .file-type-pill {
      background: rgba(194, 29, 29, 0.08);
      color: var(--primary);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .file-pill-group {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .media-source-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1);
    }

    .file-size-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }

    .grid-card-footer {
      padding: 0 16px 16px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .btn-download-file {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #ffffff;
      background: var(--primary);
      border: none;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(194, 29, 29, 0.2);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-download-file:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .card-actions-admin {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-edit-file, .btn-delete-file {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 0;
    }

    .btn-edit-file {
      color: #2563eb;
      background: #eff6ff;
    }

    .btn-edit-file:hover {
      background: #2563eb;
      color: #ffffff;
    }

    .btn-delete-file {
      color: #dc2626;
      background: #fee2e2;
    }

    .btn-delete-file:hover {
      background: #dc2626;
      color: #ffffff;
    }

    /* PAGINATION */
    .pagination-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 36px;
      padding: 16px 24px;
      background: var(--surface-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    .pagination-pages-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-page {
      min-width: 40px;
      height: 40px;
      background: transparent;
      border: 1.5px solid transparent;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 0 6px;
    }

    .btn-page:hover:not(:disabled) {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .btn-page.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(194, 29, 29, 0.25);
    }

    .btn-page:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .page-ellipsis {
      padding: 0 4px;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .pagination-jump-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .jump-input {
      width: 56px;
      height: 34px;
      background: #ffffff;
      border: 1.5px solid var(--border-subtle);
      border-radius: 10px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .jump-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(194, 29, 29, 0.15);
    }

    .btn-jump-go {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1.5px solid transparent;
      padding: 0 14px;
      height: 34px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-jump-go:hover {
      background: var(--primary);
      color: #ffffff;
    }

    .state-msg {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
      font-weight: 600;
      background: var(--surface-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      grid-column: 1 / -1;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--border-subtle);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 900px) {
      .drive-container {
        margin-top: 95px !important;
      }
      .drive-action-bar {
        flex-direction: column;
        align-items: flex-start;
      }
      .drive-action-buttons {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

  <!-- LIGHT THEME TRUCK ANIMATION LOADING OVERLAY (MATCHING DIRECTORY.HTML) -->
  <div id="pageLoadingOverlay">
    <div class="loader-card-box">
      <div class="loader">
        <div class="truckWrapper">

    function getOptimizedUrl(originalUrl, width = 800) {
      if (!originalUrl || !originalUrl.includes('cloudinary.com')) return originalUrl;

    function hidePageLoader() {
      const overlay = document.getElementById('pageLoadingOverlay');

            <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.15v3.14C3.15 21.32 7.22 24 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.15C.42 8.1 0 9.77 0 11.5s.42 3.4 1.15 4.88l4.12-3.14z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.68 1.15 6.62l4.12 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>`;

          if (currentParentId === 'deleted') {
            currentParentId = 'root';
          }
          renderUI();

    const cachedFolders = localStorage.getItem(CACHE_KEY_FOLDERS);
    if (cachedFolders) {
      try {
        liveFolders = JSON.parse(cachedFolders);
        renderUI();
        hidePageLoader();
      } catch (e) {}
    }

    const cachedFiles = localStorage.getItem(CACHE_KEY_FILES);
    if (cachedFiles) {
      try {
        liveFiles = JSON.parse(cachedFiles);
        renderUI();
        hidePageLoader();
      } catch (e) {}
    }

    driveFoldersRef.on('value', (snapshot) => {
      const data = snapshot.val();
      liveFolders = [];
      if (data) {
        Object.keys(data).forEach(key => {
          liveFolders.push({ key, ...data[key] });
        });
      }
      try { localStorage.setItem(CACHE_KEY_FOLDERS, JSON.stringify(liveFolders)); } catch(e){}
      renderUI();
      hidePageLoader();
    });

    driveFilesRef.on('value', (snapshot) => {
      const data = snapshot.val();
      liveFiles = [];
      if (data) {
        Object.keys(data).forEach(key => {
          liveFiles.push({ key, ...data[key] });
        });
      }
      try { localStorage.setItem(CACHE_KEY_FILES, JSON.stringify(liveFiles)); } catch(e){}
      renderUI();
      hidePageLoader();
    });

    function navigateToFolder(folderId) {
      currentParentId = folderId;
      currentPage = 1;
      renderUI();
    }

    function goToPage(pageNum) {
      currentPage = pageNum;
      renderUI();
      window.scrollTo({ top: 200, behavior: 'smooth' });
    }

    function jumpToCustomPage(totalPages) {
      const input = document.getElementById('jumpPageInput');
      if (!input) return;
      const targetPage = parseInt(input.value);
      if (isNaN(targetPage) || targetPage < 1 || targetPage > totalPages) {
        alert(`Please enter a valid page number between 1 and ${totalPages}.`);
        input.focus();
        return;
      }
      goToPage(targetPage);
    }

    function promptCreateFolder() {
      const folderName = prompt("Enter new folder name:");
      if (!folderName || !folderName.trim()) return;

      driveFoldersRef.push({
        name: folderName.trim(),
        parentId: currentParentId,
        timestamp: Date.now()
      }).catch(err => alert("Failed to create folder: " + err.message));
    }

    async function handleDirectCatboxUpload(files) {
      if (!files || !files.length) return;
      let successCount = 0;

      for (let i = 0; i < files.length; i++) {
        let file = files[i];
        try {
          const isVideo = (file.type || '').startsWith('video/');
          const limit = isVideo ? MAX_VIDEO_SIZE_BYTES : MAX_FILE_SIZE_BYTES;
          if (file.size > limit) {
            alert(`${file.name} is too big (${(file.size / 1048576).toFixed(1)} MB). Skipping.`);
            continue;
          }

          const formData = new FormData();
          formData.append('file', file);
          formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
          formData.append('folder', CLOUDINARY_FOLDER);

          const res = await fetch(UPLOAD_ENDPOINT, { method: 'POST', body: formData });
          const data = await res.json().catch(() => ({}));

          if (!res.ok || !data.secure_url) {
            const msg = (data.error && data.error.message) || `HTTP ${res.status}`;
            throw new Error(msg);
          }

          await driveFilesRef.push({
            fileId: data.secure_url,
            parentId: currentParentId,
            name: file.name,
            size: file.size || 0,
            timestamp: Date.now()
          });

          successCount++;
        } catch (err) {
          console.error(`Error uploading "${file.name}":`, err);
          alert(`Failed to upload ${file.name}: ${err.message}`);
        }
      }

      document.getElementById('mediaFileInput').value = '';
      if (successCount > 0) {
        renderUI();
      }
    }

    async function editFileName(firebaseKey, currentName) {
      const newNameInput = prompt("Enter new file name:", currentName);
      if (!newNameInput || !newNameInput.trim()) return;

      let extension = '';
      if (currentName.includes('.')) {
        extension = currentName.substring(currentName.lastIndexOf('.'));
      }

      let cleanNewName = newNameInput.trim();
      if (extension && !cleanNewName.toLowerCase().endsWith(extension.toLowerCase())) {
        cleanNewName += extension;
      }

      try {
        await driveFilesRef.child(firebaseKey).update({ name: cleanNewName });
        renderUI();
      } catch (err) {
        alert("Failed to update file name: " + err.message);
      }
    }

    const PROTECTED_FOLDER_NAMES = ['quotation', 'quotations', 'prasad'];
    const PROTECTED_FOLDER_KEYS = ['quotation_folder', 'quotations_archive_protected'];

    function isProtectedFolderObj(folder) {
      if (!folder) return false;
      if (PROTECTED_FOLDER_KEYS.includes(folder.key)) return true;
      return PROTECTED_FOLDER_NAMES.includes(String(folder.name || '').trim().toLowerCase());
    }

    function isInsideProtectedTree(folderId) {
      let id = folderId;
      const seen = new Set();
      while (id && id !== 'root' && !seen.has(id)) {
        seen.add(id);
        const folder = liveFolders.find(f => f.key === id);
        if (!folder) return PROTECTED_FOLDER_KEYS.includes(id);
        if (isProtectedFolderObj(folder)) return true;
        id = folder.parentId;
      }
      return false;
    }

    function canDeleteItem(type, key) {
      if (isCurrentUserAdmin()) return true;
      if (type === 'file') {
        const file = liveFiles.find(f => f.key === key);
        return !(file && isInsideProtectedTree(file.parentId));
      }
      if (type === 'folder') {
        const folder = liveFolders.find(f => f.key === key);
        if (!folder) return true;
        return !(isProtectedFolderObj(folder) || isInsideProtectedTree(folder.parentId) || containsProtectedFolder(key));
      }
      return true;
    }

    function containsProtectedFolder(folderId) {
      const seen = new Set();
      const stack = [folderId];
      while (stack.length) {
        const current = stack.pop();
        if (seen.has(current)) continue;
        seen.add(current);
        liveFolders.filter(f => f.parentId === current).forEach(child => {
          if (isProtectedFolderObj(child)) { seen.add('__found__'); }
          stack.push(child.key);
        });
      }
      return seen.has('__found__');
    }

    function confirmDeleteAction(type, key) {
      if (!canDeleteItem(type, key)) {
        alert('Only the admin can delete protected folders and files.');
        return;
      }
      
      Swal.fire({
        title: "Are you sure?",
        text: "This file will be moved to trash archive!",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#c21d1d",
        cancelButtonColor: "#736b66",
        confirmButtonText: "Yes, delete it!"
      }).then((result) => {
        if (result.isConfirmed) {
          executeSoftDelete(type, key);
          Swal.fire({
            title: "Deleted!",
            text: "Your file has been moved to trash.",
            icon: "success",
            timer: 1500,
            showConfirmButton: false
          });
        }
      });
    }

    async function executeSoftDelete(type, key) {
      try {
        if (type === 'file') {
          await driveFilesRef.child(key).update({ parentId: 'deleted', prevParentId: currentParentId });
        } else if (type === 'folder') {
          await driveFoldersRef.child(key).update({ parentId: 'deleted', prevParentId: currentParentId });
        }
        renderUI();
      } catch (err) {
        alert("Failed to move item to trash: " + err.message);
      }
    }

    async function permanentDelete(type, key) {
      Swal.fire({
        title: "Delete Permanently?",
        text: "This cannot be undone!",
        icon: "error",
        showCancelButton: true,
        confirmButtonColor: "#dc2626",
        cancelButtonColor: "#736b66",
        confirmButtonText: "Yes, delete permanently!"
      }).then(async (result) => {
        if (result.isConfirmed) {
          try {
            if (type === 'file') {
              await driveFilesRef.child(key).remove();
            } else if (type === 'folder') {
              await driveFoldersRef.child(key).remove();
            }
            Swal.fire({
              title: "Permanently Deleted!",
              icon: "success",
              timer: 1200,
              showConfirmButton: false
            });
            renderUI();
          } catch (err) {
            alert("Error: " + err.message);
          }
        }
      });
    }

    // ---------- Drag and Drop File Handlers (Google Drive Style) ----------
    function handleDragStart(e, fileKey) {
      e.dataTransfer.setData('text/plain', fileKey);
    }

    function allowDrop(e) {
      e.preventDefault();
    }

    function handleDragEnter(e) {
      e.currentTarget.classList.add('drag-over');
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    async function handleDropOnFolder(e, targetFolderKey) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      const fileKey = e.dataTransfer.getData('text/plain');
      if (!fileKey) return;

      if (targetFolderKey === currentParentId) return;

      try {
        await driveFilesRef.child(fileKey).update({ parentId: targetFolderKey });
        Swal.fire({
          toast: true,
          position: 'top-end',
          icon: 'success',
          title: 'File moved successfully',
          showConfirmButton: false,
          timer: 2000
        });
        renderUI();
      } catch (err) {
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: 'Failed to move file: ' + err.message
        });
      }
    }

    // ---------- SweetAlert2 Catbox Link Prompt ----------
    function openCatboxModal() {
      Swal.fire({
        title: "Add file from Catbox",
        input: "url",
        inputLabel: "Catbox file link",
        inputPlaceholder: "https://files.catbox.moe/abc123.jpg",
        inputAttributes: {
          autocapitalize: "off",
          autocorrect: "off"
        },
        showCancelButton: true,
        confirmButtonText: "Add to Drive",
        showLoaderOnConfirm: true,
        preConfirm: async (url) => {
          try {
            if (!url) {
              Swal.showValidationMessage("Please enter a valid link");
              return false;
            }

            let u;
            try { u = new URL(url.trim()); } catch (e) {
              Swal.showValidationMessage("Please paste a full link starting with https://");
              return false;
            }

            let fileName = decodeURIComponent(u.pathname.split('/').filter(Boolean).pop() || 'file');
            
            await driveFilesRef.push({
              fileId: u.href,
              parentId: currentParentId,
              name: fileName,
              size: 0,
              timestamp: Date.now(),
              source: 'link'
            });

            return true;
          } catch (error) {
            Swal.showValidationMessage(`Request failed: ${error}`);
          }
        },
        allowOutsideClick: () => !Swal.isLoading()
      }).then((result) => {
        if (result.isConfirmed) {
          Swal.fire({
            title: "Added!",
            text: "Your file has been added to the drive successfully.",
            icon: "success"
          });
        }
      });
    }

    function getFileSource(url) {
      if (!url) return { label: 'Link', dotColor: '#64748b' };
      let host = '';
      try { host = new URL(url).hostname.toLowerCase(); } catch (e) {}
      if (host.includes('cloudinary.com')) return { label: 'Cloudinary', dotColor: '#3b82f6' };
      if (host.includes('catbox.moe')) return { label: 'Catbox', dotColor: '#000000' };
      return { label: 'Other', dotColor: '#64748b' };
    }

    function formatBytes(bytes, decimals = 1) {
      if (!bytes || bytes === 0) return 'Asset Link';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function formatTimestamp(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      if (isNaN(d.getTime())) return '';
      const day = String(d.getDate()).padStart(2, '0');
      const month = d.toLocaleDateString('en-IN', { month: 'short' });
      const year = d.getFullYear();
      let hours = d.getHours();
      const minutes = String(d.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      return `${day}${month} ${year}, ${hours}:${minutes} ${ampm}`;
    }

    async function handleItemDownload(firebaseKey, fileUrl, fileName) {
      totalMediaDownloadsRef.transaction((currentValue) => {
        return (currentValue || 0) + 1;
      });

      if (!fileUrl) {
        alert("File URL is missing.");
        return;
      }

      const saveBlob = (blob) => {
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = fileName || 'apml-asset';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => window.URL.revokeObjectURL(blobUrl), 4000);
      };
      const fetchBlob = async (url) => {
        const response = await fetch(url);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.blob();
      };

      try {
        saveBlob(await fetchBlob(fileUrl));
        return;
      } catch (err) {}

      const a = document.createElement('a');
      a.href = fileUrl;
      a.download = fileName || 'apml-asset';
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function renderUI() {
      renderBreadcrumb();

      const foldersGrid = document.getElementById('foldersGrid');
      const foldersSectionWrapper = document.getElementById('foldersSectionWrapper');
      const filesContainerWrapper = document.getElementById('filesContainerWrapper');

      let currentFolders = [];
      let rawFiles = [];

      if (currentParentId === 'deleted') {
        if (!isCurrentUserAdmin()) {
          filesContainerWrapper.innerHTML = `<div class="state-msg">Access Denied.</div>`;
          foldersSectionWrapper.style.display = 'none';
          return;
        }
        currentFolders = liveFolders.filter(f => f.parentId === 'deleted');
        rawFiles = liveFiles.filter(f => f.parentId === 'deleted');
      } else {
        currentFolders = liveFolders.filter(f => f.parentId === currentParentId && f.parentId !== 'deleted');
        rawFiles = liveFiles.filter(f => (f.parentId || 'root') === currentParentId && f.parentId !== 'deleted');
      }

      rawFiles.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      const activeTotalCount = liveFolders.filter(f => f.parentId !== 'deleted').length + liveFiles.filter(f => f.parentId !== 'deleted').length;
      document.getElementById('statTotalCount').textContent = activeTotalCount;

      if (currentParentId === 'root' && isCurrentUserAdmin()) {
        currentFolders.push({
          key: 'deleted',
          name: 'Trash Archive',
          parentId: 'root',
          isVirtualTrash: true
        });
      }

      if (currentFolders.length > 0) {
        foldersSectionWrapper.style.display = 'block';
        foldersGrid.innerHTML = currentFolders.map(folder => {
          if (folder.isVirtualTrash) {
            return `
              <div class="folder-card" ondblclick="navigateToFolder('deleted')" onclick="navigateToFolder('deleted')" title="Double click to open Trash Archive">
                <div class="folder-card-left">
                  <span class="material-symbols-outlined" style="color: #dc2626;">delete_sweep</span>
                  <span class="folder-card-name" title="Trash Archive">Trash Archive</span>
                </div>
              </div>
            `;
          }

          const isDeletedFolder = currentParentId === 'deleted';
          return `
            <div class="folder-card" ondblclick="navigateToFolder('${folder.key}')" onclick="navigateToFolder('${folder.key}')" ondragover="allowDrop(event)" ondragenter="handleDragEnter(event)" ondragleave="handleDragLeave(event)" ondrop="handleDropOnFolder(event, '${folder.key}')" title="Double click to open. Drop files here to move them.">
              <div class="folder-card-left">
                <span class="material-symbols-outlined">folder</span>
                <span class="folder-card-name" title="${folder.name}">${folder.name}</span>
              </div>
              ${isDeletedFolder ? `
                <button type="button" class="folder-delete-btn" onclick="event.stopPropagation(); permanentDelete('folder', '${folder.key}')" title="Delete Permanently">
                  <span class="material-symbols-outlined" style="font-size: 18px; color: #dc2626;">delete_forever</span>
                </button>
              ` : (canDeleteItem('folder', folder.key) ? `<button type="button" class="folder-delete-btn" onclick="event.stopPropagation(); confirmDeleteAction('folder', '${folder.key}')" title="Delete Folder">
                <span class="material-symbols-outlined" style="font-size: 18px;">close</span>
              </button>` : `<span class="material-symbols-outlined" style="font-size: 16px; opacity:0.5;" title="Protected - admin only">lock</span>`)}
            </div>
          `;
        }).join('');
      } else {
        foldersSectionWrapper.style.display = 'none';
        foldersGrid.innerHTML = '';
      }

      const totalPages = Math.ceil(rawFiles.length / ITEMS_PER_PAGE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const currentFiles = rawFiles.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      if (rawFiles.length > 0) {
        const isDeletedFolder = currentParentId === 'deleted';

        let filesHtml = `
          <div class="drive-files-grid">
            ${currentFiles.map(file => {
              const isImage = isImageFile(file.name, file.fileId);
              const isVideo = isVideoFile(file.name, file.fileId);
              
              const iconName = getFileIcon(file.name, file.fileId);
              const extName = getFileExtension(file.name);
              const formattedSize = formatBytes(file.size);
              const source = getFileSource(file.fileId);
              const formattedDate = formatTimestamp(file.timestamp);
              const themeClass = getThumbnailThemeClass(file.name, file.fileId);
              const iconColorStyle = getThumbnailIconColor(file.name, file.fileId);

              const optimizedThumbUrl = isImage ? getOptimizedUrl(file.fileId, 400) : file.fileId;
              const fullResUrl = isImage ? getOptimizedUrl(file.fileId, 1200) : file.fileId;

              let previewHtml = '';
              if (isImage) {
                previewHtml = `<img class="lozad" data-src="${optimizedThumbUrl}" alt="${file.name}" decoding="async" onload="hideCardLoader('${file.key}')" onerror="hideCardLoader('${file.key}')">`;
              } else if (isVideo) {
                previewHtml = `<video src="${file.fileId}" muted preload="metadata" onloadeddata="hideCardLoader('${file.key}')" onerror="hideCardLoader('${file.key}')"></video>`;
              } else {
                previewHtml = `
                  <div class="grid-preview-placeholder ${themeClass}">
                    <span class="material-symbols-outlined" style="${iconColorStyle}">${iconName}</span>
                    <span class="ext-badge">${extName}</span>
                  </div>
                `;
              }

              return `
                <div class="drive-file-grid-card" id="file-card-${file.key}" draggable="true" ondragstart="handleDragStart(event, '${file.key}')" title="Drag this card and drop it onto any folder to move it">
                  ${isImage ? `
                    <a href="${fullResUrl}" class="grid-preview-box simple-lightbox-item" title="${file.name || 'APML Drive Asset'}">
                      <div class="card-loading-overlay" id="card-loader-${file.key}">
                        <div class="card-spinner"></div>
                      </div>
                      ${previewHtml}
                    </a>
                  ` : isVideo ? `
                    <div class="grid-preview-box" onclick="openVideoLightbox('${file.key}', '${file.fileId}')" title="Click to preview video">
                      <div class="card-loading-overlay" id="card-loader-${file.key}">
                        <div class="card-spinner"></div>
                      </div>
                      ${previewHtml}
                    </div>
                  ` : `
                    <div class="grid-preview-box" onclick="handleItemDownload('${file.key}', '${file.fileId}', '${file.name}')" title="Click to download">
                      <div class="card-loading-overlay" id="card-loader-${file.key}">
                        <div class="card-spinner"></div>
                      </div>
                      ${previewHtml}
                    </div>
                  `}
                  <div class="grid-card-body">
                    <div class="file-name" title="${file.name}">${file.name}</div>
                    ${formattedDate ? `<div class="file-timestamp">${formattedDate}</div>` : ''}
                    <div class="file-details-row">
                      <span class="file-pill-group">
                        <span class="file-type-pill">${extName}</span>
                        <span class="media-source-dot" style="background-color: ${source.dotColor};" title="Stored on ${source.label}"></span>
                      </span>
                      <span class="file-size-label">${formattedSize}</span>
                    </div>
                  </div>
                  <div class="grid-card-footer">
                    <button type="button" class="btn-download-file" onclick="handleItemDownload('${file.key}', '${file.fileId}', '${file.name}')" title="Download">
                      <span class="material-symbols-outlined" style="font-size: 15px;">download</span> Download
                    </button>
                    <div class="card-actions-admin">
                      ${isDeletedFolder ? `
                        <button type="button" class="btn-delete-file" onclick="permanentDelete('file', '${file.key}')" title="Delete Permanently" style="background: #fee2e2; color: #dc2626;">
                          <span class="material-symbols-outlined" style="font-size: 14px;">delete_forever</span>
                        </button>
                      ` : `
                        <button type="button" class="btn-edit-file" onclick="editFileName('${file.key}', '${file.name.replace(/'/g, "\\'")}')" title="Edit File Name">
                          <span class="material-symbols-outlined" style="font-size: 14px;">edit</span>
                        </button>
                        ${canDeleteItem('file', file.key) ? `<button type="button" class="btn-delete-file" onclick="confirmDeleteAction('file', '${file.key}')" title="Delete">
                          <span class="material-symbols-outlined" style="font-size: 14px;">delete</span>
                        </button>` : ''}
                      `}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;

        if (!lightbox) {
          lightbox = new SimpleLightbox('.simple-lightbox-item', {
            captionsData: 'title',
            captionDelay: 200,
            animationSpeed: 250,
            fadeSpeed: 250
          });
        } else {
          lightbox.refresh();
        }

        if (typeof lozad !== 'undefined') {
          const observer = lozad('.lozad', { loaded: function(el) {} });
          observer.observe();
        }

        if (totalPages > 1) {
          filesHtml += `
            <div class="pagination-bar">
              <div class="pagination-pages-row">
                <button type="button" class="btn-page" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})" title="Previous Page">
                  <span class="material-symbols-outlined" style="font-size: 18px;">chevron_left</span>
                </button>
          `;

          let startPage = Math.max(1, currentPage - 1);
          let endPage = Math.min(totalPages, currentPage + 1);

          if (currentPage === 1) {
            endPage = Math.min(totalPages, 3);
          } else if (currentPage === totalPages) {
            startPage = Math.max(1, totalPages - 2);
          }

          if (startPage > 1) {
            filesHtml += `<button type="button" class="btn-page" onclick="goToPage(1)">1</button>`;
            if (startPage > 2) {
              filesHtml += `<span class="page-ellipsis">...</span>`;
            }
          }

          for (let p = startPage; p <= endPage; p++) {
            filesHtml += `<button type="button" class="btn-page ${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
          }

          if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
              filesHtml += `<span class="page-ellipsis">...</span>`;
            }
            filesHtml += `<button type="button" class="btn-page" onclick="goToPage(${totalPages})">${totalPages}</button>`;
          }

          filesHtml += `
                <button type="button" class="btn-page" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})" title="Next Page">
                  <span class="material-symbols-outlined" style="font-size: 18px;">chevron_right</span>
                </button>
              </div>
          `;

          if (totalPages > 3) {
            filesHtml += `
              <div class="pagination-jump-row">
                <span>Go to page:</span>
                <input type="number" id="jumpPageInput" class="jump-input" min="1" max="${totalPages}" placeholder="${currentPage}">
                <button type="button" class="btn-jump-go" onclick="jumpToCustomPage(${totalPages})">Go</button>
              </div>
            `;
          }

          filesHtml += `</div>`;
        }

        filesContainerWrapper.innerHTML = filesHtml;

        currentFiles.forEach(file => {
          const isImage = isImageFile(file.name, file.fileId);
          const isVideo = isVideoFile(file.name, file.fileId);
          if (!isImage && !isVideo) {
            hideCardLoader(file.key);
          }
        });

      } else if (currentFolders.length === 0) {
        filesContainerWrapper.innerHTML = `<div class="state-msg">This folder is empty. Create a subfolder or upload files above.</div>`;
      } else {
        filesContainerWrapper.innerHTML = ``;
      }
    }

    function renderBreadcrumb() {
      const nav = document.getElementById('breadcrumbNav');
      if (currentParentId === 'root') {
        nav.innerHTML = `
          <span class="breadcrumb-item">
            <span class="material-symbols-outlined" style="font-size: 18px;">folder</span> My Drive
          </span>
        `;
        return;
      }

      if (currentParentId === 'deleted') {
        nav.innerHTML = `
          <span class="breadcrumb-item" onclick="navigateToFolder('root')">
            <span class="material-symbols-outlined" style="font-size: 18px;">folder</span> My Drive
          </span>
          <span style="color: var(--text-muted);">/</span>
          <span class="breadcrumb-item" style="color: #dc2626;">Trash Archive</span>
        `;
        return;
      }

      let path = [];
      let currId = currentParentId;
      while (currId && currId !== 'root') {
        const folder = liveFolders.find(f => f.key === currId);
        if (!folder) break;
        path.unshift(folder);
        currId = folder.parentId;
      }

      let html = `
        <span class="breadcrumb-item" onclick="navigateToFolder('root')">
          <span class="material-symbols-outlined" style="font-size: 18px;">folder</span> My Drive
        </span>
      `;

      path.forEach(f => {
        html += ` <span style="color: var(--text-muted);">/</span> <span class="breadcrumb-item" onclick="navigateToFolder('${f.key}')">${f.name}</span>`;
      });

      nav.innerHTML = html;
    }

    function getFileExtension(filename) {
      if (!filename) return 'FILE';
      const parts = filename.split('.');
      return parts.length > 1 ? parts.pop().toUpperCase() : 'FILE';
    }

    function isImageFile(filename, url) {
      const pattern = /\.(jpg|jpeg|png|webp|gif)(\?.*)?$/i;
      return pattern.test(filename) || pattern.test(url);
    }

    function isVideoFile(filename, url) {
      const pattern = /\.(mp4|webm|ogg|mov)(\?.*)?$/i;
      return pattern.test(filename) || pattern.test(url);
    }

    function isHtmlFile(filename, url) {
      const pattern = /\.(html|htm)(\?.*)?$/i;
      return pattern.test(filename) || pattern.test(url);
    }

    function isExcelFile(filename, url) {
      const pattern = /\.(xls|xlsx|csv)(\?.*)?$/i;
      return pattern.test(filename) || pattern.test(url);
    }

    function getFileIcon(filename, url) {
      if (isImageFile(filename, url)) return 'image';
      if (isVideoFile(filename, url)) return 'movie';
      if (isHtmlFile(filename, url)) return 'code';
      if (isExcelFile(filename, url)) return 'table_chart';
      if (/\.pdf$/i.test(filename) || /\.pdf$/i.test(url)) return 'picture_as_pdf';
      if (/\.(zip|rar|7z|tar)$/i.test(filename)) return 'folder_zip';
      if (/\.(doc|docx)$/i.test(filename)) return 'article';
      return 'insert_drive_file';
    }

    function getThumbnailThemeClass(filename, url) {
      if (isExcelFile(filename, url)) return 'preview-placeholder-excel';
      if (isHtmlFile(filename, url)) return 'preview-placeholder-doc';
      if (/\.pdf$/i.test(filename) || /\.pdf$/i.test(url)) return 'preview-placeholder-pdf';
      if (/\.(zip|rar|7z|tar)$/i.test(filename)) return 'preview-placeholder-zip';
      return 'preview-placeholder-doc';
    }

    function getThumbnailIconColor(filename, url) {
      if (isExcelFile(filename, url)) return 'color: #059669;';
      if (isHtmlFile(filename, url)) return 'color: #7c3aed;';
      if (/\.pdf$/i.test(filename) || /\.pdf$/i.test(url)) return 'color: #dc2626;';
      if (/\.(zip|rar|7z|tar)$/i.test(filename)) return 'color: #d97706;';
      if (/\.(doc|docx)$/i.test(filename)) return 'color: #2563eb;';
      return 'color: var(--primary);';
    }

    function hideCardLoader(key) {
      const loader = document.getElementById(`card-loader-${key}`);
      if (loader) {
        loader.classList.add('fade-out');
      }
    }

    function openVideoLightbox(firebaseKey, videoUrl) {
      const overlay = document.getElementById('mediaLightboxModal');
      const slot = document.getElementById('lightboxMediaSlot');
      slot.innerHTML = `<video src="${videoUrl}" controls autoplay playsinline style="max-width:100%; max-height:80vh; border-radius:12px;"></video>`;
      overlay.classList.add('active');
    }

    function closeLightbox(evt) {
      if (evt.target.id === 'mediaLightboxModal' || evt.target.closest('.btn-lightbox-close')) {
        const overlay = document.getElementById('mediaLightboxModal');
        const slot = document.getElementById('lightboxMediaSlot');
        overlay.classList.remove('active');
        slot.innerHTML = '';
      }
    }

    window.addEventListener('resize', () => {
      renderUI();
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadFolderState();
    });
  </script>
