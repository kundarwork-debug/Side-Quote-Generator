<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>APML Portal — Admin Bug Reports Dashboard</title>
  <meta name="description" content="View and manage submitted bug reports and feedback from portal users.">

  <link rel="icon" type="image/svg+xml" href="logo.svg?v=21.45">
  
  <!-- YOUR COMMON CSS -->
  <link rel="stylesheet" href="common.css?v=21.45">

  <!-- GOOGLE FONTS & MATERIAL ICONS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    :root {
      --primary: #b91c1c;
      --primary-dark: #881337;
      --primary-gradient: linear-gradient(135deg, #b91c1c 0%, #e11d48 50%, #f43f5e 100%);
      --primary-soft: rgba(185, 28, 28, 0.06);
      
      --bg-base: #FDF8F5;
      --surface-card: #FFFFFF;
      --surface-border: #ede4de;
      --surface-subtle: #f7ede6;
      
      --text-main: #292524;
      --text-secondary: #44403c;
      --text-muted: #78716c;
      --text-faint: #a8a29e;
      
      --radius-xl: 20px;
      --radius-pill: 9999px;
      
      --shadow-subtle: 0 4px 20px -2px rgba(120, 113, 108, 0.05);
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
      overflow-y: scroll !important;
      height: 100%;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    .ambient-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none !important;
      z-index: 0;
      background: 
        radial-gradient(circle at 50% 18%, rgba(254, 215, 202, 0.35) 0%, transparent 60%),
        radial-gradient(circle at 85% 85%, rgba(254, 226, 226, 0.25) 0%, transparent 55%);
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1360px;
      margin: 110px auto 60px;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }

    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1.5px solid var(--surface-border);
    }

    .dash-title-group h1 {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .dash-title-group p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .reports-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
    }

    .report-card {
      background: var(--surface-card);
      border: 1.5px solid var(--surface-border);
      border-radius: var(--radius-xl);
      padding: 24px;
      box-shadow: var(--shadow-subtle);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .report-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -6px rgba(185, 28, 28, 0.1);
    }

    .report-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .reporter-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14.5px;
      color: var(--text-main);
    }

    .report-time {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-muted);
      background: var(--surface-subtle);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--surface-border);
    }

    .report-msg {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      background: var(--surface-subtle);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--surface-border);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .report-attachment {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
      padding-top: 12px;
      border-top: 1px dashed var(--surface-border);
    }

    .attachment-thumb {
      width: 72px;
      height: 72px;
      border-radius: 10px;
      object-fit: cover;
      border: 1.5px solid var(--surface-border);
      cursor: pointer;
      background: #f1f1f1;
      transition: transform 0.2s ease;
    }

    .attachment-thumb:hover {
      transform: scale(1.05);
    }

    .attachment-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .attachment-link {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .attachment-link:hover {
      text-decoration: underline;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: var(--surface-card);
      border: 1.5px solid var(--surface-border);
      border-radius: var(--radius-xl);
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 600;
    }

    .loading-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .reports-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Background -->
  <div class="ambient-bg"></div>

  <!-- COMMON HEADER -->
  <div id="header-container"></div>

  <main>
    <div class="dashboard-header">
      <div class="dash-title-group">
        <h1>Admin Bug Reports Dashboard</h1>
        <p>Live feed of feedback and issues submitted by portal personnel.</p>
      </div>
      <div id="totalReportsBadge" style="font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--primary); background: var(--primary-soft); border: 1px solid rgba(185, 28, 28, 0.2); padding: 6px 14px; border-radius: var(--radius-pill);">
        Loading reports...
      </div>
    </div>

    <div class="reports-grid" id="reportsGrid">
      <div class="loading-state">Loading bug reports from database...</div>
    </div>
  </main>

  <!-- COMMON FOOTER -->
  <div id="footer-container"></div>

  <!-- COMMON JS -->
  <script src="common.js?v=21.45"></script>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDgJ6uRCABWxAHOU1bIY4VuA-nQ0zM3aF8",
      authDomain: "apml-portal.firebaseapp.com",
      databaseURL: "https://apml-portal-default-rtdb.firebaseio.com",
      projectId: "apml-portal",
      storageBucket: "apml-portal.firebasestorage.app",
      messagingSenderId: "479017159240",
      appId: "1:479017159240:web:0853422718e6195b74a67d",
      measurementId: "G-4H1HT31DYB"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const bugReportsRef = db.ref("apml_bug_reports");

    const reportsGrid = document.getElementById("reportsGrid");
    const totalReportsBadge = document.getElementById("totalReportsBadge");

    bugReportsRef.on("value", (snapshot) => {
      reportsGrid.innerHTML = "";
      const data = snapshot.val();

      if (!data) {
        totalReportsBadge.textContent = "0 Reports Found";
        reportsGrid.innerHTML = `
          <div class="empty-state">
            <span class="material-symbols-outlined" style="font-size: 36px; color: var(--text-faint); margin-bottom: 8px;">inbox</span>
            <div>No bug reports or feedback submitted yet.</div>
          </div>
        `;
        return;
      }

      const reportsArray = Object.keys(data).map(key => ({
        id: key,
        ...data[key]
      })).reverse();

      totalReportsBadge.textContent = `${reportsArray.length} Total Report${reportsArray.length === 1 ? '' : 's'}`;

      reportsArray.forEach(report => {
        const card = document.createElement("div");
        card.className = "report-card";

        const imgLink = report.imageUrl;
        let attachmentHtml = "";
        
        if (imgLink && imgLink.length > 20) {
          const safeId = report.id || Math.random().toString(36).substring(7);
          attachmentHtml = `
            <div class="report-attachment">
              <a href="${imgLink}" target="_blank">
                <img src="${imgLink}" class="attachment-thumb" alt="Attached Screenshot" title="Click to view full size">
              </a>
              <div class="attachment-actions">
                <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Screenshot Attached</div>
                <a href="${imgLink}" target="_blank" class="attachment-link">
                  <span class="material-symbols-outlined" style="font-size: 15px;">open_in_new</span>
                  <span>View Full Size</span>
                </a>
                <a href="${imgLink}" download="bug-report-${safeId}.png" class="attachment-link" style="color: #059669;">
                  <span class="material-symbols-outlined" style="font-size: 15px;">download</span>
                  <span>Download Image</span>
                </a>
              </div>
            </div>
          `;
        }

        card.innerHTML = `
          <div>
            <div class="report-top">
              <div class="reporter-badge">
                <span class="material-symbols-outlined" style="color: var(--primary); font-size: 20px;">account_circle</span>
                <span>${escapeHtml(report.name || "Anonymous")}</span>
              </div>
              <div class="report-time">${report.dateString || "Just now"}</div>
            </div>
            <div class="report-msg" style="margin-top: 14px;">${escapeHtml(report.message || "")}</div>
          </div>
          <div>
            ${attachmentHtml}
          </div>
        `;

        reportsGrid.appendChild(card);
      });
    });

    function escapeHtml(text) {
      if (!text) return "";
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
    }
  </script>
</body>
</html>
