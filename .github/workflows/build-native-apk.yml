name: Build APML Native Android Preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/build-native-apk.yml'

permissions:
  contents: read

jobs:
  build-native-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile native Android preview
        working-directory: android-native
        run: gradle --no-daemon assembleDebug

      - name: Upload native preview APK
        uses: actions/upload-artifact@v4
        with:
          name: APML-Portal-Native-Preview
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
