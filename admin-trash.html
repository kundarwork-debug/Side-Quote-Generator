<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trash &amp; Data Recovery - APML Portal</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="common.css?v=2.2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    :root {
      --primary: #b91c1c;
      --primary-dark: #881337;
      --bg-base: #f8fafc;
      --surface-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius-xl: 18px;
      --radius-pill: 9999px;
      --transition-m3: all 0.25s cubic-bezier(0.2, 0, 0, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; padding-top: 64px; }
    .trash-container { max-width: 1140px; width: 100%; margin: 0 auto; padding: 32px 16px; flex: 1; display: flex; flex-direction: column; gap: 20px; }
    
    /* Passcode Gate */
    #authGate { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { background: #fff; border-radius: var(--radius-xl); padding: 32px; max-width: 380px; width: 100%; text-align: center; }

    /* Trash Cards */
    .trash-card { background: #ffffff; border: 1px solid var(--surface-border); border-radius: var(--radius-xl); padding: 24px; }
    .trash-item { background: #f8fafc; border: 1px solid var(--surface-border); border-left: 4px solid var(--primary); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .trash-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .trash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; font-size: 13px; margin-bottom: 12px; }
    
    .btn-restore { background: #dcfce7; color: #15803d; border: 1px solid #86efac; padding: 6px 16px; border-radius: var(--radius-pill); font-size: 12.5px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .btn-restore:hover { background: #15803d; color: #ffffff; }
    .btn-delete-perm { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; padding: 6px 16px; border-radius: var(--radius-pill); font-size: 12.5px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .btn-delete-perm:hover { background: #b91c1c; color: #ffffff; }
  </style>
</head>
<body>

  <!-- AUTH GATE -->
  <div id="authGate">
    <div class="auth-card">
      <span class="material-symbols-outlined" style="font-size: 48px; color: var(--primary);">delete_sweep</span>
      <h2 style="font-family: 'Space Grotesk', sans-serif; margin-top: 8px;">Trash &amp; Data Recovery</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px; margin-bottom: 20px;">Sign in with an authorized Google account to continue.</p>

      <button type="button" class="btn-google" onclick="signInWithGoogle()" style="width:100%; padding:10px; background:#fff; color:var(--text-main); border:2px solid var(--surface-border); border-radius:var(--radius-pill); font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.616z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A9.001 9.001 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>
      <p id="googleAuthError" style="font-size:12px; color:var(--primary); margin-top:8px; display:none;"></p>

      <button type="button" class="btn-back" onclick="goBack()" style="width:100%; padding:12px; margin-top:10px; background:#fff; color:var(--text-main); border:2px solid var(--surface-border); border-radius:var(--radius-pill); font-weight:700; cursor:pointer;">← Go Back</button>
    </div>
  </div>

  <!-- COMMON HEADER CONTAINER -->
  <div id="header-container"></div>

  <main class="trash-container" id="trashMain" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
      <div>
        <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 800;">Deleted Hubs &amp; Records Archive</h1>
        <p style="font-size: 13px; color: var(--text-muted);">Review deleted branches, restore them to the live directory, or permanently purge them.</p>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn-back" onclick="signOutAdmin()" style="padding: 8px 16px; background: #fff; border: 1px solid var(--surface-border); border-radius: var(--radius-pill); font-size: 13px; font-weight: 700; color: var(--text-main); display: inline-flex; align-items: center; gap: 4px; cursor:pointer;">
          <span class="material-symbols-outlined" style="font-size: 16px;">logout</span>
          <span>Sign Out</span>
        </button>
        <button class="btn-delete-perm" onclick="emptyEntireTrash()">
          <span class="material-symbols-outlined" style="font-size: 16px;">delete_forever</span>
          <span>Empty Entire Trash</span>
        </button>
        <a href="hub-details.html" style="text-decoration: none; padding: 8px 16px; background: #fff; border: 1px solid var(--surface-border); border-radius: var(--radius-pill); font-size: 13px; font-weight: 700; color: var(--text-main); display: inline-flex; align-items: center; gap: 4px;">
          <span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
          <span>Back to Directory</span>
        </a>
      </div>
    </div>

    <section class="trash-card">
      <div id="trashListContainer">
        <div style="text-align: center; color: var(--text-muted); padding: 30px;">Loading trash records...</div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script src="common.js?v=2.2"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDS5k4y3cudR_1FR_NbJQX_-m7XXyftCXI",
      authDomain: "apml-hub-directory.firebaseapp.com",
      databaseURL: "https://apml-hub-directory-default-rtdb.firebaseio.com",
      projectId: "apml-hub-directory",
      storageBucket: "apml-hub-directory.firebasestorage.app",
      messagingSenderId: "1042315421228",
      appId: "1:1042315421228:web:677ccc4eca1803cd8b1389",
      measurementId: "G-BVJY1VV84M"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();
    const googleProvider = new firebase.auth.GoogleAuthProvider();
    const hubsRef = db.ref('hubs');
    const trashRef = db.ref('deleted_hubs');

    // Only these Google accounts are allowed to unlock the trash via Google Sign-In.
    // Add/remove admin emails here.
    const ALLOWED_ADMIN_EMAILS = [
      "kundar701@gmail.com",
      "kundar.work@gmail.com"
    ];

    function showGoogleAuthError(msg) {
      const el = document.getElementById('googleAuthError');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function signInWithGoogle() {
      const errEl = document.getElementById('googleAuthError');
      if (errEl) errEl.style.display = 'none';
      auth.signInWithPopup(googleProvider)
        .then((result) => {
          const email = result.user && result.user.email;
          if (!email || !ALLOWED_ADMIN_EMAILS.includes(email.toLowerCase())) {
            auth.signOut();
            showGoogleAuthError("This Google account is not authorized for admin access.");
            return;
          }
          unlockTrashUI();
        })
        .catch((err) => {
          showGoogleAuthError("Sign-in failed: " + err.message);
        });
    }

    // If the user is already signed in (e.g. page refresh) and is an authorized admin, unlock automatically.
    auth.onAuthStateChanged((user) => {
      if (user && user.email && ALLOWED_ADMIN_EMAILS.includes(user.email.toLowerCase())) {
        unlockTrashUI();
      }
    });

    function unlockTrashUI() {
      document.getElementById('authGate').style.display = 'none';
      document.getElementById('trashMain').style.display = 'flex';
      loadTrash();
    }

    // Return to the previous page without unlocking
    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'hub-details.html';
      }
    }

    function loadTrash() {
      trashRef.on('value', (snap) => {
        const data = snap.val();
        const container = document.getElementById('trashListContainer');
        container.innerHTML = '';

        if (!data || Object.keys(data).length === 0) {
          container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px;">Trash is empty. No deleted branches found.</div>`;
          return;
        }

        Object.keys(data).forEach(id => {
          const item = data[id];
          const dateStr = item.deletedAt ? new Date(item.deletedAt).toLocaleString('en-IN') : 'N/A';
          const card = document.createElement('div');
          card.className = 'trash-item';
          card.innerHTML = `
            <div class="trash-meta">
              <h3 style="font-family:'Space Grotesk',sans-serif; font-size:17px; color:var(--primary); font-weight:800;">
                ${escapeHtml(item.city || 'Unknown Branch')} <span style="font-size:12px; color:var(--text-muted);">(${escapeHtml(item.region || 'HUB')})</span>
              </h3>
              <span style="font-size:11.5px; color:var(--text-muted);">Deleted on: ${dateStr}</span>
            </div>

            <div class="trash-grid">
              <div><strong>HUB Manager:</strong> ${escapeHtml(item.hod || '—')}</div>
              <div><strong>Branch Manager:</strong> ${escapeHtml(item.teamLeader || '—')}</div>
              <div><strong>Team Leader:</strong> ${escapeHtml(item.fieldOfficer || '—')}</div>
              <div><strong>BDO:</strong> ${escapeHtml(item.bdo || '—')}</div>
              <div><strong>BFO:</strong> ${escapeHtml(item.bfo || '—')}</div>
              <div><strong>Packing Incharge:</strong> ${escapeHtml(item.packingIncharge || '—')}</div>
              <div><strong>Packing Confirm:</strong> ${escapeHtml(item.packingConfirm || '—')}</div>
              <div style="grid-column: 1/-1;"><strong>Warehouse Address:</strong> ${escapeHtml(item.address || '—')}</div>
              ${item.officeAddress ? `<div style="grid-column: 1/-1;"><strong>Office Address:</strong> ${escapeHtml(item.officeAddress)}</div>` : ''}
            </div>

            <div style="display:flex; justify-content:flex-end; gap:8px;">
              <button class="btn-restore" onclick="restoreHub('${id}')">
                <span class="material-symbols-outlined" style="font-size:16px;">restore_from_trash</span>
                <span>Restore to Live</span>
              </button>
              <button class="btn-delete-perm" onclick="permanentlyDeleteHub('${id}', '${escapeHtml(item.city || '')}')">
                <span class="material-symbols-outlined" style="font-size:16px;">delete_forever</span>
                <span>Delete Permanently</span>
              </button>
            </div>
          `;
          container.appendChild(card);
        });
      });
    }

    // 1. Restore Hub back to active directory
    window.restoreHub = function(id) {
      if (!confirm("Restore this branch back to the live directory?")) return;

      trashRef.child(id).once('value', (snap) => {
        const data = snap.val();
        if (!data) return;

        const liveData = { ...data };
        delete liveData.deletedAt;
        delete liveData.deletedBy;

        hubsRef.child(id).set(liveData).then(() => {
          trashRef.child(id).remove();
          alert("Branch restored successfully!");
        }).catch(err => alert("Error: " + err.message));
      });
    };

    // 2. Permanently delete from trash
    window.permanentlyDeleteHub = function(id, cityName) {
      if (!confirm(`Permanently delete ${cityName || 'this branch'}? This action CANNOT be undone.`)) return;
      trashRef.child(id).remove().then(() => {
        alert("Record permanently deleted.");
      });
    };

    // 3. Clear entire trash
    window.emptyEntireTrash = function() {
      if (!confirm("Empty all records from the Trash? This action CANNOT be undone.")) return;
      trashRef.remove().then(() => {
        alert("Trash emptied successfully.");
      });
    };

    // Sign out and return to the locked state
    window.signOutAdmin = function() {
      auth.signOut().finally(() => {
        document.getElementById('trashMain').style.display = 'none';
        document.getElementById('authGate').style.display = 'flex';
      });
    };

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
